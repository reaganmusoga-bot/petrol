<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetroManager - Station Management System</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ── Custom Styles ─────────────────────────────────────────────── */
        :root {
            --primary: #0d6efd;
            --sidebar-width: 260px;
            --header-height: 60px;
            --bg-body: #f4f6f9;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background: var(--bg-body);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: #0b1a33;
            color: #b0c4de;
            padding: 0;
            z-index: 1050;
            transition: transform 0.3s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand {
            padding: 18px 20px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-brand i {
            font-size: 1.8rem;
            color: #ffc107;
        }
        .sidebar .nav-link {
            color: #b0c4de;
            padding: 12px 22px;
            border-radius: 0;
            border-left: 3px solid transparent;
            transition: 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-left-color: #ffc107;
        }
        .sidebar .nav-link i {
            width: 22px;
            font-size: 1.15rem;
        }
        .sidebar .nav-link .badge {
            margin-left: auto;
            background: #ffc107;
            color: #0b1a33;
        }
        .sidebar-footer {
            margin-top: auto;
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem;
            color: #6c8ab0;
        }
        /* Main content */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }
        /* Header */
        .top-header {
            height: var(--header-height);
            background: #fff;
            border-bottom: 1px solid #e9ecef;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1040;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .top-header .page-title {
            font-weight: 600;
            font-size: 1.2rem;
            color: #1a2a4a;
        }
        .top-header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .top-header .user-info .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
        }
        .top-header .user-info .role-badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: #e9ecef;
            color: #495057;
        }
        /* Page content */
        .page-content {
            padding: 25px 30px;
        }
        /* Cards & widgets */
        .stat-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef0f3;
            transition: 0.2s;
            height: 100%;
        }
        .stat-card:hover {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }
        .stat-card .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
        }
        .stat-card .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a2a4a;
        }
        .stat-card .stat-label {
            color: #6c7a8e;
            font-size: 0.9rem;
            font-weight: 500;
        }
        /* Tables */
        .table-container {
            background: #fff;
            border-radius: 14px;
            padding: 20px 22px;
            border: 1px solid #eef0f3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .table-container .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-container .table-header h5 {
            margin: 0;
            font-weight: 600;
            color: #1a2a4a;
        }
        /* Meter reading form */
        .meter-box {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 18px 22px;
            border: 1px solid #e9ecef;
        }
        .meter-box .meter-value {
            font-size: 2rem;
            font-weight: 700;
            color: #0b1a33;
            font-family: 'Courier New', monospace;
        }
        /* Shift badge */
        .shift-badge-day {
            background: #fff3cd;
            color: #856404;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .shift-badge-night {
            background: #d1ecf1;
            color: #0c5460;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
            .top-header {
                padding: 0 16px;
            }
            .page-content {
                padding: 16px;
            }
            .stat-card .stat-number {
                font-size: 1.4rem;
            }
            .sidebar-toggle {
                display: block !important;
            }
        }
        @media (min-width: 769px) {
            .sidebar-toggle {
                display: none !important;
            }
        }
        /* Misc */
        .cursor-pointer {
            cursor: pointer;
        }
        .text-muted-light {
            color: #8a9bb5;
        }
        .station-badge {
            background: #e7edf5;
            color: #1a2a4a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0b1a33 0%, #1a3a6a 100%);
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-card .logo i {
            font-size: 3rem;
            color: #ffc107;
            background: #0b1a33;
            padding: 14px;
            border-radius: 16px;
        }
        .login-card .logo h4 {
            margin-top: 12px;
            font-weight: 700;
            color: #0b1a33;
        }
        .login-card .logo p {
            color: #6c7a8e;
            font-size: 0.9rem;
        }
        /* toast */
        .toast-container {
            z-index: 9999;
        }
        /* hide sections by default */
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }
        /* scroll */
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #2a4a7a;
            border-radius: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        /* station selector in header */
        .station-selector {
            max-width: 200px;
        }
        .station-selector select {
            background: #f1f4f9;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1a2a4a;
        }
        .station-selector select:focus {
            box-shadow: none;
            background: #e9edf4;
        }
        /* inventory progress */
        .inventory-bar {
            height: 6px;
            border-radius: 4px;
            background: #e9ecef;
            overflow: hidden;
        }
        .inventory-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: var(--primary);
            transition: width 0.5s ease;
        }
        .inventory-bar .fill.warning {
            background: #ffc107;
        }
        .inventory-bar .fill.danger {
            background: #dc3545;
        }
        /* responsive table */
        .table-responsive-custom {
            overflow-x: auto;
        }
        /* shift active indicator */
        .shift-active {
            background: #d4edda;
            color: #155724;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .shift-inactive {
            background: #f8d7da;
            color: #721c24;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        /* small */
        .fs-small {
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- ═══ LOGIN SCREEN ═══════════════════════════════════════════════ -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="bi bi-fuel-pump"></i>
                <h4>PetroManager</h4>
                <p>Station Management System</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" id="loginUser" class="form-control form-control-lg" placeholder="Enter username" required autofocus />
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" id="loginPass" class="form-control form-control-lg" placeholder="Enter password" required />
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Sign In</button>
                <div id="loginError" class="text-danger text-center mt-3 small" style="display:none;">Invalid credentials. Please try again.</div>
            </form>
            <div class="mt-3 text-center text-muted small">
                <span class="d-block">Demo: admin / admin123  |  manager / manager123  |  cashier / cashier123</span>
            </div>
        </div>
    </div>

    <!-- ═══ MAIN APP ═══════════════════════════════════════════════════ -->
    <div id="appMain" style="display:none;">

        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <i class="bi bi-fuel-pump"></i>
                <span>PetroManager</span>
            </div>
            <div class="mt-2">
                <a class="nav-link active" data-page="dashboard" href="#"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a class="nav-link" data-page="sales" href="#"><i class="bi bi-cash-stack"></i> Daily Sales</a>
                <a class="nav-link" data-page="shifts" href="#"><i class="bi bi-clock-history"></i> Shifts</a>
                <a class="nav-link" data-page="inventory" href="#"><i class="bi bi-box-seam"></i> Inventory</a>
                <a class="nav-link" data-page="stock" href="#"><i class="bi bi-truck"></i> Stock Receiving</a>
                <a class="nav-link" data-page="adjustments" href="#"><i class="bi bi-sliders2"></i> Adjustments</a>
                <a class="nav-link" data-page="vendors" href="#"><i class="bi bi-people"></i> Vendors</a>
                <a class="nav-link" data-page="customers" href="#"><i class="bi bi-person-badge"></i> Customers</a>
                <a class="nav-link" data-page="expenses" href="#"><i class="bi bi-receipt"></i> Expenses</a>
                <a class="nav-link" data-page="payments" href="#"><i class="bi bi-credit-card"></i> Payments</a>
                <a class="nav-link" data-page="reports" href="#"><i class="bi bi-bar-chart-fill"></i> Reports</a>
                <a class="nav-link" data-page="users" href="#"><i class="bi bi-person-gear"></i> Users</a>
            </div>
            <div class="sidebar-footer">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-shield-check"></i>
                    <span id="sidebarUser">—</span>
                    <span class="ms-auto" id="sidebarRole" style="font-size:0.7rem;background:rgba(255,255,255,0.08);padding:2px 10px;border-radius:12px;">—</span>
                </div>
                <button id="logoutBtn" class="btn btn-sm btn-outline-light w-100 mt-2">
                    <i class="bi bi-box-arrow-right"></i> Sign Out
                </button>
            </div>
        </nav>

        <!-- Main -->
        <div class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light sidebar-toggle" id="sidebarToggle" style="border:none;background:transparent;font-size:1.4rem;">
                        <i class="bi bi-list"></i>
                    </button>
                    <span class="page-title" id="pageTitle">Dashboard</span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <!-- Station selector (only for admin/top admin) -->
                    <div class="station-selector" id="stationSelectorWrap">
                        <select id="stationSelector" class="form-select form-select-sm">
                            <option value="">All Stations</option>
                        </select>
                    </div>
                    <div class="user-info">
                        <span class="role-badge" id="headerRole">—</span>
                        <span class="fw-semibold" id="headerUser">—</span>
                        <div class="avatar" id="headerAvatar">U</div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content" id="pageContent">
                <!-- All page sections rendered here via JS -->
            </div>
        </div>
    </div>

    <!-- ═══ TOAST CONTAINER ═══════════════════════════════════════════ -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <!-- ═══ BOOTSTRAP JS ══════════════════════════════════════════════ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- ═══ MAIN APPLICATION ══════════════════════════════════════════ -->
    <script>
        // ─────────────────────────────────────────────────────────────
        //  PETROMANAGER — Full Application Logic
        // ─────────────────────────────────────────────────────────────

        // ── API Base (auto-detect) ──────────────────────────────────
        const API_BASE = window.location.origin + '/api';

        // ── State ────────────────────────────────────────────────────
        let state = {
            user: null, // { id, username, role, station_id, name }
            token: null,
            stations: [],
            currentStationId: null, // null = all stations
            currentPage: 'dashboard',
            shifts: [],
            inventory: [],
            sales: [],
            vendors: [],
            customers: [],
            expenses: [],
            payments: [],
            stockReceipts: [],
            adjustments: [],
            users: [],
        };

        // ── DOM refs ─────────────────────────────────────────────────
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const loginScreen = $('#loginScreen');
        const appMain = $('#appMain');
        const loginForm = $('#loginForm');
        const loginError = $('#loginError');
        const pageContent = $('#pageContent');
        const pageTitle = $('#pageTitle');
        const sidebarUser = $('#sidebarUser');
        const sidebarRole = $('#sidebarRole');
        const headerUser = $('#headerUser');
        const headerRole = $('#headerRole');
        const headerAvatar = $('#headerAvatar');
        const stationSelector = $('#stationSelector');
        const stationSelectorWrap = $('#stationSelectorWrap');
        const logoutBtn = $('#logoutBtn');
        const sidebarToggle = $('#sidebarToggle');
        const sidebar = $('#sidebar');

        // ── Toast helper ─────────────────────────────────────────────
        function showToast(message, type = 'success') {
            const container = document.querySelector('.toast-container');
            const colors = {
                success: 'bg-success text-white',
                danger: 'bg-danger text-white',
                warning: 'bg-warning text-dark',
                info: 'bg-info text-dark',
            };
            const html = `
                <div class="toast align-items-center ${colors[type] || colors.info} border-0 show" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            setTimeout(() => {
                const toasts = container.querySelectorAll('.toast');
                if (toasts.length) toasts[0].remove();
            }, 5000);
        }

        // ── Fetch wrapper ────────────────────────────────────────────
        async function apiFetch(endpoint, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...(state.token ? { 'Authorization': 'Bearer ' + state.token } : {}),
                ...options.headers,
            };
            const res = await fetch(API_BASE + endpoint, { ...options, headers });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || 'Request failed');
            }
            return res.json();
        }

        // ── Login ────────────────────────────────────────────────────
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = $('#loginUser').value.trim();
            const password = $('#loginPass').value.trim();
            loginError.style.display = 'none';
            try {
                const data = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password }),
                });
                state.token = data.token;
                state.user = data.user;
                localStorage.setItem('petro_token', state.token);
                localStorage.setItem('petro_user', JSON.stringify(state.user));
                await initApp();
            } catch (err) {
                loginError.textContent = err.message || 'Invalid credentials';
                loginError.style.display = 'block';
            }
        });

        // ── Logout ────────────────────────────────────────────────────
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('petro_token');
            localStorage.removeItem('petro_user');
            state.token = null;
            state.user = null;
            loginScreen.style.display = 'flex';
            appMain.style.display = 'none';
            showToast('Signed out', 'info');
        });

        // ── Sidebar toggle (mobile) ──────────────────────────────────
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        // ── Sidebar navigation ───────────────────────────────────────
        document.querySelectorAll('.sidebar .nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.dataset.page;
                if (page) navigateTo(page);
                if (window.innerWidth <= 768) sidebar.classList.remove('open');
            });
        });

        // ── Station selector ─────────────────────────────────────────
        stationSelector.addEventListener('change', () => {
            const val = stationSelector.value;
            state.currentStationId = val ? parseInt(val) : null;
            renderPage(state.currentPage);
        });

        // ── Navigation ──────────────────────────────────────────────
        function navigateTo(page) {
            state.currentPage = page;
            // update sidebar active
            document.querySelectorAll('.sidebar .nav-link').forEach(l => l.classList.remove('active'));
            const activeLink = document.querySelector(`.sidebar .nav-link[data-page="${page}"]`);
            if (activeLink) activeLink.classList.add('active');
            // title
            const titles = {
                dashboard: 'Dashboard',
                sales: 'Daily Sales',
                shifts: 'Shifts',
                inventory: 'Inventory',
                stock: 'Stock Receiving',
                adjustments: 'Stock Adjustments',
                vendors: 'Vendors',
                customers: 'Customers',
                expenses: 'Expenses',
                payments: 'Payments',
                reports: 'Reports',
                users: 'Users',
            };
            pageTitle.textContent = titles[page] || page;
            renderPage(page);
        }

        // ── Render page ─────────────────────────────────────────────
        function renderPage(page) {
            switch (page) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'sales':
                    renderSales();
                    break;
                case 'shifts':
                    renderShifts();
                    break;
                case 'inventory':
                    renderInventory();
                    break;
                case 'stock':
                    renderStockReceiving();
                    break;
                case 'adjustments':
                    renderAdjustments();
                    break;
                case 'vendors':
                    renderVendors();
                    break;
                case 'customers':
                    renderCustomers();
                    break;
                case 'expenses':
                    renderExpenses();
                    break;
                case 'payments':
                    renderPayments();
                    break;
                case 'reports':
                    renderReports();
                    break;
                case 'users':
                    renderUsers();
                    break;
                default:
                    pageContent.innerHTML = '<div class="alert alert-info">Page not found</div>';
            }
        }

        // ── INIT ─────────────────────────────────────────────────────
        async function initApp() {
            // load stations
            try {
                const st = await apiFetch('/stations');
                state.stations = st;
                // populate station selector
                stationSelector.innerHTML = '<option value="">All Stations</option>';
                st.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name + ' (' + s.location + ')';
                    stationSelector.appendChild(opt);
                });
                // if user has a station, select it
                if (state.user.station_id) {
                    stationSelector.value = state.user.station_id;
                    state.currentStationId = state.user.station_id;
                } else if (st.length) {
                    // top admin sees all
                    state.currentStationId = null;
                }
                // show/hide station selector based on role
                if (state.user.role === 'top_admin' || state.user.role === 'admin') {
                    stationSelectorWrap.style.display = 'block';
                } else {
                    stationSelectorWrap.style.display = 'none';
                    // cashier/manager locked to their station
                    if (state.user.station_id) {
                        stationSelector.value = state.user.station_id;
                        state.currentStationId = state.user.station_id;
                    }
                }
            } catch (e) {
                showToast('Failed to load stations: ' + e.message, 'danger');
            }

            // load initial data
            await loadAllData();

            // show app
            loginScreen.style.display = 'none';
            appMain.style.display = 'block';
            // update user info
            const u = state.user;
            sidebarUser.textContent = u.name || u.username;
            sidebarRole.textContent = u.role;
            headerUser.textContent = u.name || u.username;
            headerRole.textContent = u.role;

        // ── Load all data ────────────────────────────────────────────
        async function loadAllData() {
            try {
                const [inv, sh, sales, vendors, customers, exp, pay, stockRec, adj, users] = await Promise.all([
                    apiFetch('/inventory'),
                    apiFetch('/shifts'),
                    apiFetch('/sales'),
                    apiFetch('/vendors'),
                    apiFetch('/customers'),
                    apiFetch('/expenses'),
                    apiFetch('/payments'),
                    apiFetch('/stock'),
                    apiFetch('/adjustments'),
                    apiFetch('/users'),
                ]);
                state.inventory = inv || [];
                state.shifts = sh || [];
                state.sales = sales || [];
                state.vendors = vendors || [];
                state.customers = customers || [];
                state.expenses = exp || [];
                state.payments = pay || [];
                state.stockReceipts = stockRec || [];
                state.adjustments = adj || [];
                state.users = users || [];
            } catch (e) {
                showToast('Error loading data: ' + e.message, 'danger');
            }
        }

        // ── Filter by station ────────────────────────────────────────
        function filterByStation(items, stationIdField = 'station_id') {
            if (!state.currentStationId) return items;
            return items.filter(item => item[stationIdField] === state.currentStationId);
        }

        function getStationName(id) {
            const s = state.stations.find(st => st.id === id);
            return s ? s.name : 'Unknown';
        }

        function getStationLocation(id) {
            const s = state.stations.find(st => st.id === id);
            return s ? s.location : '';
        }

        function getUserName(id) {
            const u = state.users.find(usr => usr.id === id);
            return u ? (u.name || u.username) : 'Unknown';
        }

                    </div>
                    <div class="col-12 col-lg-8">
                        <div class="table-container">
                            <div class="table-header">
                                <h5>📋 Shifts</h5>
                                <span class="badge bg-secondary">${shifts.length} records</span>
                            </div>
                            <div class="table-responsive-custom">
                                <table class="table table-sm table-hover">
                                    <thead><tr><th>Station</th><th>Cashier</th><th>Type</th><th>Start Meter</th><th>End Meter</th><th>Sold (L)</th><th>Status</th></tr></thead>
                                    <tbody>
                                        ${shifts.length === 0 ? '<tr><td colspan="7" class="text-muted text-center">No shifts</td></tr>' :
                                        shifts.slice().reverse().map(s => {
                                            const sold = s.end_meter_reading && s.start_meter_reading ? (s.end_meter_reading - s.start_meter_reading).toFixed(1) : '-';
                                            const statusCls = s.status === 'active' ? 'shift-active' : 'shift-inactive';
                                            return `<tr>
                                                <td>${getStationName(s.station_id)}</td>
                                                <td>${getUserName(s.cashier_id)}</td>
                                                <td><span class="${s.shift_type === 'day' ? 'shift-badge-day' : 'shift-badge-night'}">${s.shift_type}</span></td>
                                                <td>${s.start_meter_reading || '-'}</td>
                                                <td>${s.end_meter_reading || '-'}</td>
                                                <td>${sold}</td>
                                                <td><span class="${statusCls}">${s.status}</span></td>
                                            </tr>`;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            pageContent.innerHTML = html;

            // Start shift
            const startForm = $('#startShiftForm');
            if (startForm) {
                startForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const stationId = parseInt($('#shiftStation').value) || state.user.station_id;
                    const shiftType = $('#shiftType').value;
                    const startMeter = parseFloat($('#shiftStartMeter').value);
                    if (isNaN(startMeter) || startMeter < 0) { showToast('Enter valid meter reading', 'warning'); return; }
                    try {
                        await apiFetch('/shifts', {
                            method: 'POST',
                            body: JSON.stringify({
                                station_id: stationId,
                                cashier_id: state.user.id,
                                shift_type: shiftType,
                                start_meter_reading: startMeter,
                            }),
                        });
                        showToast('Shift started!', 'success');
                        await loadAllData();
                        renderShifts();
                    } catch (err) { showToast(err.message, 'danger'); }
                });
            }

            // End shift
            const endForm = $('#endShiftForm');
            if (endForm) {
                endForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const endMeter = parseFloat($('#shiftEndMeter').value);
                    if (isNaN(endMeter) || endMeter < 0) { showToast('Enter valid meter reading', 'warning'); return; }
                    try {
                        const active = state.shifts.find(s => s.cashier_id === state.user.id && s.status === 'active');
                        if (!active) { showToast('No active shift found', 'warning'); return; }
                        await apiFetch('/shifts/' + active.id, {
                            method: 'PUT',
                            body: JSON.stringify({ end_meter_reading: endMeter }),
                        });
                        showToast('Shift ended!', 'success');
                        await loadAllData();
                        renderShifts();
                    } catch (err) { showToast(err.message, 'danger'); }
                });
            }
        }

                        await apiFetch('/users', {
                            method: 'POST',
                            body: JSON.stringify({ username, password, name, role, station_id: stationId }),
                        });
                        showToast('User created', 'success');
                        await loadAllData();
                        renderUsers();
                    } catch (err) { showToast(err.message, 'danger'); }
                });
            }
            document.querySelectorAll('.del-user').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Delete this user?')) return;
                    const id = parseInt(btn.dataset.id);
                    try {
                        await apiFetch('/users/' + id, { method: 'DELETE' });
                        showToast('User deleted', 'info');
                        await loadAllData();
                        renderUsers();
                    } catch (err) { showToast(err.message, 'danger'); }
                });
            });
        }

        // ─────────────────────────────────────────────────────────────
        //  AUTO-LOGIN on load
        // ─────────────────────────────────────────────────────────────
        (async function bootstrap() {
            const token = localStorage.getItem('petro_token');
            const userJson = localStorage.getItem('petro_user');
            if (token && userJson) {
                try {
                    state.token = token;
                    state.user = JSON.parse(userJson);
                    // verify token by fetching stations
                    await initApp();
                    return;
                } catch (e) {
                    localStorage.removeItem('petro_token');
                    localStorage.removeItem('petro_user');
                }
            }
            loginScreen.style.display = 'flex';
            appMain.style.display = 'none';
        })();

        // expose for debugging
        window.__state = state;
        console.log('🚀 PetroManager loaded. Use admin/admin123, manager/manager123, cashier/cashier123');
    </script>

</body>
</html>
