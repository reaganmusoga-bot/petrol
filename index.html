<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetroManager Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>
    <style>
        /* --- all styles (full) --- */
        :root {
            --sidebar-w: 260px;
            --header-h: 60px;
            --bg: #f0f2f6;
            --sidebar-bg: #0b1a33;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; }
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; height: 100dvh; background: var(--sidebar-bg); color: #b0c4de; z-index: 1050; display: flex; flex-direction: column; transition: transform .3s; overflow: hidden; }
        .sidebar-brand { padding: 18px 20px; font-size: 1.25rem; font-weight: 700; color: #fff; background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
        .sidebar-brand i { font-size: 1.7rem; color: #ffc107; }
        #sidebarNav { flex: 1 1 0; overflow-y: auto !important; overflow-x: hidden; min-height: 0; max-height: 100%; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-top: 8px; padding-bottom: 12px; }
        #sidebarNav::-webkit-scrollbar { width: 6px; }
        #sidebarNav::-webkit-scrollbar-track { background: transparent; }
        #sidebarNav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
        #sidebarNav::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
        .sidebar .nav-link { color: #b0c4de; padding: 11px 20px; border-left: 3px solid transparent; display: flex; align-items: center; gap: 12px; font-weight: 500; cursor: pointer; flex-shrink: 0; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,.07); color: #fff; border-left-color: #ffc107; }
        .sidebar .nav-link i { width: 22px; font-size: 1.15rem; }
        .sidebar-footer { margin-top: 0; padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.07); font-size: .85rem; flex: 0 0 auto; background: var(--sidebar-bg); }
        .main-content { margin-left: var(--sidebar-w); min-height: 100vh; }
        .top-header { height: var(--header-h); background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1040; }
        .page-title { font-weight: 600; font-size: 1.15rem; color: #1a2a4a; }
        .page-content { padding: 22px 24px; }
        .card-box { background: #fff; border-radius: 12px; padding: 18px 20px; border: 1px solid #eef0f3; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-item { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #eef0f3; display: flex; align-items: center; gap: 14px; }
        .stat-item .icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.25rem; }
        .stat-item .num { font-size: 1.4rem; font-weight: 700; color: #1a2a4a; }
        .stat-item .lbl { font-size: .8rem; color: #6c7a8e; }
        .hero { background: linear-gradient(135deg, #0b1a33, #1a3a6a); border-radius: 14px; padding: 24px 28px; color: #fff; margin-bottom: 20px; }
        .hero .company { font-size: 1.55rem; font-weight: 700; color: #ffc107; }
        .hero .tag { opacity: .85; font-size: .9rem; }
        .hero .details { display: flex; flex-wrap: wrap; gap: 14px 26px; margin-top: 10px; font-size: .87rem; }
        .hero .details i { color: #ffc107; }
        .badge-day { background: #fff3cd; color: #856404; padding: 3px 11px; border-radius: 20px; font-size: .71rem; font-weight: 600; }
        .badge-night { background: #d1ecf1; color: #0c5460; padding: 3px 11px; border-radius: 20px; font-size: .71rem; font-weight: 600; }
        .badge-active { background: #d4edda; color: #155724; padding: 2px 10px; border-radius: 20px; font-size: .7rem; font-weight: 600; }
        .badge-closed { background: #f8d7da; color: #721c24; padding: 2px 10px; border-radius: 20px; font-size: .7rem; font-weight: 600; }
        .product-badge { padding: 2px 10px; border-radius: 12px; font-size: .72rem; font-weight: 600; }
        .product-badge.petrol { background: #cfe2ff; color: #084298; }
        .product-badge.diesel { background: #f8d7da; color: #58151c; }
        .product-badge.gas { background: #d1ecf1; color: #0c5460; }
        .product-badge.paraffin { background: #e2d9f3; color: #4a2d7a; }
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e5ec 0%, #f5f7fa 100%);
            padding: 20px;
            position: relative;
        }
        .login-wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.05"><path d="M20 20 L80 20 L80 80 L20 80 Z"/><path d="M40 40 L60 40 L60 60 L40 60 Z"/></svg>') repeat;
            background-size: 100px 100px;
            pointer-events: none;
        }
        .login-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 8px 24px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.5);
            position: relative;
            z-index: 1;
        }
        .login-card .logo { text-align: center; margin-bottom: 28px; }
        .login-card .logo i { font-size: 3.2rem; color: #ffc107; background: #0b1a33; padding: 16px; border-radius: 18px; box-shadow: 0 8px 20px rgba(11,26,51,0.2); }
        .login-card .logo h4 { margin-top: 12px; font-weight: 700; color: #0b1a33; letter-spacing: -0.5px; }
        .login-card .logo p { color: #6c7a8e; font-size: 0.9rem; margin-bottom: 0; }
        .login-card .form-floating { margin-bottom: 16px; }
        .login-card .form-floating>select { padding-top: 1.6rem; padding-bottom: 0.4rem; }
        .login-card .form-floating>label { padding-left: 1rem; }
        .login-card .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6c7a8e; z-index: 10; cursor: pointer; }
        .login-card .btn-primary { background: linear-gradient(135deg, #0b1a33, #1a3a6a); border: none; padding: 12px; font-weight: 600; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .login-card .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(11,26,51,0.3); }
        .login-card .btn-outline-warning { border-radius: 30px; padding: 4px 16px; font-size: 0.8rem; }
        .login-card .btn-outline-secondary { border-radius: 30px; padding: 4px 16px; font-size: 0.8rem; }
        .login-card .form-control:focus, .login-card .form-select:focus { border-color: #0b1a33; box-shadow: 0 0 0 0.25rem rgba(11,26,51,0.15); }
        .login-card .form-floating>.form-control:focus~label, .login-card .form-floating>.form-select:focus~label { color: #0b1a33; }

        /* --- Autocomplete dropdown styles --- */
        .autocomplete-wrapper {
            position: relative;
        }
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #ced4da;
            border-top: none;
            border-radius: 0 0 12px 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1060;
            display: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            margin-top: -1px;
        }
        .autocomplete-dropdown .item {
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.95rem;
            border-bottom: 1px solid #f0f0f0;
        }
        .autocomplete-dropdown .item:last-child {
            border-bottom: none;
        }
        .autocomplete-dropdown .item:hover,
        .autocomplete-dropdown .item.active {
            background: #f0f4ff;
        }
        .autocomplete-dropdown .item .username {
            font-weight: 500;
            color: #0b1a33;
        }
        .autocomplete-dropdown .item .company-name {
            font-size: 0.75rem;
            color: #6c7a8e;
            margin-left: 8px;
        }
        .autocomplete-dropdown .no-results {
            padding: 12px 16px;
            color: #6c7a8e;
            font-style: italic;
            font-size: 0.9rem;
        }

        .fs-xs { font-size: .78rem; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,.75); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 2.2rem; height: 2.2rem; border: .25em solid #0d6efd; border-right-color: transparent; border-radius: 50%; animation: spin .75s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } .sidebar-toggle { display: inline-block !important; } }
        @media (min-width: 769px) { .sidebar-toggle { display: none !important; } }
        .report-filter .form-label { font-weight: 600; font-size: 0.8rem; margin-bottom: 2px; }
        .report-filter .form-control, .report-filter .form-select { font-size: 0.85rem; }
        .table-report thead th { background: #f8f9fa; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .table-report td { font-size: 0.85rem; }
        .profit-positive { color: #198754; font-weight: 700; }
        .profit-negative { color: #dc3545; font-weight: 700; }
        #offlineBanner { display: none; background: #dc3545; color: #fff; text-align: center; padding: 8px; font-size: 0.9rem; position: fixed; top: 0; left: 0; right: 0; z-index: 99999; }
        body.offline #offlineBanner { display: block; }
        body.offline .main-content { padding-top: 40px; }
        .edit-inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .edit-inline input { width: 70px; padding: 2px 4px; font-size: 0.8rem; border: 1px solid #ced4da; border-radius: 4px; }
        .edit-inline .btn-sm { font-size: 0.7rem; padding: 2px 8px; }
        .cart-edit-mode td { background: #fff9e6; }
        .item-edit-actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .item-edit-actions .btn { font-size: 0.7rem; padding: 2px 8px; }
        .modal-content { border-radius: 14px; }
        .modal-header { background: #0b1a33; color: #fff; border-radius: 14px 14px 0 0; }
        .modal-header .btn-close { filter: brightness(0) invert(1); }
        .quick-action-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .quick-action-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .discount-row { background: #fff8e1; border-radius: 8px; padding: 10px; margin-top: 8px; }
        .chat-messages { max-height: 400px; overflow-y: auto; background: #f8f9fa; border-radius: 8px; padding: 12px; }
        .chat-message { padding: 6px 12px; margin-bottom: 6px; border-radius: 18px; max-width: 80%; word-break: break-word; background: #e9ecef; }
        .chat-message.sent { background: #0d6efd; color: #fff; margin-left: auto; text-align: right; }
        .chat-message .sender { font-weight: 600; font-size: .8rem; }
        .chat-message .time { font-size: .7rem; opacity: .7; }
        .balancing-result .table th { background: #e9ecef; }
        .diff-negative { color: #dc3545; font-weight: 700; }
        .diff-positive { color: #198754; font-weight: 700; }
        .diff-zero { color: #0d6efd; font-weight: 700; }
        .price-missing { color: #856404; font-style: italic; }
    </style>
</head>
<body>

    <div id="offlineBanner"><i class="bi bi-wifi-off"></i> You are offline – showing cached data only</div>

    <!-- ============================================================
    LOGIN SCREEN (with username autocomplete)
    ============================================================ -->
    <div id="loginScreen" class="login-wrap">
        <div class="login-card">
            <div class="logo">
                <i class="bi bi-fuel-pump"></i>
                <h4>PetroManager Pro</h4>
                <p>Multi-Company Fuel Management</p>
            </div>
            <div id="normalLogin">
                <form id="loginForm" autocomplete="off">
                    <div class="form-floating autocomplete-wrapper">
                        <input type="text" id="loginUsername" class="form-control" required placeholder=" " autocomplete="off" />
                        <label for="loginUsername">Username</label>
                        <div id="usernameSuggestions" class="autocomplete-dropdown"></div>
                    </div>
                    <div class="form-floating position-relative">
                        <input type="password" id="loginPassword" class="form-control" required placeholder=" " autocomplete="current-password" />
                        <label for="loginPassword">Password</label>
                        <button type="button" class="password-toggle" id="togglePassword" tabindex="-1">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn">Sign In</button>
                    <div id="loginError" class="text-danger text-center mt-3 small" style="display:none;"></div>
                </form>
                <div class="mt-4 text-center d-flex flex-wrap gap-2 justify-content-center">
                    <button type="button" id="showCreateCompanyBtn" class="btn btn-outline-warning btn-sm">Create First Company</button>
                    <button type="button" id="diagnoseBtn" class="btn btn-outline-info btn-sm">Diagnose</button>
                </div>
                <div id="diagnoseBox" class="mt-3 p-2 bg-light rounded small" style="display:none;"></div>
            </div>
            <div id="createCompanyForm" style="display:none;">
                <h5 class="mb-3 text-center">Create First Company</h5>
                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" id="newCompName" class="form-control" placeholder="e.g. GIMIX Fuel">
                </div>
                <div class="mb-3">
                    <label class="form-label">Tagline</label>
                    <input type="text" id="newCompTagline" class="form-control" placeholder="Fueling Uganda">
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" id="newCompAddress" class="form-control" placeholder="Kampala, Uganda">
                </div>
                <div class="mb-3">
                    <label class="form-label">Admin Username</label>
                    <input type="text" id="newCompAdminUser" class="form-control" placeholder="admin">
                </div>
                <div class="mb-3">
                    <label class="form-label">Admin Password</label>
                    <input type="password" id="newCompAdminPass" class="form-control" placeholder="Min 4 characters">
                </div>
                <button type="button" id="createCompanyBtn" class="btn btn-warning w-100">Create Company & Admin</button>
                <button type="button" id="cancelCreateCompanyBtn" class="btn btn-outline-secondary w-100 mt-2">Cancel</button>
                <div id="createCompanyResult" class="text-center mt-3 small"></div>
            </div>
        </div>
    </div>

    <!-- ============================================================
    MAIN APP
    ============================================================ -->
    <div id="appMain" style="display:none;">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="bi bi-fuel-pump"></i> PetroManager</div>
            <div id="sidebarNav"></div>
            <div class="sidebar-footer">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle"></i>
                    <span id="sidebarUser">—</span>
                    <span class="ms-auto badge bg-secondary" id="sidebarRole">—</span>
                </div>
            </div>
        </nav>
        <div class="main-content">
            <header class="top-header">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light sidebar-toggle p-1" id="sidebarToggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <span class="page-title" id="pageTitle">Dashboard</span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <select id="stationSelector" class="form-select form-select-sm" style="max-width:180px;">
                        <option value="">All Stations</option>
                    </select>
                    <div class="dropdown">
                        <div class="d-flex align-items-center gap-2" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="cursor:pointer;">
                            <span class="fw-semibold d-none d-md-inline" id="headerUser">—</span>
                            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:36px;height:36px;" id="headerAvatar">U</div>
                            <i class="bi bi-chevron-down text-muted small"></i>
                        </div>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><span class="dropdown-item-text text-muted small" id="headerRole">—</span></li>
                            <li><span class="dropdown-item-text text-muted small" id="headerCompany">—</span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" id="headerSwitchUser"><i class="bi bi-arrow-repeat"></i> Switch User</a></li>

            <div class="page-content" id="pageContent">

                    <div class="spinner text-primary"></div>
                    <p class="mt-3 text-muted">Loading...</p>

    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="editModalBody">
                    <div class="text-center py-3"><div class="spinner"></div></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="editModalSave">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- ============================================================
    PART 2: FIREBASE CONFIG & CORE UTILITIES
    ============================================================ -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCWyrW4xa4i1X3D6uzEPbKfFbwEBU0UVbk",
            authDomain: "petrol-59a19.firebaseapp.com",
            projectId: "petrol-59a19",
            storageBucket: "petrol-59a19.firebasestorage.app",
            messagingSenderId: "195467455062",
            appId: "1:195467455062:web:288de1c059ca60a2e769f7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(err => console.warn('Persistence not enabled', err));

        const state = {
            user: null,
            stations: [],
            currentStationId: null,
            currentPage: 'dashboard',
            isOnline: navigator.onLine,
            companies: [],
            cashiers: [],
            allUsers: []
        };

        function $(sel) { return document.querySelector(sel); }
        function $$(sel) { return document.querySelectorAll(sel); }

        function toast(msg, type = 'success') {
            const colors = { success: 'bg-success', danger: 'bg-danger', warning: 'bg-warning text-dark', info: 'bg-info text-dark' };
            const el = document.createElement('div');
            el.className = `toast align-items-center text-white ${colors[type] || colors.info} border-0 show`;
            el.innerHTML =
                `<div class="d-flex"><div class="toast-body">${msg}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
            $('.toast-container').appendChild(el);
            setTimeout(() => el.remove(), 4500);
        }

        function formatMoney(n) { return 'UGX ' + (Number(n) || 0).toLocaleString(); }
        function formatDate(d) { if (!d) return '—'; const dt = d.toDate ? d.toDate() : new Date(d); return dt.toLocaleDateString('en-GB'); }
        function formatDateTime(d) { if (!d) return '—'; const dt = d.toDate ? d.toDate() : new Date(d); return dt.toLocaleString('en-GB'); }

        function roleNorm(r) {
            if (!r) return 'cashier';
            const x = String(r).toLowerCase().trim();
            if (x === 'super_admin' || x === 'super admin') return 'super_admin';
            if (x === 'top_admin' || x === 'top admin') return 'top_admin';
            if (x === 'admin') return 'admin';
            if (x === 'manager') return 'manager';
            return 'cashier';
        }
        function isAdmin(r) { return ['super_admin', 'top_admin', 'admin', 'manager'].includes(roleNorm(r)); }
        function canManageUsers(r) { return ['super_admin', 'top_admin'].includes(roleNorm(r)); }
        function canManageCompany(r) { return ['super_admin', 'top_admin'].includes(roleNorm(r)); }

        function stationName(id) {
            const s = state.stations.find(st => Number(st.id) === Number(id));
            return s ? s.name : 'Unknown';
        }

        function showLoading(show) {
            let ov = $('#loadingOverlay');
            if (show) {
                if (!ov) {
                    ov = document.createElement('div');
                    ov.id = 'loadingOverlay';
                    ov.className = 'loading-overlay';
                    ov.innerHTML = '<div class="spinner"></div>';
                    document.body.appendChild(ov);
                }
            } else if (ov) { ov.remove(); }
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode('PetroManagerSalt_' + password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return 'pm_' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function createCompany(companyData) {
            const ref = await db.collection('companies').add({
                name: companyData.name,
                tagline: companyData.tagline || '',
                address: companyData.address || '',
                phone: companyData.phone || '',

            if (state.user && state.user.role === 'super_admin') return null;

        async function getAll(col, queryFn = null) {
            let ref = db.collection(col);
            const companyId = getCompanyFilter();
            if (companyId) ref = ref.where('companyId', '==', companyId);
            if (queryFn) ref = queryFn(ref);
            const snap = await ref.get();
            return snap.docs.map(d => ({ id: d.id, ...d.data() }));

            const d = await db.collection(col).doc(String(id)).get();

            const companyId = state.user ? state.user.companyId : null;

                created_at: firebase.firestore.FieldValue.serverTimestamp(),
                created_by: state.user ? state.user.id : null
            });

        async function updateDoc(col, id, data) {
            const ref = db.collection(col).doc(String(id));

            if (!doc.exists) throw new Error(`Document ${id} not found in ${col}`);
            await ref.update(data);
        }

        async function deleteDoc(col, id) {
            const ref = db.collection(col).doc(String(id));
            const doc = await ref.get();
            if (!doc.exists) throw new Error(`Document ${id} not found in ${col}`);
            await ref.delete();
        }

        async function adjustInventory(stationId, product, delta, costPrice = null) {
            const ref = db.collection('inventory').doc(`${stationId}_${product}`);
            return db.runTransaction(async (tx) => {
                const doc = await tx.get(ref);
                let currentQty = 0, currentCost = 0;
                if (doc.exists) { currentQty = doc.data().quantity || 0; currentCost = doc.data().cost_price || 0; }
                const newQty = currentQty + delta;
                if (newQty < 0) throw new Error(`Insufficient stock for ${product}. Available: ${currentQty.toFixed(2)} L`);
                const newCost = (costPrice !== null && costPrice !== undefined) ? costPrice : currentCost;
                tx.set(ref, {
                    station_id: Number(stationId),
                    product_type: product,
                    quantity: newQty,
                    cost_price: newCost,
                    selling_price: doc.exists ? (doc.data().selling_price || 0) : 0,
                    companyId: state.user ? state.user.companyId : null,
                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                return newQty;
            });
        }

            const today = new Date(); today.setHours(0,0,0,0);

            const todaySales = sales.filter(s => {
                if (s.status === 'reversed') return false;
                const d = s.created_at ? (s.created_at.toDate ? s.created_at.toDate() : new Date(s.created_at)) : new Date();
                return d >= today && d < tomorrow;
            });
            let totalQty = 0, totalRevenue = 0;
            const byProduct = {};

                const qty = Number(s.quantity) || 0;

        async function downloadCompanyBackup() {
            if (!state.user || !state.user.companyId) throw new Error('No company selected');
            const companyId = state.user.companyId;
            const company = await getCompany(companyId);
            const payload = { version: 1, exported_at: new Date().toISOString(), companyId, company, collections: {} };
            for (const col of BACKUP_COLLECTIONS) {
                payload.collections[col] = await getAll(col);
            }
            const json = JSON.stringify(payload, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const safeName = (company && company.name) ? company.name.replace(/[^a-z0-9]/gi, '_') : companyId;
            const name = 'petromanager_backup_' + safeName + '_' + new Date().toISOString().slice(0,10) + '.json';
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = name;
            link.click();
            URL.revokeObjectURL(link.href);
            await logAudit('backup_download', { collections: BACKUP_COLLECTIONS.length });
            toast('Backup downloaded', 'success');
        }
        async function importCompanyBackup(jsonText) {
            if (!state.user || !state.user.companyId) throw new Error('No company selected');
            let data;
            try { data = JSON.parse(jsonText); } catch (e) { throw new Error('Invalid JSON file'); }
            if (!data || data.version !== 1 || !data.collections) throw new Error('Not a valid PetroManager backup (expected version 1)');
            const targetCompanyId = state.user.companyId;
            if (data.companyId && data.companyId !== targetCompanyId) throw new Error('This backup belongs to a different company. Import cancelled for safety.');
            let written = 0;
            showLoading(true);
            try {
                if (data.company) {
                    const { id, ...rest } = data.company;
                    await updateCompany(targetCompanyId, {
                        name: rest.name, tagline: rest.tagline, address: rest.address,
                        phone: rest.phone, email: rest.email, tax_id: rest.tax_id,
                        website: rest.website, logo_url: rest.logo_url
                    });
                }
                for (const col of BACKUP_COLLECTIONS) {
                    const items = data.collections[col] || [];
                    for (const item of items) {
                        if (!item.id) continue;
                        const { id, ...rest } = item;
                        rest.companyId = targetCompanyId;
                        await db.collection(col).doc(String(id)).set(rest, { merge: true });
                        written++;
                    }
                }
                await logAudit('backup_import', { docs: written });
                return written + ' document(s) written.';
            } finally { showLoading(false); }
        }

        let _backupReminderTimer = null;
        function setupBackupReminder() {
            if (_backupReminderTimer) { clearInterval(_backupReminderTimer); _backupReminderTimer = null; }
            let pref = null;
            try { pref = JSON.parse(localStorage.getItem('petro_backup_reminder') || 'null'); } catch (e) {}
            if (!pref || !pref.enabled || !pref.time) return;
            _backupReminderTimer = setInterval(() => {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2,'0');
                const mm = String(now.getMinutes()).padStart(2,'0');
                if ((hh+':'+mm) !== pref.time) return;
                const todayKey = 'petro_backup_reminded_' + now.toISOString().slice(0,10);
                if (localStorage.getItem(todayKey)) return;
                localStorage.setItem(todayKey, '1');
                toast('⏰ Daily backup reminder – open Company → Download Backup', 'warning');
            }, 30000);
        }

    <script>
        // Stores all usernames for autocomplete
        let allUsernames = [];

        // Fetch all users for autocomplete (called once on login page load)
        async function loadUsernamesForAutocomplete() {
            try {
                const snap = await db.collection('users').where('active', '==', true).get();
                // Also fetch companies to show company name in dropdown
                const companies = await getAllCompanies();
                const companyMap = {};
                companies.forEach(c => companyMap[c.id] = c.name || c.id);

                allUsernames = snap.docs.map(doc => {
                    const data = doc.data();
                    const companyName = companyMap[data.companyId] || 'Unknown Company';
                    return {
                        id: doc.id,
                        username: data.username || '',
                        name: data.name || '',
                        companyId: data.companyId,
                        companyName: companyName,
                        displayName: data.name || data.username || ''
                    };
                }).filter(u => u.username).sort((a, b) => a.username.localeCompare(b.username));
                console.log('Usernames loaded for autocomplete:', allUsernames.length);
            } catch (err) {
                console.error('Error loading usernames:', err);
                // If we can't load, try again later
                setTimeout(loadUsernamesForAutocomplete, 5000);
            }
        }

        // Autocomplete logic
        let selectedIndex = -1;

        function setupAutocomplete() {
            const input = $('#loginUsername');
            const dropdown = $('#usernameSuggestions');
            if (!input || !dropdown) return;

            input.addEventListener('input', function() {
                const value = this.value.trim().toLowerCase();
                if (value.length === 0) {
                    dropdown.style.display = 'none';
                    selectedIndex = -1;
                    return;
                }

                // Filter usernames that start with typed text
const matches = allUsernames.filter(u =>
    u.username.toLowerCase().includes(value) ||
    (u.name && u.name.toLowerCase().includes(value))
).slice(0, 12);

                if (matches.length === 0) {
                    dropdown.innerHTML = '<div class="no-results">No matching usernames</div>';
                    dropdown.style.display = 'block';
                    selectedIndex = -1;
                    return;
                }

                let html = '';
                matches.forEach((u, idx) => {
                    const activeClass = idx === selectedIndex ? 'active' : '';
                    html += `
                        <div class="item ${activeClass}" data-index="${idx}" data-username="${u.username}" data-id="${u.id}">
                            <span class="username">${u.username}</span>
                            <span class="company-name">${u.companyName}</span>
                        </div>
                    `;
                });
                dropdown.innerHTML = html;
                dropdown.style.display = 'block';

                // Click handler on items
                dropdown.querySelectorAll('.item').forEach(el => {
                    el.addEventListener('click', function() {
                        const username = this.dataset.username;
                        input.value = username;
                        dropdown.style.display = 'none';
                        selectedIndex = -1;
                        input.focus();
                    });
                });
            });

            // Keyboard navigation
            input.addEventListener('keydown', function(e) {
                const items = dropdown.querySelectorAll('.item');
                if (items.length === 0) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                    updateActiveItem(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex = Math.max(selectedIndex - 1, -1);
                    updateActiveItem(items);
                } else if (e.key === 'Enter') {
                    if (selectedIndex >= 0 && items[selectedIndex]) {
                        e.preventDefault();
                        const username = items[selectedIndex].dataset.username;
                        input.value = username;
                        dropdown.style.display = 'none';
                        selectedIndex = -1;
                        // Submit form automatically after selecting
                        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                    }
                } else if (e.key === 'Escape') {
                    dropdown.style.display = 'none';
                    selectedIndex = -1;
                }
            });

            // Click outside to close
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.autocomplete-wrapper')) {
                    dropdown.style.display = 'none';
                }
            });

            function updateActiveItem(items) {
                items.forEach((el, idx) => {
                    el.classList.toggle('active', idx === selectedIndex);
                });
                if (selectedIndex >= 0 && items[selectedIndex]) {
                    items[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }
        }

        // ----- LOGIN -----
        async function doLogin(username, password) {
            const errEl = $('#loginError');
            errEl.style.display = 'none';
            errEl.textContent = '';
            if (!username || !password) {
                errEl.textContent = 'Please fill in all fields';
                errEl.style.display = 'block';
                return false;
            }
            try {
                showLoading(true);
                const snap = await db.collection('users').where('username', '==', username.toLowerCase().trim()).get();
                if (snap.empty) {
                    errEl.textContent = 'User not found';
                    errEl.style.display = 'block';
                    return false;
                }
                const doc = snap.docs[0];
                const user = { id: doc.id, ...doc.data() };
                if (user.active === false) {
                    errEl.textContent = 'This account is disabled';
                    errEl.style.display = 'block';
                    return false;
                }
                const hashed = await hashPassword(password);
                if (user.password !== hashed && user.password !== password) {
                    errEl.textContent = 'Incorrect password';
                    errEl.style.display = 'block';
                    return false;
                }
                if (user.password === password) {
                    await db.collection('users').doc(user.id).update({ password: hashed });
                    user.password = hashed;
                }
                state.user = user;
                localStorage.setItem('petro_session', JSON.stringify({
                    userId: user.id,
                    companyId: user.companyId,
                    ts: Date.now()
                }));
                await loadStations();
                await loadCashiers();
                await loadAllUsers();
                initApp();
                await logAudit('login', { username: user.username });
                return true;
            } catch (err) {
                console.error('doLogin', err);
                errEl.textContent = 'Login error: ' + err.message;
                errEl.style.display = 'block';
                return false;
            } finally {
                showLoading(false);
            }
        }

        async function tryRestoreSession() {
            try {
                const raw = localStorage.getItem('petro_session');
                if (!raw) return false;
                const sess = JSON.parse(raw);
                if (!sess.userId || !sess.companyId) return false;
                if (sess.ts && (Date.now() - sess.ts > 7 * 24 * 60 * 60 * 1000)) {
                    localStorage.removeItem('petro_session');
                    return false;
                }
                const doc = await db.collection('users').doc(sess.userId).get();
                if (!doc.exists) {
                    localStorage.removeItem('petro_session');
                    return false;
                }
                const user = { id: doc.id, ...doc.data() };
                if (user.active === false || user.companyId !== sess.companyId) {
                    localStorage.removeItem('petro_session');
                    return false;
                }
                state.user = user;
                await loadStations();
                await loadCashiers();
                await loadAllUsers();
                initApp();
                return true;
            } catch (e) {
                console.warn('tryRestoreSession', e);
                return false;
            }
        }

        function logout() {
            localStorage.removeItem('petro_session');
            state.user = null;
            state.stations = [];
            state.cashiers = [];
            state.allUsers = [];
            state.currentStationId = null;
            $('#appMain').style.display = 'none';
            $('#loginScreen').style.display = 'flex';
            $('#loginPassword').value = '';
            $('#loginUsername').value = '';
        }

        async function loadStations() {
            try {
                const list = await getAll('stations');
                state.stations = list.map(s => ({ ...s, id: s.id != null ? s.id : s.station_id }))
                    .sort((a,b) => String(a.name || '').localeCompare(String(b.name || '')));
            } catch (e) {
                console.error('loadStations', e);
                state.stations = [];
            }
        }

        async function loadCashiers() {
            try {
                state.cashiers = await getAll('users');
            } catch (e) {
                console.error('loadCashiers', e);
                state.cashiers = [];
            }
        }

        async function loadAllUsers() {
            try {
                state.allUsers = await getAll('users');
            } catch (e) {
                console.error('loadAllUsers', e);
                state.allUsers = [];
            }
        }

        function updateStationDropdown() {
            const sel = $('#stationSelector');
            if (!sel) return;
            const current = state.currentStationId;
            sel.innerHTML = '<option value="">All Stations</option>';
            state.stations.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.name || ('Station ' + s.id);
                if (Number(s.id) === Number(current)) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        async function createFirstCompany() {
            const name = ($('#newCompName').value || '').trim();
            const tagline = ($('#newCompTagline').value || '').trim();
            const address = ($('#newCompAddress').value || '').trim();
            const adminUser = ($('#newCompAdminUser').value || '').trim().toLowerCase();
            const adminPass = ($('#newCompAdminPass').value || '').trim();
            const result = $('#createCompanyResult');
            result.innerHTML = '';
            if (!name || !adminUser || adminPass.length < 4) {
                result.innerHTML = '<span class="text-danger">Company name, admin username and password (min 4) required</span>';
                return;
            }
            try {
                showLoading(true);
                const existingUser = await db.collection('users').where('username', '==', adminUser).get();
                if (!existingUser.empty) {
                    result.innerHTML = '<span class="text-danger">Username already taken. Please choose another.</span>';
                    showLoading(false);
                    return;
                }
                const companyId = await createCompany({ name, tagline, address });
                const hashed = await hashPassword(adminPass);
                await db.collection('users').add({
                    username: adminUser,
                    name: adminUser,
                    password: hashed,
                    role: 'top_admin',
                    companyId: companyId,
                    active: true,
                    created_at: firebase.firestore.FieldValue.serverTimestamp()
                });
                await db.collection('stations').doc('1').set({
                    id: 1,
                    name: 'Main Station',
                    location: address || '',
                    companyId: companyId
                });
                result.innerHTML = '<span class="text-success">✅ Company created! You can now sign in.</span>';
                toast('Company created successfully', 'success');
                $('#createCompanyForm').style.display = 'none';
                $('#normalLogin').style.display = 'block';
                // Reload autocomplete usernames
                await loadUsernamesForAutocomplete();
            } catch (err) {
                result.innerHTML = '<span class="text-danger">❌ ' + err.message + '</span>';
                toast('Error: ' + err.message, 'danger');
            } finally {
                showLoading(false);
            }
        }

        async function runDiagnose() {
            const box = $('#diagnoseBox');
            box.style.display = 'block';
            box.innerHTML = 'Checking…';
            try {
                const companies = await getAllCompanies();
                const usersSnap = await db.collection('users').limit(5).get();
                box.innerHTML =
                    '<div><strong>Firebase:</strong> OK</div>' +
                    '<div><strong>Companies:</strong> ' + companies.length + '</div>' +
                    '<div><strong>Users sample:</strong> ' + usersSnap.size + '</div>' +
                    '<div><strong>Online:</strong> ' + (navigator.onLine ? 'Yes' : 'No') + '</div>';
            } catch (err) {
                box.innerHTML = '<span class="text-danger">Error: ' + err.message + '</span>';
            }
        }

        // ----- DOM INIT -----
        document.addEventListener('DOMContentLoaded', async function() {
            // Load usernames for autocomplete
            await loadUsernamesForAutocomplete();

            const restored = await tryRestoreSession();
            if (!restored) {
                $('#loginScreen').style.display = 'flex';
                setupAutocomplete();
            }

            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('loginPassword');
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.querySelector('i').classList.toggle('bi-eye');
                    this.querySelector('i').classList.toggle('bi-eye-slash');
                });
            }

            $('#loginForm').onsubmit = async function(e) {
                e.preventDefault();
                const username = $('#loginUsername').value.trim();
                const password = $('#loginPassword').value;
                await doLogin(username, password);
            };

            $('#showCreateCompanyBtn').onclick = function() {
                $('#normalLogin').style.display = 'none';
                $('#createCompanyForm').style.display = 'block';
            };
            $('#cancelCreateCompanyBtn').onclick = function() {
                $('#createCompanyForm').style.display = 'none';
                $('#normalLogin').style.display = 'block';
            };
            $('#createCompanyBtn').onclick = createFirstCompany;
            $('#diagnoseBtn').onclick = runDiagnose;

            document.body.addEventListener('click', function(e) {
                if (e.target.closest('#headerLogout')) { e.preventDefault(); logout(); }
                if (e.target.closest('#headerSwitchUser')) { e.preventDefault(); logout(); }
            });

            const toggle = $('#sidebarToggle');
            if (toggle) {
                toggle.onclick = function() { $('#sidebar').classList.toggle('open'); };
            }
        });

        console.log('Part 3 loaded – with username autocomplete');
    </script>

    <!-- ============================================================
    PART 4: APP INIT, SIDEBAR & NAVIGATION
    ============================================================ -->
    <script>
        function initApp() {
            const role = roleNorm(state.user.role);
            const name = state.user.name || state.user.username || 'User';
            $('#sidebarUser').textContent = name;
            $('#sidebarRole').textContent = state.user.role;
            $('#headerUser').textContent = name;
            $('#headerRole').textContent = state.user.role;
            $('#headerAvatar').textContent = name.charAt(0).toUpperCase();
            if (state.user.companyId) {
                getCompany(state.user.companyId).then(c => {
                    if (c) $('#headerCompany').textContent = '🏢 ' + c.name;
                }).catch(() => {});
            }
            if (role === 'cashier') {
                if (!state.user.station_id) {
                    toast('No station assigned to this cashier', 'warning');
                    logout();
                    return;
                }
                state.currentStationId = Number(state.user.station_id);
                $('#stationSelector').style.display = 'none';
            } else {
                state.currentStationId = null;
                $('#stationSelector').style.display = 'block';
                updateStationDropdown();
            }
            buildSidebar();
            $('#loginScreen').style.display = 'none';
            $('#appMain').style.display = 'block';
            navigate('dashboard');
            $('#stationSelector').onchange = function() {
                const v = $('#stationSelector').value;
                state.currentStationId = v ? Number(v) : null;
                renderPage(state.currentPage);
            };
            setupBackupReminder();
        }

        function buildSidebar() {
            const role = roleNorm(state.user.role);
            let links = [];
            if (role === 'cashier') {
                links = [
                    { page: 'dashboard', icon: 'bi-grid-1x2-fill', label: 'Dashboard' },
                    { page: 'shifts', icon: 'bi-clock-history', label: 'My Shifts' },
                    { page: 'meters', icon: 'bi-speedometer2', label: 'Meter Readings' },
                    { page: 'sales', icon: 'bi-cart-check', label: 'Sales' },
                    { page: 'summary', icon: 'bi-clipboard-data', label: 'Shift Summary' },
                    { page: 'messages', icon: 'bi-chat-dots', label: 'Messages' }
                ];
            } else {
                links = [
                    { page: 'dashboard', icon: 'bi-grid-1x2-fill', label: 'Dashboard' },
                    { page: 'sales', icon: 'bi-cart-check', label: 'Sales' },
                    { page: 'shifts', icon: 'bi-clock-history', label: 'Shifts' },
                    { page: 'meters', icon: 'bi-speedometer2', label: 'Meters' },
                    { page: 'summary', icon: 'bi-clipboard-data', label: 'Summary' },
                    { page: 'balancing', icon: 'bi-scales', label: 'Balancing' },
                    { page: 'inventory', icon: 'bi-box-seam', label: 'Inventory' },
                    { page: 'stock', icon: 'bi-truck', label: 'Offloading' },
                    { page: 'adjustments', icon: 'bi-sliders', label: 'Adjustments' },
                    { page: 'financials', icon: 'bi-bank', label: 'Financials' },
                    { page: 'customers', icon: 'bi-people', label: 'Customers' },
                    { page: 'receipts', icon: 'bi-receipt', label: 'Receipts' },
                    { page: 'reports', icon: 'bi-bar-chart-line', label: 'Reports' },
                    { page: 'users', icon: 'bi-person-gear', label: 'Users' },
                    { page: 'activity', icon: 'bi-journal-text', label: 'Activity Log' },
                    { page: 'company', icon: 'bi-building', label: 'Company' },
                    { page: 'messages', icon: 'bi-chat-dots', label: 'Messages' }
                ];
                if (role === 'super_admin') {
                    links.push({ page: 'companies', icon: 'bi-buildings', label: 'All Companies' });
                }
            }
            const nav = $('#sidebarNav');
            nav.innerHTML = links.map(l =>
                `<a class="nav-link" data-page="${l.page}" href="#"><i class="bi ${l.icon}"></i> ${l.label}</a>`
            ).join('');
            nav.querySelectorAll('.nav-link').forEach(a => {
                a.onclick = function(e) {
                    e.preventDefault();
                    navigate(this.dataset.page);
                    if (window.innerWidth < 769) {
                        $('#sidebar').classList.remove('open');
                    }
                };
            });
        }

        function navigate(page) {
            state.currentPage = page;
            $$('#sidebarNav .nav-link').forEach(a => {
                a.classList.toggle('active', a.dataset.page === page);
            });
            const titles = {
                dashboard: 'Dashboard',
                sales: 'Sales',
                shifts: 'Shifts',
                meters: 'Meter Readings',
                summary: 'Shift Summary',
                balancing: 'Cashier Balancing',
                inventory: 'Inventory',
                stock: 'Offloading',
                adjustments: 'Stock Adjustments',
                financials: 'Financials',
                customers: 'Customers',
                receipts: 'Receipts',
                reports: 'Reports',
                users: 'Users',
                activity: 'Activity Log',
                company: 'Company Profile',
                companies: 'All Companies',
                messages: 'Messages'
            };
            $('#pageTitle').textContent = titles[page] || page;
            renderPage(page);
        }

        async function renderPage(page) {
            const content = $('#pageContent');
            content.innerHTML = '<div class="text-center py-5"><div class="spinner text-primary"></div><p class="mt-3 text-muted">Loading...</p></div>';
            try {
                switch (page) {
                    case 'dashboard': await renderDashboard(); break;
                    case 'sales': await renderSales(); break;
                    case 'shifts': await renderShifts(); break;
                    case 'meters': await renderMeters(); break;
                    case 'summary': await renderShiftSummary(); break;
                    case 'balancing': await renderBalancing(); break;
                    case 'inventory': await renderInventory(); break;
                    case 'stock': await renderStock(); break;
                    case 'adjustments': await renderAdjustments(); break;
                    case 'financials': await renderFinancials(); break;
                    case 'customers': await renderCustomers(); break;
                    case 'receipts': await renderReceipts(); break;
                    case 'reports': await renderReports(); break;
                    case 'users': await renderUsers(); break;
                    case 'activity': await renderActivity(); break;
                    case 'company': await renderCompanyProfile(); break;
                    case 'companies': await renderAllCompanies(); break;
                    case 'messages': await renderMessages(); break;
                    default: content.innerHTML = '<div class="alert alert-warning">Page not found</div>';
                }
            } catch (err) {
                console.error('renderPage', page, err);
                content.innerHTML = '<div class="alert alert-danger">Error loading page: ' + err.message + '</div>';
            }
        }

        console.log('Part 4 loaded');
    </script>
