        // ----- SHIFT SUMMARY -----
        async function renderShiftSummary() {
            const role = roleNorm(state.user.role);
            const isCashier = role === 'cashier';
            let sales = (await getAll('sales')).filter(s => s.status !== 'reversed');
            if (state.currentStationId) sales = sales.filter(s => Number(s.station_id) === state.currentStationId);
            const today = new Date(); today.setHours(0,0,0,0);
            const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
            const todaySales = sales.filter(s => {
                const d = s.created_at ? (s.created_at.toDate ? s.created_at.toDate() : new Date(s.created_at)) : new Date();
                return d >= today && d < tomorrow;
            });
            const mySales = isCashier ? todaySales.filter(s => s.recorded_by === state.user.id) : todaySales;
            let totalQty = 0, totalRevenue = 0;
            const byProduct = {};
            mySales.forEach(s => {
                const qty = Number(s.quantity) || 0;
                const amt = Number(s.amount) || 0;
                totalQty += qty; totalRevenue += amt;
                const p = s.product_type || 'Unknown';
                if (!byProduct[p]) byProduct[p] = { qty: 0, revenue: 0 };
                byProduct[p].qty += qty; byProduct[p].revenue += amt;
            });
            let productRows = Object.keys(byProduct).map(p =>
                `<tr><td>${p}</td><td>${byProduct[p].qty.toFixed(2)} L</td><td>${formatMoney(byProduct[p].revenue)}</td></tr>`
            ).join('') || '<tr><td colspan="3" class="text-muted">No sales today</td></tr>';

            $('#pageContent').innerHTML = `
              <div class="card-box">
                <h5 class="mb-3">${isCashier ? 'My' : 'Station'} Shift Summary — Today</h5>
                <div class="stat-grid mb-3">
                  <div class="stat-item"><div class="icon" style="background:#198754;"><i class="bi bi-cash"></i></div>
                    <div><div class="num">${formatMoney(totalRevenue)}</div><div class="lbl">Revenue</div></div></div>
                  <div class="stat-item"><div class="icon" style="background:#0d6efd;"><i class="bi bi-droplet"></i></div>
                    <div><div class="num">${totalQty.toFixed(2)} L</div><div class="lbl">Quantity</div></div></div>
                  <div class="stat-item"><div class="icon" style="background:#ffc107;"><i class="bi bi-receipt"></i></div>
                    <div><div class="num">${mySales.length}</div><div class="lbl">Transactions</div></div></div>
                </div>
                <table class="table table-sm"><thead><tr><th>Product</th><th>Qty</th><th>Revenue</th></tr></thead>
                  <tbody>${productRows}</tbody></table>
              </div>`;
        }

        console.log('Part 5 loaded');
    </script>

    <!-- PART 6: BALANCING (Start - End logic) -->
    <script>
        async function renderBalancing() {
            if (!isAdmin(state.user.role)) {
                $('#pageContent').innerHTML = '<div class="alert alert-danger">Access denied. Only managers and admins can balance cashiers.</div>';
                return;
            }

            const allUsers = await getAll('users');
            const cashierOptions = allUsers
                .filter(u => u.active !== false)
                .map(u => `<option value="${u.id}">${u.name || u.username}</option>`)
                .join('');

            const stationOptions = state.stations
                .map(s => `<option value="${s.id}">${s.name}</option>`)
                .join('');

            const today = new Date();
            const startDate = new Date(today);
            startDate.setDate(startDate.getDate() - 7);
            const endDate = today;

            const html = `
            <div class="card-box">
              <h5 class="mb-3"><i class="bi bi-scales"></i> Cashier Balancing</h5>
              <p class="text-muted small">Select station, cashier, and date range. All shift meter readings are shown.</p>
              <form id="balancingFilter" class="row g-2 mb-3">
                <div class="col-md-3">
                  <label class="form-label small">Station</label>
                  <select id="balStation" class="form-select form-select-sm" required>
                    <option value="">— Select Station —</option>
                    ${stationOptions}
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Cashier</label>
                  <select id="balCashier" class="form-select form-select-sm" required>
                    <option value="">— Select Cashier —</option>
                    ${cashierOptions}
                  </select>
                </div>
                <div class="col-md-2">
                  <label class="form-label small">From</label>
                  <input type="date" id="balFrom" class="form-control form-control-sm" value="${startDate.toISOString().slice(0,10)}">
                </div>
                <div class="col-md-2">
                  <label class="form-label small">To</label>
                  <input type="date" id="balTo" class="form-control form-control-sm" value="${endDate.toISOString().slice(0,10)}">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-search"></i> Load Shifts</button>
                </div>
              </form>
              <div id="balancingResult" class="balancing-result">
                <div class="text-center text-muted py-4">Select filters and click <strong>Load Shifts</strong>.</div>
              </div>
            </div>
            `;

            $('#pageContent').innerHTML = html;

            $('#balancingFilter').onsubmit = async function(e) {
                e.preventDefault();
                const stationId = Number($('#balStation').value);
                const cashierId = $('#balCashier').value;
                const fromDate = $('#balFrom').value;
                const toDate = $('#balTo').value;

                if (!stationId || !cashierId || !fromDate || !toDate) {
                    toast('Please fill all fields', 'warning');
                    return;
                }

                const start = new Date(fromDate);
                start.setHours(0,0,0,0);
                const end = new Date(toDate);
                end.setHours(23,59,59,999);

                const shiftsSnap = await db.collection('shifts')
                    .where('station_id', '==', stationId)
                    .where('cashier_id', '==', cashierId)
                    .where('status', '==', 'closed')
                    .get();

                const shifts = [];
                shiftsSnap.forEach(doc => {
                    const data = doc.data();
                    const createdAt = data.created_at && data.created_at.toDate ? data.created_at.toDate() : new Date(data.created_at);
                    if (createdAt >= start && createdAt <= end) {
                        shifts.push({ id: doc.id, ...data });
                    }
                });

                if (shifts.length === 0) {
                    $('#balancingResult').innerHTML = '<div class="alert alert-info">No closed shifts found for this cashier in the selected date range.</div>';
                    return;
                }

                shifts.sort((a,b) => (a.created_at && a.created_at.seconds || 0) - (b.created_at && b.created_at.seconds || 0));

                const inv = await getAll('inventory');
                const stationInv = inv.filter(i => Number(i.station_id) === stationId);
                const getPrice = (product) => {
                    const item = stationInv.find(i => i.product_type === product);
                    return item ? (item.selling_price || 0) : 0;
                };
                const prices = {
                    Petrol: getPrice('Petrol'),
                    Diesel: getPrice('Diesel'),
                    Gas: getPrice('Gas'),
                    Paraffin: getPrice('Paraffin')
                };

                const missingPriceProducts = Object.keys(prices).filter(p => prices[p] === 0);
                if (missingPriceProducts.length > 0) {
                    toast('⚠️ Selling price not set for: ' + missingPriceProducts.join(', ') + '. Please set prices in Inventory.', 'warning');
                }

                const productList = ['Petrol', 'Diesel', 'Gas', 'Paraffin'];

                let shiftData = shifts.map((shift, idx) => {
                    const startP = shift.start_petrol || 0;
                    const endP = shift.end_petrol || 0;
                    const startD = shift.start_diesel || 0;
                    const endD = shift.end_diesel || 0;
                    const startG = shift.start_gas || 0;
                    const endG = shift.end_gas || 0;
                    const startPf = shift.start_paraffin || 0;
                    const endPf = shift.end_paraffin || 0;

                    const diffs = {
                        Petrol: startP - endP,
                        Diesel: startD - endD,
                        Gas: startG - endG,
                        Paraffin: startPf - endPf
                    };

                    return {
                        shiftNum: idx + 1,
                        start: { Petrol: startP, Diesel: startD, Gas: startG, Paraffin: startPf },
                        end: { Petrol: endP, Diesel: endD, Gas: endG, Paraffin: endPf },
                        diffs: diffs,
                        expected: {}
                    };
                });

                shiftData.forEach(s => {
                    productList.forEach(p => {
                        s.expected[p] = s.diffs[p] * prices[p];
                    });
                });

                let meterRows = '';
                shiftData.forEach(s => {
                    let cells = `<td><strong>Shift ${s.shiftNum}</strong></td>`;
                    productList.forEach(p => {
                        cells += `<td>${s.start[p].toFixed(2)}</td>`;
                        cells += `<td>${s.end[p].toFixed(2)}</td>`;
                    });
                    meterRows += `<tr>${cells}</tr>`;
                });

                let diffRows = '';
                shiftData.forEach(s => {
                    let cells = `<td><strong>Shift ${s.shiftNum}</strong></td>`;
                    productList.forEach(p => {
                        const diff = s.diffs[p];
                        const cls = diff < 0 ? 'diff-negative' : (diff > 0 ? 'diff-positive' : 'diff-zero');
                        cells += `<td class="${cls}">${diff.toFixed(2)}</td>`;
                    });
                    diffRows += `<tr>${cells}</tr>`;
                });

                let priceRow = '<tr><td><strong>Price / L</strong></td>';
                productList.forEach(p => {
                    const price = prices[p];
                    const display = price === 0 ? `<span class="price-missing">Not set</span>` : formatMoney(price);
                    priceRow += `<td>${display}</td>`;
                });
                priceRow += '</tr>';

                let expectedRows = '';
                let grandTotal = 0;
                shiftData.forEach(s => {
                    let cells = `<td><strong>Shift ${s.shiftNum}</strong></td>`;
                    let shiftTotal = 0;
                    productList.forEach(p => {
                        const exp = s.expected[p] || 0;
                        shiftTotal += exp;
                        const cls = exp < 0 ? 'diff-negative' : (exp > 0 ? 'diff-positive' : 'diff-zero');
                        cells += `<td class="${cls}">${formatMoney(exp)}</td>`;
                    });
                    cells += `<td><strong>${formatMoney(shiftTotal)}</strong></td>`;
                    expectedRows += `<tr>${cells}</tr>`;
                    grandTotal += shiftTotal;
                });

                let resultHtml = `
                <div class="table-responsive mb-4">
                  <h6>1. Meter Readings (Start / End) per Shift</h6>
                  <table class="table table-sm table-bordered">
                    <thead>
                      <tr><th>Shift</th>
                        ${productList.map(p => `<th colspan="2">${p}</th>`).join('')}
                      </tr>
                      <tr><th></th>
                        ${productList.map(p => `<th>Start</th><th>End</th>`).join('')}
                      </tr>
                    </thead>
                    <tbody>${meterRows}</tbody>
                  </table>
                </div>

                <div class="table-responsive mb-4">
                  <h6>2. Quantities Sold (Difference = Start − End) per Shift</h6>
                  <p class="text-muted small">Positive values indicate fuel sold (start higher than end).</p>
                  <table class="table table-sm table-bordered">
                    <thead><tr><th>Shift</th>${productList.map(p => `<th>${p} (L)</th>`).join('')}</tr></thead>
                    <tbody>${diffRows}</tbody>
                  </table>
                </div>

                <div class="table-responsive mb-4">
                  <h6>3. Selling Price per Litre</h6>
                  <table class="table table-sm table-bordered">
                    <thead><tr><th>Product</th>${productList.map(p => `<th>${p}</th>`).join('')}</tr></thead>
                    <tbody>${priceRow}</tbody>
                  </table>
                </div>

                <div class="table-responsive mb-4">
                  <h6>4. Expected Cash per Shift (Qty × Price)</h6>
                  <table class="table table-sm table-bordered">
                    <thead><tr><th>Shift</th>${productList.map(p => `<th>${p}</th>`).join('')}<th>Total</th></tr></thead>
                    <tbody>${expectedRows}</tbody>
                    <tfoot>
                      <tr class="table-secondary fw-bold">
                        <td colspan="${productList.length + 1}" class="text-end">Grand Total Expected:</td>
                        <td>${formatMoney(grandTotal)}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>

                <hr>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Actual Cash Presented by Cashier</label>
                    <input type="number" id="actualCashInput" class="form-control" step="100" min="0" placeholder="Enter amount in UGX">
                  </div>
                  <div class="col-md-6 d-flex align-items-end">
                    <button class="btn btn-success w-100" id="saveReconciliationBtn"><i class="bi bi-save"></i> Save Reconciliation</button>
                  </div>
                </div>
                <div id="reconciliationResult" class="mt-3"></div>
              `;

                $('#balancingResult').innerHTML = resultHtml;

                document.getElementById('actualCashInput').oninput = function() {
                    const actual = parseFloat(this.value) || 0;
                    const diff = actual - grandTotal;
                    const resultDiv = document.getElementById('reconciliationResult');
                    if (isNaN(actual) || actual === 0) {
                        resultDiv.innerHTML = '';
                        return;
                    }
                    let comment = '', cls = '';
                    if (Math.abs(diff) < 1) {
                        comment = 'Accurate';
                        cls = 'diff-zero';
                    } else if (diff < 0) {
                        comment = 'Shortage';
                        cls = 'diff-negative';
                    } else {
                        comment = 'Excess';
                        cls = 'diff-positive';
                    }
                    const sign = diff >= 0 ? '+' : '';
                    resultDiv.innerHTML = `
                      <div class="alert alert-secondary">
                        <strong>Preview:</strong><br>
                        Expected: ${formatMoney(grandTotal)}<br>
                        Actual: ${formatMoney(actual)}<br>
                        <span class="${cls}">Difference: ${sign}${formatMoney(diff)} (${comment})</span>
                      </div>
                    `;
                };

                document.getElementById('saveReconciliationBtn').onclick = async function() {
                    const actual = parseFloat(document.getElementById('actualCashInput').value);
                    if (isNaN(actual) || actual < 0) {
                        toast('Please enter a valid amount', 'warning');
                        return;
                    }
                    const diff = actual - grandTotal;
                    let comment = '';
                    if (Math.abs(diff) < 1) comment = 'Accurate';
                    else if (diff < 0) comment = 'Shortage';
                    else comment = 'Excess';

                    try {
                        await addDoc('reconciliations', {
                            station_id: stationId,
                            cashier_id: cashierId,
                            date_from: fromDate,
                            date_to: toDate,
                            expected_total: grandTotal,
                            actual_cash: actual,
                            difference: diff,
                            comment: comment,
                            reconciled_by: state.user.id,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        const resultDiv = document.getElementById('reconciliationResult');
                        const sign = diff >= 0 ? '+' : '';
                        const cls = Math.abs(diff) < 1 ? 'diff-zero' : (diff < 0 ? 'diff-negative' : 'diff-positive');
                        resultDiv.innerHTML = `
                        <div class="alert alert-info">
                          <strong>Reconciliation saved!</strong><br>
                          Expected: ${formatMoney(grandTotal)}<br>
                          Actual: ${formatMoney(actual)}<br>
                          <span class="${cls}">Difference: ${sign}${formatMoney(diff)} (${comment})</span>
                        </div>
                      `;
                        toast('Reconciliation saved successfully', 'success');
                    } catch (err) {
                        toast('Error saving reconciliation: ' + err.message, 'danger');
                    }
                };
            };
        }
        console.log('Part 6 loaded – Balancing with Start − End');
    </script>

    <!-- PART 7: INVENTORY, STOCK, ADJUSTMENTS -->
    <script>
        // ----- INVENTORY (with Add Item) -----
        async function renderInventory() {
            const inv = (await getAll('inventory'))
                .filter(i => !state.currentStationId || Number(i.station_id) === state.currentStationId);
            const canEdit = isAdmin(state.user.role);

            let stationOpts = '';
            state.stations.forEach(s => {
                const sel = state.currentStationId && Number(state.currentStationId) === Number(s.id) ? 'selected' : '';
                stationOpts += `<option value="${s.id}" ${sel}>${s.name}</option>`;
            });

            let html = '<div class="card-box">' +
                '<div class="d-flex justify-content-between align-items-center mb-3">' +
                '<h5 class="mb-0"><i class="bi bi-box-seam"></i> Inventory</h5>' +
                '<span class="badge bg-secondary">' + inv.length + ' items</span>' +
                '</div>';

            if (canEdit) {
                html += `
                <div class="row g-2 mb-3 p-2 bg-light rounded">
                  <div class="col-md-3">
                    <label class="form-label small">Station</label>
                    <select id="invAddStation" class="form-select form-select-sm">${stationOpts}</select>
                  </div>
                  <div class="col-md-2">
                    <label class="form-label small">Product</label>
                    <select id="invAddProduct" class="form-select form-select-sm">
                      <option value="Petrol">Petrol</option>
                      <option value="Diesel">Diesel</option>
                      <option value="Gas">Gas</option>
                      <option value="Paraffin">Paraffin</option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <label class="form-label small">Quantity (L)</label>
                    <input type="number" id="invAddQty" class="form-control form-control-sm" step="0.01" min="0" placeholder="0">
                  </div>
                  <div class="col-md-2">
                    <label class="form-label small">Cost/L</label>
                    <input type="number" id="invAddCost" class="form-control form-control-sm" step="10" min="0" placeholder="Cost">
                  </div>
                  <div class="col-md-2">
                    <label class="form-label small">Sell/L</label>
                    <input type="number" id="invAddSell" class="form-control form-control-sm" step="10" min="0" placeholder="Sell">
                  </div>
                  <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-sm btn-primary w-100" id="invAddBtn"><i class="bi bi-plus"></i> Add</button>
                  </div>
                </div>`;
            }

            html += '<div class="table-responsive"><table class="table table-sm table-hover">' +
                '<thead><tr><th>Station</th><th>Product</th><th>Quantity (L)</th><th>Cost/L</th><th>Sell/L</th>' +
                (canEdit ? '<th>Actions</th>' : '') +
                '</tr></thead><tbody>';

            if (inv.length === 0) {
                html += '<tr><td colspan="' + (canEdit ? '6' : '5') + '" class="text-muted text-center">No inventory</td></tr>';
            } else {
                inv.forEach(i => {
                    const docId = i.id;
                    html += '<tr id="row_' + docId + '">' +
                        '<td>' + stationName(i.station_id) + '</td>' +
                        '<td><span class="product-badge ' + (i.product_type || '').toLowerCase() + '">' + i.product_type + '</span></td>' +
                        '<td><strong>' + (i.quantity || 0).toFixed(2) + '</strong></td>' +
                        '<td class="cost-display">' + formatMoney(i.cost_price || 0) + '</td>' +
                        '<td class="sell-display">' + formatMoney(i.selling_price || 0) + '</td>';
                    if (canEdit) {
                        html += '<td>' +
                            '<button class="btn btn-sm btn-outline-primary edit-inv-btn" data-id="' + docId +
                            '" data-cost="' + (i.cost_price || 0) + '" data-sell="' + (i.selling_price || 0) + '">' +
                            '<i class="bi bi-pencil"></i> Edit</button>' +
                            ' <button class="btn btn-sm btn-outline-danger delete-inv-btn" data-id="' + docId + '"><i class="bi bi-trash"></i></button>' +
                            '</td>';
                    }
                    html += '</tr>';
                });
            }

            html += '</tbody></table></div></div>';
            $('#pageContent').innerHTML = html;

            const addBtn = $('#invAddBtn');
            if (addBtn) {
                addBtn.onclick = async function() {
                    const stationId = Number($('#invAddStation').value);
                    const product = $('#invAddProduct').value;
                    const qty = parseFloat($('#invAddQty').value) || 0;
                    const cost = parseFloat($('#invAddCost').value) || 0;
                    const sell = parseFloat($('#invAddSell').value) || 0;
                    if (!stationId) { toast('Select a station', 'warning'); return; }
                    if (!product) { toast('Product is required', 'warning'); return; }
                    if (qty < 0 || cost < 0 || sell < 0) { toast('Values cannot be negative', 'warning'); return; }
                    try {
                        const docId = stationId + '_' + product;
                        const ref = db.collection('inventory').doc(docId);
                        await ref.set({
                            station_id: stationId,
                            product_type: product,
                            quantity: qty,
                            cost_price: cost,
                            selling_price: sell,
                            companyId: state.user.companyId,
                            last_updated: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                        await logAudit('add_inventory', { station: stationId, product, qty, cost, sell });
                        toast('Inventory item added/updated');
                        renderInventory();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            }

            if (canEdit) {
                document.querySelectorAll('.edit-inv-btn').forEach(btn => {
                    btn.onclick = function() {
                        const id = this.dataset.id;
                        const currentCost = parseFloat(this.dataset.cost);
                        const currentSell = parseFloat(this.dataset.sell);
                        const newCost = prompt('Enter new Cost Price:', currentCost);
                        if (newCost === null) return;
                        const newSell = prompt('Enter new Selling Price:', currentSell);
                        if (newSell === null) return;
                        const costVal = parseFloat(newCost);
                        const sellVal = parseFloat(newSell);
                        if (isNaN(costVal) || isNaN(sellVal) || costVal < 0 || sellVal < 0) {
                            toast('Invalid prices', 'danger');
                            return;
                        }
                        updateDoc('inventory', id, {
                            cost_price: costVal,
                            selling_price: sellVal
                        }).then(() => {
                            toast('Inventory updated!', 'success');
                            renderInventory();
                        }).catch(err => {
                            toast('Error: ' + err.message, 'danger');
                        });
                    };
                });

                document.querySelectorAll('.delete-inv-btn').forEach(btn => {
                    btn.onclick = async function() {
                        const id = this.dataset.id;
                        if (!confirm('Delete this inventory record permanently?')) return;
                        try {
                            await deleteDoc('inventory', id);
                            toast('Inventory item deleted');
                            renderInventory();
                        } catch (err) {
                            toast('Error: ' + err.message, 'danger');
                        }
                    };
                });
            }
        }

        // ----- STOCK (Offloading) -----
        async function renderStock() {
            const stock = (await getAll('stock'))
                .filter(s => !state.currentStationId || Number(s.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));

            let stationOptions = '';
            state.stations.forEach(s => {
                const selected = state.currentStationId === s.id ? ' selected' : '';
                stationOptions += '<option value="' + s.id + '"' + selected + '>' + s.name + '</option>';
            });

            let html = '<div class="row g-4">' +
                '<div class="col-lg-5"><div class="card-box">' +
                '<h5 class="mb-3"><i class="bi bi-truck"></i> Offloading (Receive Fuel)</h5>' +
                '<form id="stockForm">' +
                '<div class="mb-2"><label class="form-label small">Station *</label>' +
                '<select id="recStation" class="form-select form-select-sm" required>' + stationOptions + '</select></div>' +
                '<div class="mb-2"><label class="form-label small">Shipping / Delivery Note # *</label>' +
                '<input type="text" id="recInvoice" class="form-control form-control-sm" placeholder="e.g. DN-2026-0042" required></div>' +
                '<div class="mb-2"><label class="form-label small">Vendor / Supplier *</label>' +
                '<input type="text" id="recVendor" class="form-control form-control-sm" placeholder="e.g. Total Energies, Vivo Energy" required></div>' +
                '<div class="mb-2"><label class="form-label small">Date</label>' +
                '<input type="date" id="recDate" class="form-control form-control-sm" value="' + new Date().toISOString().slice(0,10) + '"></div>' +
                '<div id="recItems"></div>' +
                '<button type="button" class="btn btn-sm btn-outline-secondary mb-3" id="addRecItem"><i class="bi bi-plus"></i> Add Item</button>' +
                '<button type="submit" class="btn btn-success w-100">Confirm Offloading & Update Inventory</button>' +
                '</form></div></div>' +
                '<div class="col-lg-7"><div class="card-box">' +
                '<h5 class="mb-3">Offloading History</h5>' +
                '<div class="table-responsive"><table class="table table-sm table-hover">' +
                '<thead><tr><th>Station</th><th>Shipping #</th><th>Vendor</th><th>Items</th><th>Date</th><th>Actions</th></tr></thead><tbody>';

            if (stock.length === 0) {
                html += '<tr><td colspan="6" class="text-muted text-center">No offloading records</td></tr>';
            } else {
                stock.slice(0,20).forEach(r => {
                    const items = (r.items || []).map(it => it.product_type + ' ' + it.quantity + 'L').join(', ');
                    html += '<tr>' +
                        '<td>' + stationName(r.station_id) + '</td>' +
                        '<td>' + (r.invoice_number || r.shipping_number || '—') + '</td>' +
                        '<td>' + (r.vendor || '—') + '</td>' +
                        '<td class="fs-xs">' + items + '</td>' +
                        '<td class="fs-xs">' + formatDate(r.received_date || r.created_at) + '</td>' +
                        '<td><button class="btn btn-sm btn-outline-danger delete-stock-btn" data-id="' + r.id +
                        '" data-station="' + r.station_id + '" data-items=\'' + JSON.stringify(r.items || []) +
                        '\'><i class="bi bi-trash"></i></button></td>' +
                        '</tr>';
                });
            }

            html += '</tbody></table></div></div></div></div>';
            $('#pageContent').innerHTML = html;

            const container = $('#recItems');

            function addRecRow() {
                const row = document.createElement('div');
                row.className = 'row g-1 mb-2 rec-row';
                row.innerHTML =
                    '<div class="col-5">' +
                    '<select class="form-select form-select-sm rec-product">' +
                    '<option>Petrol</option><option>Diesel</option><option>Gas</option><option>Paraffin</option>' +
                    '</select></div>' +
                    '<div class="col-5"><input type="number" class="form-control form-control-sm rec-qty" placeholder="Qty (L)" step="0.01" required></div>' +
                    '<div class="col-2"><button type="button" class="btn btn-sm btn-outline-danger w-100 remove-rec"><i class="bi bi-x"></i></button></div>';
                container.appendChild(row);
                row.querySelector('.remove-rec').onclick = function() {
                    if (container.children.length > 1) row.remove();
                };
            }
            addRecRow();
            $('#addRecItem').onclick = addRecRow;

            $('#stockForm').onsubmit = async function(e) {
                e.preventDefault();
                const stationId = Number($('#recStation').value);
                const shippingNo = $('#recInvoice').value.trim();
                const vendor = $('#recVendor').value.trim();
                const date = $('#recDate').value;
                if (!shippingNo) { toast('Shipping / Delivery Note number is required', 'warning'); return; }
                if (!vendor) { toast('Vendor / Supplier is required', 'warning'); return; }

                const items = [];
                let valid = true;
                document.querySelectorAll('.rec-row').forEach(r => {
                    const product = r.querySelector('.rec-product').value;
                    const qty = parseFloat(r.querySelector('.rec-qty').value);
                    if (!qty || qty <= 0) { valid = false; return; }
                    items.push({ product_type: product, quantity: qty });
                });
                if (!valid || items.length === 0) {
                    toast('Add at least one item with a valid quantity', 'warning');
                    return;
                }
                try {
                    showLoading(true);
                    const batch = db.batch();
                    const stockRef = db.collection('stock').doc();
                    batch.set(stockRef, {
                        station_id: stationId,
                        invoice_number: shippingNo,
                        shipping_number: shippingNo,
                        vendor: vendor,
                        received_date: date,
                        items: items,
                        created_by: state.user.id,
                        companyId: state.user.companyId,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    for (let item of items) {
                        await adjustInventory(stationId, item.product_type, item.quantity, null);
                    }
                    await batch.commit();
                    await logAudit('offload_stock', { station: stationId, shipping: shippingNo, vendor, items });
                    toast('Offloading recorded. Inventory updated.');
                    renderStock();
                } catch (err) {
                    toast(err.message, 'danger');
                } finally {
                    showLoading(false);
                }
            };

            document.querySelectorAll('.delete-stock-btn').forEach(btn => {
                btn.onclick = async function() {
                    const id = this.dataset.id;
                    const stationId = Number(this.dataset.station);
                    const items = JSON.parse(this.dataset.items);
                    if (!confirm('Delete this offloading record? This will REMOVE stock from inventory.')) return;
                    if (!confirm('Are you sure? This cannot be undone!')) return;
                    try {
                        for (let item of items) {
                            await adjustInventory(stationId, item.product_type, -item.quantity);
                        }
                        await deleteDoc('stock', id);
                        await logAudit('delete_offload', { station: stationId, items });
                        toast('Offloading record deleted. Inventory adjusted.', 'success');
                        renderStock();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            });
        }

        // ----- ADJUSTMENTS -----
        async function renderAdjustments() {
            const canAdjust = isAdmin(state.user.role);
            const adj = (await getAll('adjustments'))
                .filter(a => !state.currentStationId || Number(a.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
            const inv = await getAll('inventory');

            let stationOptions = '';
            state.stations.forEach(s => {
                const selected = state.currentStationId === s.id ? ' selected' : '';
                stationOptions += '<option value="' + s.id + '"' + selected + '>' + s.name + '</option>';
            });

            let html = '<div class="row g-4">';
            if (canAdjust) {
                html += '<div class="col-lg-4"><div class="card-box">' +
                    '<h5 class="mb-3"><i class="bi bi-sliders"></i> Adjustment</h5>' +
                    '<form id="adjForm">' +
                    '<div class="mb-2"><label class="form-label small">Adjustment Type *</label>' +
                    '<select id="adjType" class="form-select form-select-sm">' +
                    '<option value="quantity">Quantity (Stock Volume)</option>' +
                    '<option value="cost_price">Cost Price</option>' +
                    '<option value="selling_price">Selling Price</option>' +
                    '<option value="both_prices">Cost + Selling Price</option>' +
                    '</select></div>' +
                    '<div class="mb-2"><label class="form-label small">Station *</label>' +
                    '<select id="adjStation" class="form-select form-select-sm">' + stationOptions + '</select></div>' +
                    '<div class="mb-2"><label class="form-label small">Product *</label>' +
                    '<select id="adjProduct" class="form-select form-select-sm">' +
                    '<option>Petrol</option><option>Diesel</option><option>Gas</option><option>Paraffin</option></select></div>' +
                    '<div class="mb-2 p-2 bg-light rounded small" id="adjCurrentInfo">' +
                    '<span class="text-muted">Current values will appear here</span></div>' +
                    '<div id="adjQtySection">' +
                    '<div class="row g-2 mb-2">' +
                    '<div class="col-6">' +
                    '<label class="form-label small">Current Quantity (L)</label>' +
                    '<input type="number" id="adjCurrentQty" class="form-control form-control-sm bg-light" step="0.01" readonly tabindex="-1">' +
                    '</div>' +
                    '<div class="col-6">' +
                    '<label class="form-label small">New Quantity (L) *</label>' +
                    '<input type="number" id="adjNewQty" class="form-control form-control-sm" step="0.01" min="0" placeholder="Enter target qty">' +
                    '</div>' +
                    '</div>' +
                    '<div class="mb-2 p-2 rounded small" id="adjQtyDelta" style="background:#e8f4fd;display:none;">' +
                    '<span class="text-muted">Difference: </span><strong id="adjDeltaValue">0 L</strong>' +
                    '</div>' +
                    '</div>' +
                    '<div id="adjCostSection" style="display:none;">' +
                    '<div class="mb-2"><label class="form-label small">New Cost Price (UGX/L) *</label>' +
                    '<input type="number" id="adjCost" class="form-control form-control-sm" step="10" min="0" placeholder="e.g. 3800"></div>' +
                    '</div>' +
                    '<div id="adjSellSection" style="display:none;">' +
                    '<div class="mb-2"><label class="form-label small">New Selling Price (UGX/L) *</label>' +
                    '<input type="number" id="adjSell" class="form-control form-control-sm" step="10" min="0" placeholder="e.g. 4200"></div>' +
                    '</div>' +
                    '<div class="mb-2"><label class="form-label small">Reason *</label>' +
                    '<input type="text" id="adjReason" class="form-control form-control-sm" placeholder="e.g. price revision, spill, leakage" required></div>' +
                    '<button type="submit" class="btn btn-warning w-100">Apply Adjustment</button>' +
                    '</form></div></div>';
            }

            html += '<div class="col-lg-' + (canAdjust ? '8' : '12') + '"><div class="card-box">' +
                '<h5 class="mb-3">Adjustment History</h5>' +
                '<div class="table-responsive"><table class="table table-sm table-hover">' +
                '<thead><tr><th>Station</th><th>Product</th><th>Type</th><th>Change</th><th>Reason</th><th>Date</th>' +
                (canAdjust ? '<th>Actions</th>' : '') +
                '</tr></thead><tbody>';

            if (adj.length === 0) {
                html += '<tr><td colspan="' + (canAdjust ? '7' : '6') + '" class="text-muted text-center">No adjustments</td></tr>';
            } else {
                adj.slice(0,40).forEach(a => {
                    const type = a.adj_type || 'quantity';
                    let typeBadge = '', changeText = '';
                    if (type === 'quantity') {
                        typeBadge = '<span class="badge bg-primary">Qty</span>';
                        const delta = Number(a.quantity || 0);
                        const qtyClass = delta < 0 ? 'text-danger' : 'text-success';
                        const deltaStr = '<span class="' + qtyClass + '">(' + (delta >= 0 ? '+' : '') + delta.toFixed(2) + ' L)</span>';
                        if (a.old_quantity != null && a.new_quantity != null) {
                            changeText = Number(a.old_quantity).toFixed(2) + ' → <strong>' + Number(a.new_quantity).toFixed(2) + ' L</strong> ' + deltaStr;
                        } else {
                            changeText = deltaStr;
                        }
                    } else if (type === 'cost_price') {
                        typeBadge = '<span class="badge bg-info text-dark">Cost</span>';
                        changeText = formatMoney(a.old_cost || 0) + ' → <strong>' + formatMoney(a.new_cost || 0) + '</strong>';
                    } else if (type === 'selling_price') {
                        typeBadge = '<span class="badge bg-success">Sell</span>';
                        changeText = formatMoney(a.old_sell || 0) + ' → <strong>' + formatMoney(a.new_sell || 0) + '</strong>';
                    } else if (type === 'both_prices') {
                        typeBadge = '<span class="badge bg-warning text-dark">Prices</span>';
                        changeText = 'Cost: ' + formatMoney(a.old_cost || 0) + '→' + formatMoney(a.new_cost || 0) +
                            '<br>Sell: ' + formatMoney(a.old_sell || 0) + '→' + formatMoney(a.new_sell || 0);
                    } else {
                        typeBadge = '<span class="badge bg-secondary">Qty</span>';
                        const delta = Number(a.quantity || 0);
                        changeText = '<span class="' + (delta < 0 ? 'text-danger' : 'text-success') + '">(' + (delta >= 0 ? '+' : '') + delta.toFixed(2) + ' L)</span>';
                    }
                    html += '<tr>' +
                        '<td>' + stationName(a.station_id) + '</td>' +
                        '<td><span class="product-badge ' + (a.product_type || '').toLowerCase() + '">' + (a.product_type || '—') + '</span></td>' +
                        '<td>' + typeBadge + '</td>' +
                        '<td class="fs-xs">' + changeText + '</td>' +
                        '<td class="fs-xs">' + (a.reason || '—') + '</td>' +
                        '<td class="fs-xs">' + formatDate(a.created_at) + '</td>';
                    if (canAdjust) {
                        html += '<td><button class="btn btn-sm btn-outline-danger delete-adj-btn" data-id="' + a.id + '"><i class="bi bi-trash"></i></button></td>';
                    }
                    html += '</tr>';
                });
            }

            html += '</tbody></table></div></div></div></div>';
            $('#pageContent').innerHTML = html;

            if (canAdjust) {
                function updateQtyDelta() {
                    const currentQty = parseFloat($('#adjCurrentQty').value) || 0;
                    const newQty = parseFloat($('#adjNewQty').value);
                    const deltaEl = $('#adjQtyDelta');
                    const deltaVal = $('#adjDeltaValue');
                    if (isNaN(newQty)) { deltaEl.style.display = 'none'; return; }
                    const delta = newQty - currentQty;
                    deltaEl.style.display = 'block';
                    if (delta === 0) {
                        deltaVal.textContent = '0 L (no change)';
                        deltaVal.className = 'text-muted';
                    } else if (delta > 0) {
                        deltaVal.textContent = '+' + delta.toFixed(2) + ' L (will be ADDED)';
                        deltaVal.className = 'text-success';
                    } else {
                        deltaVal.textContent = delta.toFixed(2) + ' L (will be REMOVED)';
                        deltaVal.className = 'text-danger';
                    }
                }

                async function updateCurrentInfo() {
                    const stationId = Number($('#adjStation').value);
                    const product = $('#adjProduct').value;
                    const item = inv.find(i => Number(i.station_id) === stationId && i.product_type === product);
                    const info = $('#adjCurrentInfo');
                    if (item) {
                        info.innerHTML = '<div><strong>Current:</strong> Qty <strong>' + (item.quantity || 0).toFixed(2) + ' L</strong> &nbsp;|&nbsp; ' +
                            'Cost <strong>' + formatMoney(item.cost_price || 0) + '</strong> &nbsp;|&nbsp; ' +
                            'Sell <strong>' + formatMoney(item.selling_price || 0) + '</strong></div>';
                        if ($('#adjCurrentQty')) $('#adjCurrentQty').value = Number(item.quantity || 0).toFixed(2);
                        if ($('#adjNewQty') && !$('#adjNewQty').value) $('#adjNewQty').value = Number(item.quantity || 0).toFixed(2);
                        if ($('#adjCost')) $('#adjCost').value = item.cost_price || '';
                        if ($('#adjSell')) $('#adjSell').value = item.selling_price || '';
                        updateQtyDelta();
                    } else {
                        info.innerHTML = '<span class="text-warning">No inventory record found for this station/product</span>';
                        if ($('#adjCurrentQty')) $('#adjCurrentQty').value = '0';
                        if ($('#adjNewQty')) $('#adjNewQty').value = '';
                        if ($('#adjCost')) $('#adjCost').value = '';
                        if ($('#adjSell')) $('#adjSell').value = '';
                        updateQtyDelta();
                    }
                }

                function toggleAdjFields() {
                    const type = $('#adjType').value;
                    $('#adjQtySection').style.display = (type === 'quantity') ? 'block' : 'none';
                    $('#adjCostSection').style.display = (type === 'cost_price' || type === 'both_prices') ? 'block' : 'none';
                    $('#adjSellSection').style.display = (type === 'selling_price' || type === 'both_prices') ? 'block' : 'none';
                    const newQtyInput = $('#adjNewQty');
                    const costInput = $('#adjCost');
                    const sellInput = $('#adjSell');
                    if (newQtyInput) newQtyInput.required = (type === 'quantity');
                    if (costInput) costInput.required = (type === 'cost_price' || type === 'both_prices');
                    if (sellInput) sellInput.required = (type === 'selling_price' || type === 'both_prices');
                }

                $('#adjType').onchange = function() { toggleAdjFields(); updateCurrentInfo(); };
                $('#adjStation').onchange = function() { if ($('#adjNewQty')) $('#adjNewQty').value = ''; updateCurrentInfo(); };
                $('#adjProduct').onchange = function() { if ($('#adjNewQty')) $('#adjNewQty').value = ''; updateCurrentInfo(); };
                if ($('#adjNewQty')) $('#adjNewQty').oninput = updateQtyDelta;
                toggleAdjFields();
                setTimeout(updateCurrentInfo, 50);

                $('#adjForm').onsubmit = async function(e) {
                    e.preventDefault();
                    const stationId = Number($('#adjStation').value);
                    const product = $('#adjProduct').value;
                    const type = $('#adjType').value;
                    const reason = $('#adjReason').value.trim();
                    if (!reason) { toast('Reason is required', 'warning'); return; }

                    try {
                        showLoading(true);
                        const invDocId = stationId + '_' + product;
                        const current = inv.find(i => Number(i.station_id) === stationId && i.product_type === product);

                        if (type === 'quantity') {
                            const currentQty = parseFloat($('#adjCurrentQty').value) || 0;
                            const newQty = parseFloat($('#adjNewQty').value);
                            if (isNaN(newQty) || newQty < 0) { toast('Enter a valid new quantity (0 or more)', 'warning'); showLoading(false); return; }
                            const qty = newQty - currentQty;
                            if (qty === 0) { toast('New quantity is the same as current – no change needed', 'info'); showLoading(false); return; }
                            await adjustInventory(stationId, product, qty);
                            await addDoc('adjustments', {
                                station_id: stationId,
                                product_type: product,
                                adj_type: 'quantity',
                                quantity: qty,
                                old_quantity: currentQty,
                                new_quantity: newQty,
                                reason: reason,
                                created_by: state.user.id
                            });
                            await logAudit('stock_adjustment', { station: stationId, product, qty, old: currentQty, new: newQty, reason });
                            toast('Quantity updated: ' + currentQty.toFixed(2) + ' L → ' + newQty.toFixed(2) + ' L');
                        } else if (type === 'cost_price') {
                            const newCost = parseFloat($('#adjCost').value);
                            if (isNaN(newCost) || newCost < 0) { toast('Enter a valid cost price', 'warning'); showLoading(false); return; }
                            const oldCost = current ? (current.cost_price || 0) : 0;
                            const ref = db.collection('inventory').doc(invDocId);
                            const snap = await ref.get();
                            if (!snap.exists) {
                                await ref.set({
                                    station_id: stationId,
                                    product_type: product,
                                    quantity: 0,
                                    cost_price: newCost,
                                    selling_price: 0,
                                    companyId: state.user.companyId,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            } else {
                                await ref.update({ cost_price: newCost, last_updated: firebase.firestore.FieldValue.serverTimestamp() });
                            }
                            await addDoc('adjustments', {
                                station_id: stationId,
                                product_type: product,
                                adj_type: 'cost_price',
                                old_cost: oldCost,
                                new_cost: newCost,
                                reason: reason,
                                created_by: state.user.id
                            });
                            await logAudit('cost_adjustment', { station: stationId, product, oldCost, newCost, reason });
                            toast('Cost price updated: ' + formatMoney(oldCost) + ' → ' + formatMoney(newCost));
                        } else if (type === 'selling_price') {
                            const newSell = parseFloat($('#adjSell').value);
                            if (isNaN(newSell) || newSell < 0) { toast('Enter a valid selling price', 'warning'); showLoading(false); return; }
                            const oldSell = current ? (current.selling_price || 0) : 0;
                            const ref = db.collection('inventory').doc(invDocId);
                            const snap = await ref.get();
                            if (!snap.exists) {
                                await ref.set({
                                    station_id: stationId,
                                    product_type: product,
                                    quantity: 0,
                                    cost_price: 0,
                                    selling_price: newSell,
                                    companyId: state.user.companyId,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            } else {
                                await ref.update({ selling_price: newSell, last_updated: firebase.firestore.FieldValue.serverTimestamp() });
                            }
                            await addDoc('adjustments', {
                                station_id: stationId,
                                product_type: product,
                                adj_type: 'selling_price',
                                old_sell: oldSell,
                                new_sell: newSell,
                                reason: reason,
                                created_by: state.user.id
                            });
                            await logAudit('sell_adjustment', { station: stationId, product, oldSell, newSell, reason });
                            toast('Selling price updated: ' + formatMoney(oldSell) + ' → ' + formatMoney(newSell));
                        } else if (type === 'both_prices') {
                            const newCost = parseFloat($('#adjCost').value);
                            const newSell = parseFloat($('#adjSell').value);
                            if (isNaN(newCost) || newCost < 0 || isNaN(newSell) || newSell < 0) {
                                toast('Enter valid cost and selling prices', 'warning'); showLoading(false); return;
                            }
                            const oldCost = current ? (current.cost_price || 0) : 0;
                            const oldSell = current ? (current.selling_price || 0) : 0;
                            const ref = db.collection('inventory').doc(invDocId);
                            const snap = await ref.get();
                            if (!snap.exists) {
                                await ref.set({
                                    station_id: stationId,
                                    product_type: product,
                                    quantity: 0,
                                    cost_price: newCost,
                                    selling_price: newSell,
                                    companyId: state.user.companyId,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            } else {
                                await ref.update({
                                    cost_price: newCost,
                                    selling_price: newSell,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                            await addDoc('adjustments', {
                                station_id: stationId,
                                product_type: product,
                                adj_type: 'both_prices',
                                old_cost: oldCost,
                                new_cost: newCost,
                                old_sell: oldSell,
                                new_sell: newSell,
                                reason: reason,
                                created_by: state.user.id
                            });
                            await logAudit('price_adjustment', { station: stationId, product, oldCost, newCost, oldSell, newSell, reason });
                            toast('Prices updated');
                        }
                        renderAdjustments();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    } finally {
                        showLoading(false);
                    }
                };

                document.querySelectorAll('.delete-adj-btn').forEach(btn => {
                    btn.onclick = async function() {
                        if (!confirm('Delete this adjustment record? (Does not reverse inventory)')) return;
                        try {
                            await deleteDoc('adjustments', this.dataset.id);
                            toast('Adjustment record deleted');
                            renderAdjustments();
                        } catch (err) {
                            toast('Error: ' + err.message, 'danger');
                        }
                    };
                });
            }
        }

        console.log('Part 7 loaded');
    </script>

    <!-- PART 8: USERS, ACTIVITY, FINANCIALS, CUSTOMERS, RECEIPTS -->
    <script>
        // ----- USERS (with self password change) -----
        async function renderUsers() {
            if (!canManageUsers(state.user.role)) {
                $('#pageContent').innerHTML =
                    '<div class="alert alert-danger">Access denied. Only Top Admin can manage users.</div>';
                return;
            }
            const users = await getAll('users');
            let stationOptions = '<option value="">— None —</option>';
            state.stations.forEach(s => {
                stationOptions += '<option value="' + s.id + '">' + s.name + '</option>';
            });

            let html = '<div class="row g-4">';
            // Change My Password
            html += `
            <div class="col-lg-12">
              <div class="card-box mb-3">
                <h5 class="mb-3"><i class="bi bi-key"></i> Change My Password</h5>
                <form id="changePasswordForm">
                  <div class="row g-2">
                    <div class="col-md-3">
                      <label class="form-label small">Current Password</label>
                      <input type="password" id="oldPass" class="form-control form-control-sm" required>
                    </div>
                    <div class="col-md-3">
                      <label class="form-label small">New Password (min 4)</label>
                      <input type="password" id="newPass1" class="form-control form-control-sm" required>
                    </div>
                    <div class="col-md-3">
                      <label class="form-label small">Confirm New Password</label>
                      <input type="password" id="newPass2" class="form-control form-control-sm" required>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                      <button type="submit" class="btn btn-primary btn-sm w-100">Change Password</button>
                    </div>
                  </div>
                  <div id="passChangeResult" class="mt-2 small"></div>
                </form>
              </div>
            </div>`;

            // Add User
            html += `
            <div class="col-lg-4">
              <div class="card-box">
                <h5 class="mb-3"><i class="bi bi-person-plus"></i> Add New User</h5>
                <form id="userForm">
                  <div class="mb-2"><label class="form-label small">Username *</label>
                    <input type="text" id="uUsername" class="form-control form-control-sm" required placeholder="e.g. john">
                  </div>
                  <div class="mb-2"><label class="form-label small">Full Name</label>
                    <input type="text" id="uName" class="form-control form-control-sm" placeholder="John Doe">
                  </div>
                  <div class="mb-2"><label class="form-label small">Password *</label>
                    <input type="text" id="uPass" class="form-control form-control-sm" required placeholder="Min 4 characters">
                  </div>
                  <div class="mb-2"><label class="form-label small">Role</label>
                    <select id="uRole" class="form-select form-select-sm">
                      <option value="cashier">Cashier</option>
                      <option value="manager">Manager</option>
                      <option value="top_admin">Top Admin</option>
                    </select>
                  </div>
                  <div class="mb-2"><label class="form-label small">Station (for Cashiers)</label>
                    <select id="uStation" class="form-select form-select-sm">${stationOptions}</select>
                  </div>
                  <button type="submit" class="btn btn-primary w-100" id="createUserBtn">Create User</button>
                </form>
                <div id="userResult" class="mt-2 small"></div>
              </div>
            </div>`;

            // User list
            html += `
            <div class="col-lg-8">
              <div class="card-box">
                <h5 class="mb-3"><i class="bi bi-people"></i> All Users</h5>
                <div class="table-responsive"><table class="table table-sm table-hover">
                  <thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Station</th><th>Actions</th></tr></thead>
                  <tbody>`;

            users.forEach(u => {
                html += '<tr>' +
                    '<td><strong>' + u.username + '</strong></td>' +
                    '<td>' + (u.name || '—') + '</td>' +
                    '<td><span class="badge bg-secondary">' + u.role + '</span></td>' +
                    '<td>' + (u.station_id ? stationName(u.station_id) : 'All') + '</td>' +
                    '<td>' +
                    (u.id !== state.user.id ?
                        `<button class="btn btn-sm btn-outline-primary edit-user-btn me-1" data-id="${u.id}" data-username="${u.username}" data-name="${u.name || ''}" data-role="${u.role}" data-station="${u.station_id || ''}" title="Edit"><i class="bi bi-pencil"></i></button>` +
                        `<button class="btn btn-sm btn-outline-warning reset-pass-btn me-1" data-id="${u.id}" data-username="${u.username}" title="Reset Password"><i class="bi bi-key"></i></button>` +
                        `<button class="btn btn-sm btn-outline-danger del-user" data-id="${u.id}" title="Delete"><i class="bi bi-trash"></i></button>` :
                        '<span class="text-muted small">you</span>'
                    ) +
                    '</td></tr>';
            });

            html += '</tbody></table></div></div></div></div>';
            $('#pageContent').innerHTML = html;

            // Change Password handler
            $('#changePasswordForm').onsubmit = async function(e) {
                e.preventDefault();
                const oldPass = $('#oldPass').value;
                const newPass1 = $('#newPass1').value;
                const newPass2 = $('#newPass2').value;
                const resultDiv = $('#passChangeResult');
                resultDiv.innerHTML = '';
                if (newPass1.length < 4) {
                    resultDiv.innerHTML = '<span class="text-danger">New password must be at least 4 characters.</span>';
                    return;
                }
                if (newPass1 !== newPass2) {
                    resultDiv.innerHTML = '<span class="text-danger">Passwords do not match.</span>';
                    return;
                }
                try {
                    const hashedOld = await hashPassword(oldPass);
                    const currentUserDoc = await db.collection('users').doc(state.user.id).get();
                    if (!currentUserDoc.exists) {
                        resultDiv.innerHTML = '<span class="text-danger">User record not found.</span>';
                        return;
                    }
                    const storedHash = currentUserDoc.data().password;
                    if (storedHash !== hashedOld && storedHash !== oldPass) {
                        resultDiv.innerHTML = '<span class="text-danger">Current password is incorrect.</span>';
                        return;
                    }
                    const hashedNew = await hashPassword(newPass1);
                    await db.collection('users').doc(state.user.id).update({
                        password: hashedNew,
                        password_updated_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    toast('Password changed successfully!', 'success');

                    $('#oldPass').value = '';
                    $('#newPass1').value = '';
                    $('#newPass2').value = '';

                    resultDiv.innerHTML = '<span class="text-danger">Error: ' + err.message + '</span>';
                    toast('Error: ' + err.message, 'danger');

            // User create/edit/delete/reset
            $('#userForm').onsubmit = async function(e) {
                e.preventDefault();
                $('#userResult').innerHTML = '';
                const submitBtn = document.getElementById('createUserBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating...';
                try {
                    const username = $('#uUsername').value.trim().toLowerCase();
                    const name = $('#uName').value.trim();
                    const password = $('#uPass').value.trim();
                    const role = $('#uRole').value;
                    const stationId = $('#uStation').value ? Number($('#uStation').value) : null;
                    if (password.length < 4) {
                        toast('Password must be at least 4 characters', 'warning');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Create User';
                        return;
                    }
                    const existing = await db.collection('users').where('username', '==', username).get();
                    if (!existing.empty) {
                        toast('Username already exists. Please choose another.', 'warning');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Create User';
                        return;
                    }
                    const hashed = await hashPassword(password);
                    await addDoc('users', {
                        username: username,
                        name: name || username,
                        password: hashed,
                        role: role,
                        station_id: stationId,
                        active: true
                    });
                    await logAudit('create_user', { username: username, role: role });
                    $('#userResult').innerHTML =
                        '<span class="text-success">✅ User created! Password: <strong>' + password + '</strong></span>';
                    toast('User created successfully');
                    renderUsers();
                } catch (err) {
                    $('#userResult').innerHTML = '<span class="text-danger">❌ Error: ' + err.message + '</span>';
                    toast('Failed to create user: ' + err.message, 'danger');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create User';
                }
            };

            document.querySelectorAll('.edit-user-btn').forEach(btn => {

                    const username = this.dataset.username;
                    const name = this.dataset.name;
                    const role = this.dataset.role;
                    const station = this.dataset.station;
                    const newName = prompt('Edit Full Name:', name);
                    if (newName === null) return;
                    const newRole = prompt('Edit Role (cashier/manager/top_admin):', role);
                    if (newRole === null) return;
                    const newStation = prompt('Edit Station ID (leave blank for none):', station || '');
                    const stationId = newStation ? Number(newStation) : null;
                    if (!['cashier', 'manager', 'top_admin'].includes(newRole)) {
                        toast('Invalid role. Use: cashier, manager, or top_admin', 'danger');
                        return;
                    }
                    updateDoc('users', id, {
                        name: newName || username,
                        role: newRole,
                        station_id: stationId
                    }).then(() => {
                        toast('User updated!', 'success');
                        renderUsers();
                    }).catch(err => toast('Error: ' + err.message, 'danger'));
                };

            document.querySelectorAll('.del-user').forEach(btn => {
                btn.onclick = async function() {
                    const id = btn.getAttribute('data-id');
                    if (id === state.user.id) {
                        toast('You cannot delete your own account!', 'danger');
                        return;

                    if (!confirm('Delete this user permanently?')) return;
                    try {
                        await deleteDoc('users', id);
                        await logAudit('delete_user', { userId: id });
                        toast('User deleted');
                        renderUsers();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            });

            document.querySelectorAll('.reset-pass-btn').forEach(btn => {
                btn.onclick = async function() {
                    const id = this.dataset.id;
                    const username = this.dataset.username;
                    const newPass = prompt('Enter new password for "' + username + '" (min 4 characters):');
                    if (newPass === null) return;
                    if (!newPass || newPass.length < 4) {
                        toast('Password must be at least 4 characters', 'warning');
                        return;
                    }
                    if (!confirm('Reset password for "' + username + '"?')) return;
                    try {

                            password: hashed,
                            password_updated_at: firebase.firestore.FieldValue.serverTimestamp(),
                            password_reset_by: state.user.id
                        });
                        await logAudit('reset_password', { targetUserId: id, targetUsername: username });
                        toast('Password reset for ' + username + '. New password: ' + newPass, 'success');
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            });
        }

                    <td><span class="badge bg-secondary">${log.action}</span></td>

        async function renderReceipts() {
            const sales = (await getAll('sales'))
                .filter(s => !state.currentStationId || Number(s.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));

            let html = `
              <div class="card-box">
                <h5 class="mb-3"><i class="bi bi-receipt"></i> Receipt History</h5>
                <div class="mb-3">
                  <input type="text" id="receiptSearch" class="form-control form-control-sm" placeholder="Search by transaction ID, customer, or product...">
                </div>
                <div class="table-responsive" style="max-height:500px; overflow-y:auto;">
                  <table class="table table-sm table-hover">
                    <thead><tr><th>Receipt #</th><th>Station</th><th>Items</th><th>Total</th><th>Payment</th><th>Customer</th><th>Date</th><th>Actions</th></tr></thead>
                    <tbody>`;

            const grouped = {};
            sales.forEach(s => {
                const tid = s.transaction_id || s.id;
                if (!grouped[tid]) {
                    grouped[tid] = {
                        transactionId: tid,
                        station: s.station_id,
                        items: [],
                        total: 0,
                        payment: s.payment_method || 'cash',
                        customer: s.customer_name || 'Walk-in',
                        date: s.sale_date || s.created_at
                    };
                }
                grouped[tid].items.push({
                    product: s.product_type,
                    qty: s.quantity,
                    price: s.selling_price,
                    amount: s.amount
                });
                grouped[tid].total += Number(s.amount) || 0;
            });

            const groupedArray = Object.values(grouped);
            if (groupedArray.length === 0) {
                html += '<tr><td colspan="8" class="text-center text-muted">No receipts found</td></tr>';
            } else {
                groupedArray.slice(0, 50).forEach(g => {
                    const itemsList = g.items.map(i => i.product + ' ' + i.qty + 'L').join(', ');
                    html += `<tr>
                    <td><strong>#${String(g.transactionId).slice(0, 8)}</strong></td>
                    <td>${stationName(g.station)}</td>
                    <td class="fs-xs">${itemsList}</td>
                    <td><strong>${formatMoney(g.total)}</strong></td>
                    <td><span class="badge bg-secondary">${g.payment}</span></td>
                    <td>${g.customer}</td>
                    <td class="fs-xs">${formatDate(g.date)}</td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary reprint-btn" data-data='${JSON.stringify(g).replace(/'/g, "&#39;")}'>
                        <i class="bi bi-printer"></i>
                      </button>
                    </td>
                  </tr>`;
                });
            }

            html += `</tbody></table></div></div>`;
            $('#pageContent').innerHTML = html;

            $('#receiptSearch').oninput = function() {
                const query = this.value.toLowerCase();
                document.querySelectorAll('#pageContent tbody tr').forEach(row => {
                    row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
                });
            };

            document.querySelectorAll('.reprint-btn').forEach(btn => {
                btn.onclick = function() {
                    const data = JSON.parse(this.dataset.data);
                    printReceipt({
                        transactionId: data.transactionId,
                        items: data.items,
                        total: data.total,
                        payment: data.payment,
                        customer: data.customer,
                        station: stationName(data.station),
                        date: formatDate(data.date)
                    });
                };
            });
        }
