                      <div class="mb-2">
                        <label class="form-label small">Address</label>
                        <input type="text" id="custAddress" class="form-control form-control-sm" placeholder="Location">
                      </div>
                      <button type="submit" class="btn btn-primary w-100">Add Customer</button>
                    </form>
                  </div>
                </div>
                <div class="col-lg-8">
                  <div class="card-box">
                    <h5 class="mb-3"><i class="bi bi-people"></i> Customers</h5>
                    <div class="mb-3">
                      <input type="text" id="custSearch" class="form-control form-control-sm" placeholder="Search customers...">
                    </div>
                    <div class="table-responsive" style="max-height:500px; overflow-y:auto;">
                      <table class="table table-sm table-hover">
                        <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Visits</th><th>Total Spent</th><th>Actions</th></tr></thead>
                        <tbody>`;

            if (customers.length === 0) {
                html += '<tr><td colspan="6" class="text-center text-muted">No customers yet</td></tr>';
            } else {
                customers.forEach(c => {
                    const customerSales = sales.filter(s => s.status !== 'reversed' && s.customer_name === c.name);
                    const visits = customerSales.length;
                    const totalSpent = customerSales.reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
                    html += `<tr>
                    <td><strong>${c.name}</strong></td>
                    <td>${c.phone || '—'}</td>
                    <td>${c.email || '—'}</td>
                    <td><span class="badge bg-secondary">${visits}</span></td>
                    <td>${formatMoney(totalSpent)}</td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary edit-cust-btn" data-id="${c.id}" data-name="${c.name}" data-phone="${c.phone || ''}" data-email="${c.email || ''}" data-address="${c.address || ''}"><i class="bi bi-pencil"></i></button>
                      <button class="btn btn-sm btn-outline-danger delete-cust-btn" data-id="${c.id}"><i class="bi bi-trash"></i></button>
                    </td>
                  </tr>`;
                });
            }

            html += `</tbody></table></div></div></div></div>`;
            $('#pageContent').innerHTML = html;

            $('#customerForm').onsubmit = async function(e) {
                e.preventDefault();
                const name = $('#custName').value.trim();
                if (!name) { toast('Customer name is required', 'warning'); return; }
                try {
                    await addDoc('customers', {
                        name: name,
                        phone: $('#custPhone').value.trim() || null,
                        email: $('#custEmail').value.trim() || null,
                        address: $('#custAddress').value.trim() || null,
                        created_by: state.user.id
                    });
                    await logAudit('add_customer', { name: name });
                    toast('Customer added!');
                    renderCustomers();
                } catch (err) {
                    toast('Error: ' + err.message, 'danger');
                }
            };

            document.querySelectorAll('.edit-cust-btn').forEach(btn => {
                btn.onclick = function() {
                    const id = this.dataset.id;
                    const newName = prompt('Edit Customer Name:', this.dataset.name);
                    if (newName === null) return;
                    const newPhone = prompt('Edit Phone:', this.dataset.phone || '');
                    if (newPhone === null) return;
                    const newEmail = prompt('Edit Email:', this.dataset.email || '');
                    if (newEmail === null) return;
                    const newAddress = prompt('Edit Address:', this.dataset.address || '');
                    if (newAddress === null) return;
                    updateDoc('customers', id, {
                        name: newName.trim(),
                        phone: newPhone.trim() || null,
                        email: newEmail.trim() || null,
                        address: newAddress.trim() || null
                    }).then(() => {
                        toast('Customer updated!', 'success');
                        renderCustomers();
                    }).catch(err => toast('Error: ' + err.message, 'danger'));
                };
            });

            document.querySelectorAll('.delete-cust-btn').forEach(btn => {
                btn.onclick = async function() {
                    if (!confirm('Delete this customer?')) return;
                    try {
                        await deleteDoc('customers', this.dataset.id);
                        toast('Customer deleted');
                        renderCustomers();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            });

            $('#custSearch').oninput = function() {
                const query = this.value.toLowerCase();
                document.querySelectorAll('#pageContent tbody tr').forEach(row => {
                    row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
                });
            };
        }

        console.log('Part 8 loaded');
    </script>

    <!-- PART 9: REPORTS -->
    <script>
        async function renderReports() {
            const inv = await getAll('inventory');
            const sales = await getAll('sales');
            const shifts = await getAll('shifts');
            const expenses = await getAll('expenses');
            const bankings = await getAll('bankings');
            const recons = await getAll('reconciliations');
            const stock = await getAll('stock');
            const adjustments = await getAll('adjustments');
            const users = await getAll('users');
            const accounts = await getAll('bank_accounts');

            const today = new Date();
            const thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

            function toISO(d) {
                return d.toISOString().slice(0, 10);
            }

            let stationOpts = '<option value="">All Stations</option>';
            state.stations.forEach(s => {
                const sel = state.currentStationId === s.id ? ' selected' : '';
                stationOpts += '<option value="' + s.id + '"' + sel + '>' + s.name + '</option>';
            });

            let html = '<div class="card-box mb-3 report-filter">' +
                '<div class="row g-2 align-items-end">' +
                '<div class="col-md-2"><label class="form-label">Report Type</label>' +
                '<select id="rptType" class="form-select form-select-sm">' +
                '<option value="sales">Sales Summary</option>' +
                '<option value="profit">Profit / Margin</option>' +
                '<option value="inventory">Inventory Snapshot</option>' +
                '<option value="shifts">Shift Performance</option>' +
                '<option value="reconciliation">Reconciliation</option>' +
                '<option value="expenses">Expenses</option>' +
                '<option value="stock">Offloading</option>' +
                '<option value="adjustments">Adjustments</option>' +
                '<option value="eop">End of Procedure (per Station)</option>' +
                '<option value="cashier_performance">Cashier Performance</option>' +
                '<option value="deposits">Deposits (Bankings)</option>' +
                '</select></div>' +
                '<div class="col-md-2"><label class="form-label">Station</label>' +
                '<select id="rptStation" class="form-select form-select-sm">' + stationOpts + '</select></div>' +
                '<div class="col-md-2"><label class="form-label">From</label>' +
                '<input type="date" id="rptFrom" class="form-control form-control-sm" value="' + toISO(thirtyDaysAgo) + '"></div>' +
                '<div class="col-md-2"><label class="form-label">To</label>' +
                '<input type="date" id="rptTo" class="form-control form-control-sm" value="' + toISO(today) + '"></div>' +
                '<div class="col-md-2"><label class="form-label">Product</label>' +
                '<select id="rptProduct" class="form-select form-select-sm">' +
                '<option value="">All Products</option>' +
                '<option value="Petrol">Petrol</option>' +
                '<option value="Diesel">Diesel</option>' +
                '<option value="Gas">Gas</option>' +
                '<option value="Paraffin">Paraffin</option>' +
                '</select></div>' +
                '<div class="col-md-2"><label class="form-label">Search</label>' +
                '<input type="text" id="rptSearch" class="form-control form-control-sm" placeholder="Search..."></div>' +
                '<div class="col-md-12 d-flex gap-2 mt-2">' +
                '<button class="btn btn-primary btn-sm flex-grow-1" id="rptGenerate"><i class="bi bi-search"></i> Generate</button>' +
                '<button class="btn btn-outline-secondary btn-sm" id="rptReset"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>' +
                '<button class="btn btn-outline-success btn-sm" id="rptExport"><i class="bi bi-download"></i> CSV</button>' +
                '<button class="btn btn-outline-danger btn-sm" id="rptExportPDF"><i class="bi bi-file-pdf"></i> PDF</button>' +
                '</div></div></div>' +
                '<div id="rptResult" class="card-box">' +
                '<div class="text-center text-muted py-5">Select filters and click <strong>Generate</strong></div></div>';

            $('#pageContent').innerHTML = html;

            function dateInRange(ts, from, to) {
                if (!ts) return false;
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                const f = new Date(from);
                f.setHours(0, 0, 0, 0);
                const t = new Date(to);
                t.setHours(23, 59, 59, 999);
                return d >= f && d <= t;
            }

            function getFilters() {
                return {
                    type: $('#rptType').value,
                    stationId: $('#rptStation').value ? Number($('#rptStation').value) : null,
                    from: $('#rptFrom').value,
                    to: $('#rptTo').value,
                    product: $('#rptProduct').value,
                    search: $('#rptSearch').value.toLowerCase().trim()
                };
            }

            function filterByCommon(arr, f) {
                return arr.filter(x => {
                    if (f.stationId && Number(x.station_id) !== f.stationId) return false;
                    if (f.product && x.product_type && x.product_type !== f.product) return false;
                    if (x.created_at && !dateInRange(x.created_at, f.from, f.to)) return false;
                    if (x.received_date && !dateInRange(x.received_date, f.from, f.to)) return false;
                    if (x.sale_date && !dateInRange(x.sale_date, f.from, f.to)) return false;
                    return true;
                });
            }

            function regenerateTable(headers, rows) {
                let tableHtml = '<div class="table-responsive"><table class="table table-sm table-hover table-report">';
                tableHtml += '<thead><tr>';
                headers.forEach(h => tableHtml += '<th>' + h + '</th>');
                tableHtml += '</tr></thead><tbody>';
                if (rows.length === 0) {
                    tableHtml += '<tr><td colspan="' + headers.length + '" class="text-center text-muted">No results found</td></tr>';
                } else {
                    rows.forEach(row => {
                        tableHtml += '<tr>';
                        row.forEach(cell => tableHtml += '<td>' + cell + '</td>');
                        tableHtml += '</tr>';
                    });
                }
                tableHtml += '</tbody></table></div>';
                return tableHtml;
            }

            // SALES SUMMARY (product-wise)
            function genSales(f) {
                const data = filterByCommon(sales, f).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
                let totalPetrol = 0, totalDiesel = 0, totalGas = 0, totalParaffin = 0;
                let totalAmt = 0;
                const headers = ['Station', 'Cashier', 'Petrol (L)', 'Diesel (L)', 'Gas (L)', 'Paraffin (L)', 'Total Qty (L)', 'Total Amount', 'Discount', 'Payment', 'Status', 'Date'];
                const rows = [];
                data.forEach(s => {
                    const qty = Number(s.quantity) || 0;
                    const amt = Number(s.amount) || 0;
                    const isRev = s.status === 'reversed';
                    const product = s.product_type || '';
                    let petrol = 0, diesel = 0, gas = 0, paraffin = 0;
                    if (product === 'Petrol') petrol = qty;
                    else if (product === 'Diesel') diesel = qty;
                    else if (product === 'Gas') gas = qty;
                    else if (product === 'Paraffin') paraffin = qty;
                    if (!isRev) {
                        totalPetrol += petrol;
                        totalDiesel += diesel;
                        totalGas += gas;
                        totalParaffin += paraffin;
                        totalAmt += amt;
                    }
                    const cashier = users.find(u => u.id === s.recorded_by);
                    const cashierName = cashier ? (cashier.name || cashier.username) : '—';
                    rows.push([
                        stationName(s.station_id), cashierName,
                        petrol.toFixed(2), diesel.toFixed(2), gas.toFixed(2), paraffin.toFixed(2),
                        qty.toFixed(2),
                        formatMoney(amt),
                        s.discount ? formatMoney(s.discount) : '—',
                        s.payment_method || 'cash',
                        isRev ? 'REVERSED' : 'Active',
                        formatDate(s.sale_date || s.created_at)
                    ]);
                });
                let body = '<div class="d-flex justify-content-between align-items-center mb-3">' +
                    '<h5 class="mb-0">Sales Summary <span class="badge bg-primary">' + data.length + '</span></h5>' +
                    '<div class="text-end"><div class="fw-bold">' + formatMoney(totalAmt) +
                    '</div><small class="text-muted">Petrol: ' + totalPetrol.toFixed(2) + 'L | Diesel: ' + totalDiesel.toFixed(2) +
                    'L | Gas: ' + totalGas.toFixed(2) + 'L | Paraffin: ' + totalParaffin.toFixed(2) + 'L</small></div></div>';
                body += regenerateTable(headers, rows);
                if (data.length > 0) {
                    body += '<div class="mt-3"><strong>Grand Total (excl. reversed):</strong> ' + formatMoney(totalAmt) +
                        ' | <strong>Total Qty:</strong> ' + (totalPetrol + totalDiesel + totalGas + totalParaffin).toFixed(2) + ' L' +
                        ' (Petrol: ' + totalPetrol.toFixed(2) + 'L, Diesel: ' + totalDiesel.toFixed(2) +
                        'L, Gas: ' + totalGas.toFixed(2) + 'L, Paraffin: ' + totalParaffin.toFixed(2) + 'L)</div>';
                }
                return { html: body, headers: headers, rows: rows, filename: 'sales_report' };
            }

            // DEPOSITS
            function genDeposits(f) {
                const data = bankings.filter(b => {
                    if (f.stationId && Number(b.station_id) !== f.stationId) return false;
                    if (b.created_at && !dateInRange(b.created_at, f.from, f.to)) return false;
                    return true;
                }).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));

                let total = 0;
                const headers = ['Source', 'Destination Account', 'Depositor', 'Amount', 'Date'];
                const rows = [];
                data.forEach(b => {
                    const amount = Number(b.amount) || 0;
                    total += amount;
                    let sourceLabel = 'Unknown';
                    if (b.source_account === 'cash_till') sourceLabel = 'Cash Till';
                    else if (b.source_account === 'petty_cash') sourceLabel = 'Petty Cash';
                    else {
                        const srcAcc = accounts.find(a => a.id === b.source_account);
                        if (srcAcc) sourceLabel = srcAcc.bank_name + ' (' + srcAcc.account_number + ')';
                    }
                    const destAcc = accounts.find(a => a.id === b.bank_account_id);
                    const destLabel = destAcc ? destAcc.bank_name + ' (' + destAcc.account_number + ')' : '—';
                    rows.push([
                        sourceLabel,
                        destLabel,
                        b.depositor || '—',
                        formatMoney(amount),
                        formatDate(b.created_at)
                    ]);
                });
                let body = '<div class="d-flex justify-content-between mb-3">' +
                    '<h5 class="mb-0">Deposits (Bankings) <span class="badge bg-info">' + data.length + '</span></h5>' +
                    '<div class="fw-bold">Total Deposited: ' + formatMoney(total) + '</div></div>';
                body += regenerateTable(headers, rows);
                return { html: body, headers: headers, rows: rows, filename: 'deposits_report' };
            }

            // PROFIT
            function genProfit(f) {
                const data = filterByCommon(sales, f).filter(s => s.status !== 'reversed');
                let totalRev = 0, totalCost = 0, totalQty = 0;
                const byProduct = {};
                data.forEach(s => {
                    const qty = Number(s.quantity) || 0;
                    const rev = Number(s.amount) || 0;
                    const cost = (Number(s.cost_price) || 0) * qty;
                    totalRev += rev; totalCost += cost; totalQty += qty;
                    const key = s.product_type || 'Unknown';
                    if (!byProduct[key]) byProduct[key] = { qty: 0, rev: 0, cost: 0 };
                    byProduct[key].qty += qty; byProduct[key].rev += rev; byProduct[key].cost += cost;
                });
                const profit = totalRev - totalCost;
                const margin = totalRev > 0 ? (profit / totalRev * 100) : 0;
                const headers = ['Product', 'Qty (L)', 'Revenue', 'Cost', 'Profit', 'Margin %'];
                const rows = [];
                Object.keys(byProduct).sort().forEach(p => {
                    const d = byProduct[p];
                    const pr = d.rev - d.cost;
                    const m = d.rev > 0 ? (pr / d.rev * 100) : 0;
                    rows.push([p, d.qty.toFixed(2), formatMoney(d.rev), formatMoney(d.cost), formatMoney(pr), m.toFixed(1) + '%']);
                });
                let body = '<div class="row g-3 mb-4">' +
                    '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#198754"><i class="bi bi-cash-stack"></i></div>' +
                    '<div><div class="num">' + formatMoney(totalRev) + '</div><div class="lbl">Revenue</div></div></div></div>' +
                    '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#dc3545"><i class="bi bi-cart"></i></div>' +
                    '<div><div class="num">' + formatMoney(totalCost) + '</div><div class="lbl">COGS</div></div></div></div>' +
                    '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#0d6efd"><i class="bi bi-graph-up-arrow"></i></div>' +
                    '<div><div class="num ' + (profit >= 0 ? 'profit-positive' : 'profit-negative') + '">' + formatMoney(profit) +
                    '</div><div class="lbl">Gross Profit</div></div></div></div>' +
                    '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#ffc107"><i class="bi bi-percent"></i></div>' +
                    '<div><div class="num">' + margin.toFixed(1) + '%</div><div class="lbl">Margin</div></div></div></div></div>';
                body += regenerateTable(headers, rows);
                return { html: body, headers: headers, rows: rows, filename: 'profit_report' };
            }

            // INVENTORY
            function genInventory(f) {
                const data = inv.filter(i => {
                    if (f.stationId && Number(i.station_id) !== f.stationId) return false;
                    if (f.product && i.product_type !== f.product) return false;
                    return true;
                });
                let totalLitres = 0, totalValue = 0;
                const headers = ['Station', 'Product', 'Quantity (L)', 'Cost/L', 'Sell/L', 'Stock Value', 'Potential Revenue'];
                const rows = [];
                data.forEach(i => {
                    const qty = Number(i.quantity) || 0;
                    const cost = Number(i.cost_price) || 0;
                    const sell = Number(i.selling_price) || 0;
                    totalLitres += qty; totalValue += qty * cost;
                    rows.push([
                        stationName(i.station_id), i.product_type, qty.toFixed(2),
                        formatMoney(cost), formatMoney(sell), formatMoney(qty * cost), formatMoney(qty * sell)
                    ]);
                });
                let body = '<div class="d-flex justify-content-between mb-3">' +
                    '<h5 class="mb-0">Inventory Snapshot <span class="badge bg-secondary">' + data.length + '</span></h5>' +
                    '<div class="text-end"><div class="fw-bold">' + totalLitres.toFixed(2) + ' L</div><small class="text-muted">' +
                    formatMoney(totalValue) + ' total value</small></div></div>';
                body += regenerateTable(headers, rows);
                return { html: body, headers: headers, rows: rows, filename: 'inventory_report' };
            }

            // SHIFTS
            function genShifts(f) {
                const data = shifts.filter(s => {
                    if (f.stationId && Number(s.station_id) !== f.stationId) return false;
                    if (s.created_at && !dateInRange(s.created_at, f.from, f.to)) return false;
                    return true;
                }).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
                const headers = ['Station', 'Cashier', 'Type', 'Status', 'Start P/D/G/Pf', 'End P/D/G/Pf', 'Sold P/D/G/Pf', 'Date'];
                const rows = [];
                data.forEach(s => {
                    const cashier = users.find(u => u.id === s.cashier_id);
                    const name = cashier ? (cashier.name || cashier.username) : '—';
                    const start = (s.start_petrol || 0) + '/' + (s.start_diesel || 0) + '/' + (s.start_gas || 0) + '/' + (s.start_paraffin || 0);
                    const end = s.status === 'closed' ? ((s.end_petrol || 0) + '/' + (s.end_diesel || 0) + '/' + (s.end_gas || 0) + '/' + (s.end_paraffin || 0)) : '—';
                    const soldP = s.status === 'closed' ? Math.max(0, (s.start_petrol || 0) - (s.end_petrol || 0)).toFixed(1) : '—';
                    const soldD = s.status === 'closed' ? Math.max(0, (s.start_diesel || 0) - (s.end_diesel || 0)).toFixed(1) : '—';
                    const soldG = s.status === 'closed' ? Math.max(0, (s.start_gas || 0) - (s.end_gas || 0)).toFixed(1) : '—';
                    const soldPf = s.status === 'closed' ? Math.max(0, (s.start_paraffin || 0) - (s.end_paraffin || 0)).toFixed(1) : '—';
                    rows.push([
                        stationName(s.station_id), name, s.shift_type, s.status, start, end,
                        soldP + '/' + soldD + '/' + soldG + '/' + soldPf, formatDate(s.created_at)
                    ]);
                });
                let body = '<div class="d-flex justify-content-between mb-3">' +
                    '<h5 class="mb-0">Shift Performance <span class="badge bg-secondary">' + data.length + '</span></h5></div>';
                body += regenerateTable(headers, rows);
                return { html: body, headers: headers, rows: rows, filename: 'shifts_report' };
            }

            // RECONCILIATION
            function genReconciliation(f) {
                let closed = shifts.filter(s => s.status === 'closed');
                if (f.stationId) closed = closed.filter(s => Number(s.station_id) === f.stationId);
                closed = closed.filter(s => !s.created_at || dateInRange(s.created_at, f.from, f.to));
                const headers = ['Station', 'Shift', 'Date', 'Expected', 'Cash', 'Mobile', 'Credit', 'Total Actual', 'Difference', 'Status'];
                const rows = [];
                closed.forEach(s => {
                    const petrolSold = Math.max(0, (s.start_petrol || 0) - (s.end_petrol || 0));
                    const dieselSold = Math.max(0, (s.start_diesel || 0) - (s.end_diesel || 0));
                    const gasSold = Math.max(0, (s.start_gas || 0) - (s.end_gas || 0));
                    const paraffinSold = Math.max(0, (s.start_paraffin || 0) - (s.end_paraffin || 0));
                    const pPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Petrol') || {}).selling_price || 0;
                    const dPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Diesel') || {}).selling_price || 0;
                    const gPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Gas') || {}).selling_price || 0;
                    const pfPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Paraffin') || {}).selling_price || 0;
                    const expected = petrolSold * pPrice + dieselSold * dPrice + gasSold * gPrice + paraffinSold * pfPrice;
                    const recon = recons.find(r => r.shift_id === s.id);
                    const cash = recon ? (recon.cash_actual || 0) : 0;
                    const mobile = recon ? (recon.mobile_actual || 0) : 0;
                    const credit = recon ? (recon.credit_actual || 0) : 0;
                    const actual = cash + mobile + credit;
                    rows.push([
                        stationName(s.station_id), s.shift_type, formatDate(s.created_at),
                        formatMoney(expected), formatMoney(cash), formatMoney(mobile), formatMoney(credit),
                        formatMoney(actual), formatMoney(actual - expected), recon ? 'Done' : 'Pending'
                    ]);
                });
                let body = '<div class="d-flex justify-content-between mb-3">' +
                    '<h5 class="mb-0">Reconciliation Report <span class="badge bg-secondary">' + closed.length + '</span></h5></div>';
                body += regenerateTable(headers, rows);
                return { html: body, headers: headers, rows: rows, filename: 'reconciliation_report' };
            }

            // EXPENSES
            function genExpenses(f) {
                const data = filterByCommon(expenses, f).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
                let total = 0;
                const headers = ['Station', 'Source', 'Description', 'Category', 'Amount', 'Date'];
                const rows = [];
                data.forEach(e => {
                    total += Number(e.amount) || 0;
                    const src = e.source_account === 'petty_cash' ? 'Petty Cash' : (e.source_account || '—');
                    rows.push([
                        stationName(e.station_id), src, e.description || '—', e.category || 'other',
                        formatMoney(e.amount || 0), formatDate(e.created_at)
                    ]);
                });
                let body = '<div class="d-flex justify-content-between mb-3">' +
                    '<h5 class="mb-0">Expenses <span class="badge bg-danger">' + data.length + '</span></h5>' +
                    '<div class="fw-bold text-danger">' + formatMoney(total) + '</div></div>';
                body += regenerateTable(headers, rows);
                return { html: body, headers: headers, rows: rows, filename: 'expenses_report' };
            }

            // STOCK
            function genStock(f) {
                const data = stock.filter(s => {
                    if (f.stationId && Number(s.station_id) !== f.stationId) return false;
                    const dt = s.received_date || s.created_at;
                    if (dt && !dateInRange(dt, f.from, f.to)) return false;
                    return true;
                }).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
                const headers = ['Station', 'Shipping #', 'Vendor', 'Items', 'Total Qty (L)', 'Date'];
                const rows = [];
                data.forEach(r => {
                    const items = (r.items || []).map(it => it.product_type + ' ' + it.quantity + 'L').join('; ');
                    const totalQty = (r.items || []).reduce((sum, it) => sum + (Number(it.quantity) || 0), 0);
                    rows.push([
                        stationName(r.station_id),
                        r.invoice_number || r.shipping_number || '—',
                        r.vendor || '—',
                        items,
                        totalQty.toFixed(2),
                        formatDate(r.received_date || r.created_at)
                    ]);
                });
                let body = '<div class="d-flex justify-content-between mb-3">' +
                    '<h5 class="mb-0">Offloading Report <span class="badge bg-info">' + data.length + '</span></h5></div>';
                body += regenerateTable(headers, rows);
                return { html: body, headers: headers, rows: rows, filename: 'offloading_report' };
            }

            // ADJUSTMENTS
            function genAdjustments(f) {
                const data = filterByCommon(adjustments, f).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
                const headers = ['Station', 'Product', 'Type', 'Change', 'Reason', 'Date'];
                const rows = [];
                data.forEach(a => {
                    const type = a.adj_type || 'quantity';
                    let typeLabel = 'Quantity', change = '';
                    if (type === 'quantity') {
                        const delta = Number(a.quantity || 0);
                        const deltaStr = '(' + (delta >= 0 ? '+' : '') + delta.toFixed(2) + ' L)';
                        change = (a.old_quantity != null && a.new_quantity != null) ?
                            Number(a.old_quantity).toFixed(2) + ' → ' + Number(a.new_quantity).toFixed(2) + ' L ' + deltaStr :
                            deltaStr;
                    } else if (type === 'cost_price') {
                        typeLabel = 'Cost Price';
                        change = formatMoney(a.old_cost || 0) + ' → ' + formatMoney(a.new_cost || 0);
                    } else if (type === 'selling_price') {
                        typeLabel = 'Selling Price';
                        change = formatMoney(a.old_sell || 0) + ' → ' + formatMoney(a.new_sell || 0);
                    } else if (type === 'both_prices') {
                        typeLabel = 'Cost + Sell';
                        change = 'C: ' + formatMoney(a.old_cost || 0) + '→' + formatMoney(a.new_cost || 0) +
                            ' | S: ' + formatMoney(a.old_sell || 0) + '→' + formatMoney(a.new_sell || 0);
                    } else {
                        change = Number(a.quantity || 0).toFixed(2) + ' L';
                    }
                    rows.push([
                        stationName(a.station_id), a.product_type, typeLabel, change,
                        a.reason || '—', formatDate(a.created_at)
                    ]);
                });
                let body = '<div class="d-flex justify-content-between mb-3">' +
                    '<h5 class="mb-0">Stock Adjustments <span class="badge bg-warning text-dark">' + data.length + '</span></h5></div>';
                body += regenerateTable(headers, rows);
                return { html: body, headers: headers, rows: rows, filename: 'adjustments_report' };
            }

            // EOP
            function genEOP(f) {
                const stationsToReport = f.stationId ?
                    state.stations.filter(s => Number(s.id) === f.stationId) :
                    state.stations;

                let body = '<h5 class="mb-4"><i class="bi bi-clipboard-check"></i> End of Procedure Report (per Station)</h5>';
                const allHeaders = ['Metric', 'Value'];
                const allRows = [];

                stationsToReport.forEach(st => {
                    const sid = Number(st.id);
                    const stSales = sales.filter(s => s.status !== 'reversed' && Number(s.station_id) === sid && dateInRange(s.created_at || s.sale_date, f.from, f.to));
                    const stShifts = shifts.filter(s => Number(s.station_id) === sid && dateInRange(s.created_at, f.from, f.to));
                    const stRecons = recons.filter(r => {
                        const sh = shifts.find(s => s.id === r.shift_id);
                        return sh && Number(sh.station_id) === sid && dateInRange(sh.created_at, f.from, f.to);
                    });
                    const stInv = inv.filter(i => Number(i.station_id) === sid);
                    const stStock = stock.filter(s => Number(s.station_id) === sid && dateInRange(s.received_date || s.created_at, f.from, f.to));
                    const stAdj = adjustments.filter(a => Number(a.station_id) === sid && dateInRange(a.created_at, f.from, f.to));
                    const stExp = expenses.filter(e => Number(e.station_id) === sid && dateInRange(e.created_at, f.from, f.to));

                    let salesQty = 0, salesRev = 0, salesDisc = 0;
                    const byProd = {};
                    stSales.forEach(s => {
                        const q = Number(s.quantity) || 0;
                        const a = Number(s.amount) || 0;
                        const d = Number(s.discount) || 0;
                        salesQty += q; salesRev += a; salesDisc += d;
                        const p = s.product_type || 'Unknown';
                        if (!byProd[p]) byProd[p] = { qty: 0, rev: 0 };
                        byProd[p].qty += q; byProd[p].rev += a;
                    });

                    const closedShifts = stShifts.filter(s => s.status === 'closed');
                    const activeShifts = stShifts.filter(s => s.status === 'active');
                    const pendingRecon = closedShifts.filter(s => !stRecons.find(r => r.shift_id === s.id)).length;

                    let invTotal = 0;
                    stInv.forEach(i => invTotal += Number(i.quantity) || 0);

                    let offloadQty = 0;
                    stStock.forEach(r => {
                        (r.items || []).forEach(it => offloadQty += Number(it.quantity) || 0);
                    });

                    let adjNet = 0;
                    stAdj.forEach(a => adjNet += Number(a.quantity) || 0);

                    let expTotal = 0;
                    stExp.forEach(e => expTotal += Number(e.amount) || 0);

                    body += '<div class="card-box mb-4 border">' +
                        '<h6 class="mb-3 text-primary"><i class="bi bi-geo-alt"></i> ' + st.name + ' (' + (st.location || '—') + ')</h6>' +
                        '<div class="row g-3 mb-3">' +
                        '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#198754"><i class="bi bi-cash-stack"></i></div>' +
                        '<div><div class="num" style="font-size:1.1rem">' + formatMoney(salesRev) + '</div><div class="lbl">Sales Revenue</div></div></div></div>' +
                        '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#0d6efd"><i class="bi bi-droplet"></i></div>' +
                        '<div><div class="num" style="font-size:1.1rem">' + salesQty.toFixed(1) + ' L</div><div class="lbl">Volume Sold</div></div></div></div>' +
                        '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#ffc107"><i class="bi bi-box-seam"></i></div>' +
                        '<div><div class="num" style="font-size:1.1rem">' + invTotal.toFixed(0) + ' L</div><div class="lbl">Current Stock</div></div></div></div>' +
                        '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#dc3545"><i class="bi bi-clock"></i></div>' +
                        '<div><div class="num" style="font-size:1.1rem">' + activeShifts.length + '</div><div class="lbl">Active Shifts</div></div></div></div>' +
                        '</div>' +
                        '<table class="table table-sm table-bordered">' +
                        '<tr><th colspan="2" class="bg-light">Sales</th></tr>' +
                        '<tr><td>Transactions</td><td>' + stSales.length + '</td></tr>' +
                        '<tr><td>Gross Revenue</td><td>' + formatMoney(salesRev + salesDisc) + '</td></tr>' +
                        '<tr><td>Discounts Given</td><td class="text-danger">' + formatMoney(salesDisc) + '</td></tr>' +
                        '<tr><td>Net Revenue</td><td><strong>' + formatMoney(salesRev) + '</strong></td></tr>' +
                        '<tr><td>Volume Sold</td><td>' + salesQty.toFixed(2) + ' L</td></tr>' +
                        Object.keys(byProd).map(p => '<tr><td>&nbsp;&nbsp;• ' + p + '</td><td>' + byProd[p].qty.toFixed(2) + ' L – ' + formatMoney(byProd[p].rev) + '</td></tr>').join('') +
                        '<tr><th colspan="2" class="bg-light">Shifts & Balancing</th></tr>' +
                        '<tr><td>Total Shifts</td><td>' + stShifts.length + '</td></tr>' +
                        '<tr><td>Closed Shifts</td><td>' + closedShifts.length + '</td></tr>' +
                        '<tr><td>Active Shifts</td><td>' + activeShifts.length + '</td></tr>' +
                        '<tr><td>Pending Reconciliation</td><td class="' + (pendingRecon > 0 ? 'text-danger fw-bold' : 'text-success') + '">' + pendingRecon + '</td></tr>' +
                        '<tr><th colspan="2" class="bg-light">Inventory Movement</th></tr>' +
                        '<tr><td>Current Stock (all products)</td><td>' + invTotal.toFixed(2) + ' L</td></tr>' +
                        '<tr><td>Offloaded (received)</td><td class="text-success">+' + offloadQty.toFixed(2) + ' L</td></tr>' +
                        '<tr><td>Net Adjustments</td><td class="' + (adjNet >= 0 ? 'text-success' : 'text-danger') + '">' + (adjNet >= 0 ? '+' : '') + adjNet.toFixed(2) + ' L</td></tr>' +
                        '<tr><th colspan="2" class="bg-light">Financials</th></tr>' +
                        '<tr><td>Expenses</td><td class="text-danger">' + formatMoney(expTotal) + '</td></tr>' +
                        '</table>' +
                        '<div class="text-end small text-muted mt-2">Period: ' + f.from + ' → ' + f.to + '</div></div>';

                    allRows.push(['=== ' + st.name + ' ===', '']);
                    allRows.push(['Sales Revenue (Net)', formatMoney(salesRev)]);
                    allRows.push(['Volume Sold (L)', salesQty.toFixed(2)]);
                    allRows.push(['Transactions', stSales.length]);
                    allRows.push(['Discounts', formatMoney(salesDisc)]);
                    allRows.push(['Closed Shifts', closedShifts.length]);
                    allRows.push(['Active Shifts', activeShifts.length]);
                    allRows.push(['Pending Reconciliation', pendingRecon]);
                    allRows.push(['Current Stock (L)', invTotal.toFixed(2)]);
                    allRows.push(['Offloaded (L)', offloadQty.toFixed(2)]);
                    allRows.push(['Net Adjustments (L)', adjNet.toFixed(2)]);
                    allRows.push(['Expenses', formatMoney(expTotal)]);
                    allRows.push(['', '']);
                });

                if (stationsToReport.length === 0) {
                    body = '<div class="alert alert-info">No stations found</div>';
                }

                return { html: body, headers: allHeaders, rows: allRows, filename: 'end_of_procedure_report' };
            }

            // CASHIER PERFORMANCE
            function genCashierPerformance(f) {
                const data = recons.filter(r => {
                    if (f.stationId && Number(r.station_id) !== f.stationId) return false;
                    if (r.timestamp && !dateInRange(r.timestamp, f.from, f.to)) return false;
                    return true;
                });

                const grouped = {};
                data.forEach(r => {
                    const cid = r.cashier_id;
                    if (!grouped[cid]) {
                        grouped[cid] = {
                            cashierId: cid,
                            totalShortage: 0,
                            totalExcess: 0,
                            count: 0
                        };
                    }
                    const diff = Number(r.difference) || 0;
                    if (diff < 0) grouped[cid].totalShortage += diff;
                    else grouped[cid].totalExcess += diff;
                    grouped[cid].count += 1;
                });

                const headers = ['Cashier', 'Total Shortage', 'Total Excess', 'Net Difference', 'Reconciliations', 'Status'];
                const rows = [];
                Object.keys(grouped).forEach(cid => {
                    const g = grouped[cid];
                    const net = g.totalShortage + g.totalExcess;
                    const user = users.find(u => u.id === cid);
                    const name = user ? (user.name || user.username) : 'Unknown';
                    let status = 'Balanced';
                    if (net < 0) status = '⚠️ Shortage (deduct from salary)';
                    else if (net > 0) status = '✅ Excess';
                    else status = '✅ Accurate';
                    rows.push([
                        name,
                        formatMoney(Math.abs(g.totalShortage)),
                        formatMoney(g.totalExcess),
                        formatMoney(net),
                        g.count,
                        status
                    ]);
                });

                if (rows.length === 0) {
                    rows.push(['No reconciliations found', '', '', '', '', '']);
                }

                let body = '<div class="d-flex justify-content-between mb-3">' +
                    '<h5 class="mb-0">Cashier Performance <span class="badge bg-info">' + data.length + ' reconciliations</span></h5>' +
                    '</div>';
                body += regenerateTable(headers, rows);
                return { html: body, headers: headers, rows: rows, filename: 'cashier_performance' };
            }

            // MAIN
            let lastReport = null;

            function runReport() {
                const f = getFilters();
                let result;
                switch (f.type) {
                    case 'sales': result = genSales(f); break;
                    case 'profit': result = genProfit(f); break;
                    case 'inventory': result = genInventory(f); break;
                    case 'shifts': result = genShifts(f); break;
                    case 'reconciliation': result = genReconciliation(f); break;
                    case 'expenses': result = genExpenses(f); break;
                    case 'stock': result = genStock(f); break;
                    case 'adjustments': result = genAdjustments(f); break;
                    case 'eop': result = genEOP(f); break;
                    case 'cashier_performance': result = genCashierPerformance(f); break;
                    case 'deposits': result = genDeposits(f); break;
                    default: result = { html: '<div class="alert alert-info">Unknown report type</div>', headers: [], rows: [], filename: 'report' };
                }
                if (f.search && result.rows && result.rows.length > 0 && f.type !== 'eop') {
                    const filteredRows = result.rows.filter(row =>
                        row.some(cell => String(cell).toLowerCase().includes(f.search))
                    );
                    result.rows = filteredRows;
                    result.html = regenerateTable(result.headers, filteredRows);
                    if (filteredRows.length === 0) {
                        result.html = '<div class="alert alert-info">No results matching "' + f.search + '"</div>';
                    }
                }
                lastReport = result;
                $('#rptResult').innerHTML = result.html;
            }

            $('#rptGenerate').onclick = runReport;

            $('#rptReset').onclick = function() {
                const today = new Date();
                const thirtyDaysAgo = new Date(today);
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                $('#rptType').value = 'sales';
                $('#rptStation').value = '';
                $('#rptFrom').value = toISO(thirtyDaysAgo);
                $('#rptTo').value = toISO(today);
                $('#rptProduct').value = '';
                $('#rptSearch').value = '';
                toast('Filters reset', 'info');
                runReport();
            };

            $('#rptExport').onclick = function() {
                if (!lastReport || !lastReport.rows || lastReport.rows.length === 0) {
                    toast('Generate a report with data first', 'warning');
                    return;
                }
                exportCSV(lastReport.headers, lastReport.rows, lastReport.filename + '.csv');
                toast('CSV exported');
            };

            $('#rptExportPDF').onclick = function() {
                if (!lastReport || !lastReport.rows || lastReport.rows.length === 0) {
                    toast('Generate a report with data first', 'warning');
                    return;
                }
                exportPDF(lastReport.headers, lastReport.rows, lastReport.filename + '.pdf');
                toast('PDF generated');
            };

            $('#rptSearch').onkeypress = function(e) {
                if (e.key === 'Enter') runReport();
            };

            runReport();
        }

        console.log('Part 9 loaded');
    </script>

    <!-- PART 10: COMPANY PROFILE & ALL COMPANIES -->
    <script>
        async function renderCompanyProfile() {
            const companyId = state.user.companyId;
            if (!companyId) {
                $('#pageContent').innerHTML = '<div class="alert alert-danger">No company found for this user.</div>';
                return;
            }

            try {
                const company = await getCompany(companyId);
                if (!company) {
                    $('#pageContent').innerHTML = '<div class="alert alert-danger">Company not found.</div>';
                    return;
                }

                const stations = await getAll('stations');

                let html = `
                <div class="row g-4">
                  <div class="col-lg-5">
                    <div class="card-box">
                      <h5 class="mb-3"><i class="bi bi-building"></i> Edit Company Profile</h5>
                      <form id="companyEditForm">
                        <div class="mb-2">
                          <label class="form-label small">Company Name *</label>
                          <input type="text" id="compName" class="form-control form-control-sm" value="${company.name || ''}" required>
                        </div>
                        <div class="mb-2">
                          <label class="form-label small">Tagline</label>
                          <input type="text" id="compTagline" class="form-control form-control-sm" value="${company.tagline || ''}">
                        </div>
                        <div class="mb-2">
                          <label class="form-label small">Address</label>
                          <input type="text" id="compAddress" class="form-control form-control-sm" value="${company.address || ''}">
                        </div>
                        <div class="mb-2">
                          <label class="form-label small">Phone</label>
                          <input type="text" id="compPhone" class="form-control form-control-sm" value="${company.phone || ''}">
                        </div>
                        <div class="mb-2">
                          <label class="form-label small">Email</label>
                          <input type="email" id="compEmail" class="form-control form-control-sm" value="${company.email || ''}">
                        </div>
                        <div class="mb-2">
                          <label class="form-label small">Tax ID</label>
                          <input type="text" id="compTax" class="form-control form-control-sm" value="${company.tax_id || ''}">
                        </div>
                        <div class="mb-2">
                          <label class="form-label small">Website</label>
                          <input type="text" id="compWebsite" class="form-control form-control-sm" value="${company.website || ''}">
                        </div>
                        <div class="mb-2">
                          <label class="form-label small">Logo URL</label>
                          <input type="text" id="compLogo" class="form-control form-control-sm" value="${company.logo_url || ''}" placeholder="https://example.com/logo.png">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Update Company</button>
                      </form>
                      <div id="companyUpdateResult" class="mt-2 small"></div>
                    </div>

                    <div class="card-box mt-3">
                      <h6><i class="bi bi-archive"></i> Backup & Restore</h6>
                      <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-outline-primary btn-sm" id="backupDownloadBtn"><i class="bi bi-download"></i> Download Backup</button>
                        <button class="btn btn-outline-warning btn-sm" id="backupUploadBtn"><i class="bi bi-upload"></i> Import Backup</button>
                        <input type="file" id="backupFileInput" accept=".json" style="display:none;">
                      </div>
                      <div id="backupResult" class="mt-2 small"></div>
                    </div>
                  </div>

                  <div class="col-lg-7">
                    <div class="card-box">
                      <h5 class="mb-3"><i class="bi bi-geo-alt"></i> Stations</h5>
                      <form id="stationForm" class="row g-2 mb-3">
                        <div class="col-auto">
                          <input type="text" id="stationNameInput" class="form-control form-control-sm" placeholder="Station name" required>
                        </div>
                        <div class="col-auto">
                          <input type="text" id="stationLocationInput" class="form-control form-control-sm" placeholder="Location">
                        </div>
                        <div class="col-auto">
                          <button type="submit" class="btn btn-sm btn-success">Add Station</button>
                        </div>
                      </form>
                      <div id="stationList">
                        <table class="table table-sm table-hover">
                          <thead><tr><th>Name</th><th>Location</th><th>Actions</th></tr></thead>
                          <tbody>`;

                if (stations.length === 0) {
                    html += `<tr><td colspan="3" class="text-muted text-center">No stations yet</td></tr>`;
                } else {
                    stations.forEach(s => {
                        html += `<tr>
                              <td><strong>${s.name}</strong></td>
                              <td>${s.location || '—'}</td>
                              <td>
                                <button class="btn btn-sm btn-outline-danger delete-station-btn" data-id="${s.id}">
                                  <i class="bi bi-trash"></i>
                                </button>
                              </td>
                            </tr>`;
                    });
                }

                html += `</tbody></table></div></div></div></div>`;

                $('#pageContent').innerHTML = html;

                $('#companyEditForm').onsubmit = async function(e) {
                    e.preventDefault();
                    const data = {
                        name: $('#compName').value.trim(),
                        tagline: $('#compTagline').value.trim(),
                        address: $('#compAddress').value.trim(),
                        phone: $('#compPhone').value.trim(),
                        email: $('#compEmail').value.trim(),
                        tax_id: $('#compTax').value.trim(),
                        website: $('#compWebsite').value.trim(),
                        logo_url: $('#compLogo').value.trim(),
                    };
                    try {
                        await updateCompany(companyId, data);
                        await logAudit('update_company', data);
                        $('#companyUpdateResult').innerHTML = '<span class="text-success">✅ Company updated successfully.</span>';
                        toast('Company profile updated', 'success');
                        renderCompanyProfile();
                    } catch (err) {
                        $('#companyUpdateResult').innerHTML = `<span class="text-danger">❌ ${err.message}</span>`;
                        toast('Error: ' + err.message, 'danger');
                    }
                };

                $('#backupDownloadBtn').onclick = async function() {
                    try {
                        await downloadCompanyBackup();
                    } catch (err) {
                        toast('Backup failed: ' + err.message, 'danger');
                    }
                };

                $('#backupUploadBtn').onclick = function() {
                    $('#backupFileInput').click();
                };

                $('#backupFileInput').onchange = async function(e) {
                    const file = this.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async function(ev) {
                        try {
                            const result = await importCompanyBackup(ev.target.result);
                            toast('Backup imported: ' + result, 'success');
                            $('#backupResult').innerHTML = '<span class="text-success">✅ ' + result + '</span>';
                            renderCompanyProfile();
                        } catch (err) {
                            toast('Import failed: ' + err.message, 'danger');
                            $('#backupResult').innerHTML = '<span class="text-danger">❌ ' + err.message + '</span>';
                        }
                        $('#backupFileInput').value = '';
                    };
                    reader.readAsText(file);
                };

                $('#stationForm').onsubmit = async function(e) {
                    e.preventDefault();
                    const name = $('#stationNameInput').value.trim();
                    const location = $('#stationLocationInput').value.trim();
                    if (!name) { toast('Station name is required', 'warning'); return; }
                    try {
                        const newStation = {
                            name: name,
                            location: location || '',
                            companyId: state.user.companyId,
                        };
                        const docRef = await db.collection('stations').add(newStation);
                        await docRef.update({ id: docRef.id });
                        await logAudit('add_station', { name, location });
                        toast('Station added');
                        renderCompanyProfile();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };

                document.querySelectorAll('.delete-station-btn').forEach(btn => {
                    btn.onclick = async function() {
                        const id = this.dataset.id;
                        if (!confirm('Delete this station? This may affect sales, shifts, and inventory.')) return;
                        try {
                            const stationId = Number(id) || id;
                            const hasSales = await db.collection('sales').where('station_id', '==', stationId).limit(1).get();
                            if (!hasSales.empty) {
                                toast('Cannot delete station with existing sales. Remove sales first or reassign.', 'warning');
                                return;
                            }
                            await deleteDoc('stations', id);
                            await logAudit('delete_station', { stationId: id });
                            toast('Station deleted');
                            renderCompanyProfile();
                        } catch (err) {
                            toast('Error: ' + err.message, 'danger');
                        }
                    };
                });

            } catch (err) {
                console.error('renderCompanyProfile', err);
                $('#pageContent').innerHTML = `<div class="alert alert-danger">Error loading company profile: ${err.message}</div>`;
            }
        }

        async function renderAllCompanies() {
            if (roleNorm(state.user.role) !== 'super_admin') {
                $('#pageContent').innerHTML = '<div class="alert alert-danger">Access denied</div>';
                return;
            }
            const companies = await getAllCompanies();
            let html = '<div class="card-box"><h5 class="mb-3">All Companies</h5><table class="table table-sm"><thead><tr><th>Name</th><th>Address</th><th>Phone</th><th>Active</th></tr></thead><tbody>';
            companies.forEach(c => {
                html += '<tr><td><strong>' + (c.name || c.id) + '</strong></td><td>' + (c.address || '—') + '</td><td>' + (c.phone || '—') + '</td><td>' + (c.active !== false ? 'Yes' : 'No') + '</td></tr>';
            });
            html += '</tbody></table></div>';
            $('#pageContent').innerHTML = html;
        }

        console.log('Part 10 loaded');
    </script>

    <!-- PART 11: MESSAGES (real-time chat) -->
    <script>
        async function renderMessages() {
            const currentUser = state.user;
            if (!currentUser) {
                $('#pageContent').innerHTML = '<div class="alert alert-danger">You must be logged in.</div>';
                return;
            }

            const users = state.allUsers.filter(u => u.id !== currentUser.id && u.active !== false);
            let recipientOptions = '<option value="all">Everyone</option>';
            users.forEach(u => {
                recipientOptions += `<option value="${u.id}">${u.name || u.username}</option>`;
            });

            let html = `
            <div class="card-box">
              <h5 class="mb-3"><i class="bi bi-chat-dots"></i> Company Chat</h5>
              <div id="chatMessages" class="chat-messages mb-3" style="max-height:400px; overflow-y:auto;">
                <div class="text-muted text-center">Loading messages...</div>
              </div>
              <form id="chatForm" class="row g-2">
                <div class="col-md-3">
                  <label class="form-label small">Send to</label>
                  <select id="chatRecipient" class="form-select form-select-sm">${recipientOptions}</select>
                </div>
                <div class="col-md-7">
                  <label class="form-label small">Message</label>
                  <input type="text" id="chatInput" class="form-control form-control-sm" placeholder="Type your message..." required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-send"></i> Send</button>
                </div>
              </form>
            </div>`;

            $('#pageContent').innerHTML = html;

            const companyId = currentUser.companyId;
            const messagesRef = db.collection('messages')
                .where('companyId', '==', companyId)
                .orderBy('timestamp', 'asc');

            let unsubscribe = null;

            function renderMessagesList(snapshot) {
                const container = document.getElementById('chatMessages');
                if (!container) return;
                if (snapshot.empty) {
                    container.innerHTML = '<div class="text-muted text-center">No messages yet. Start the conversation!</div>';
                    return;
                }
                let msgs = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const senderName = data.senderName || 'Unknown';
                    const recipient = data.recipientId;
                    let recipientLabel = '';
                    if (recipient === 'all') recipientLabel = ' (to Everyone)';
                    else if (recipient === currentUser.id) recipientLabel = ' (to you)';
                    else if (data.senderId === currentUser.id && recipient !== 'all') {
                        const rec = state.allUsers.find(u => u.id === recipient);
                        recipientLabel = ` (to ${rec ? (rec.name || rec.username) : 'Unknown'})`;
                    }
                    const isMine = data.senderId === currentUser.id;
                    const time = data.timestamp ? formatDateTime(data.timestamp) : '';
                    msgs += `
                    <div class="chat-message ${isMine ? 'sent' : ''}">
                      <div class="sender">${senderName}${recipientLabel} <span class="time">${time}</span></div>
                      <div>${data.content}</div>
                    </div>
                  `;
                });
                container.innerHTML = msgs;
                container.scrollTop = container.scrollHeight;
            }

            unsubscribe = messagesRef.onSnapshot((snapshot) => {
                renderMessagesList(snapshot);
            }, (error) => {
                console.error('Chat listener error:', error);
                toast('Error loading messages: ' + error.message, 'danger');
            });

            const chatForm = document.getElementById('chatForm');
            chatForm.onsubmit = async function(e) {
                e.preventDefault();
                const input = document.getElementById('chatInput');
                const content = input.value.trim();
                if (!content) return;
                const recipient = document.getElementById('chatRecipient').value;
                input.value = '';
                try {
                    await addDoc('messages', {
                        companyId: companyId,
                        senderId: currentUser.id,
                        senderName: currentUser.name || currentUser.username || 'User',
                        recipientId: recipient,
                        content: content,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (err) {
                    toast('Failed to send message: ' + err.message, 'danger');
                }
            };

            if (window._chatUnsubscribe) {
                window._chatUnsubscribe();
                window._chatUnsubscribe = null;
            }
            window._chatUnsubscribe = unsubscribe;
        }

        const originalRenderPage = renderPage;
        renderPage = async function(page) {
            if (page !== 'messages' && window._chatUnsubscribe) {
                window._chatUnsubscribe();
                window._chatUnsubscribe = null;
            }
            await originalRenderPage(page);
        };

        console.log('Part 11 loaded');
    </script>
    <script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('Service Worker registered'));
}
</script>
</body>
