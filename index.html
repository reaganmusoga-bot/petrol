    <script>
    // ============================================================
    // PART 2: FIREBASE CONFIG & CORE UTILITIES
    // ============================================================
    
    const firebaseConfig = {
      apiKey: "AIzaSyCWyrW4xa4i1X3D6uzEPbKfFbwEBU0UVbk",
      authDomain: "petrol-59a19.firebaseapp.com",
      projectId: "petrol-59a19",
      storageBucket: "petrol-59a19.firebasestorage.app",
      messagingSenderId: "195467455062",
      appId: "1:195467455062:web:288de1c059ca60a2e769f7"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    db.enablePersistence({ synchronizeTabs: true }).catch(err => console.warn('Persistence not enabled', err));
    
    const state = {
      user: null,
      stations: [],
      currentStationId: null,
      currentPage: 'dashboard',
      isOnline: navigator.onLine,
      companies: []
    };
    
    function $(sel) { return document.querySelector(sel); }
    function $$(sel) { return document.querySelectorAll(sel); }
    
    function toast(msg, type = 'success') {
      const colors = {
        success: 'bg-success',
        danger: 'bg-danger',
        warning: 'bg-warning text-dark',
        info: 'bg-info text-dark'
      };
      const el = document.createElement('div');
      el.className = `toast align-items-center text-white ${colors[type] || colors.info} border-0 show`;
      el.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
      $('.toast-container').appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }
    
    function formatMoney(n) {
      return 'UGX ' + (Number(n) || 0).toLocaleString();
    }
    function formatDate(d) {
      if (!d) return '—';
      const dt = d.toDate ? d.toDate() : new Date(d);
      return dt.toLocaleDateString('en-GB');
    }
    function formatDateTime(d) {
      if (!d) return '—';
      const dt = d.toDate ? d.toDate() : new Date(d);
      return dt.toLocaleString('en-GB');
    }
    
    function roleNorm(r) {
      if (!r) return 'cashier';
      const x = String(r).toLowerCase().trim();
      if (x === 'super_admin' || x === 'super admin') return 'super_admin';
      if (x === 'top_admin' || x === 'top admin') return 'top_admin';
      if (x === 'admin') return 'admin';
      if (x === 'manager') return 'manager';
      return 'cashier';
    }
    function isAdmin(r) {
      return ['super_admin', 'top_admin', 'admin', 'manager'].includes(roleNorm(r));
    }
    function canManageUsers(r) {
      return ['super_admin', 'top_admin'].includes(roleNorm(r));
    }
    function canManageCompany(r) {
      return ['super_admin', 'top_admin'].includes(roleNorm(r));
    }
    function stationName(id) {
      const s = state.stations.find(st => Number(st.id) === Number(id));
      return s ? s.name : 'Unknown';
    }
    
    function showLoading(show) {
      let ov = $('#loadingOverlay');
      if (show) {
        if (!ov) {
          ov = document.createElement('div');
          ov.id = 'loadingOverlay';
          ov.className = 'loading-overlay';
          ov.innerHTML = '<div class="spinner"></div>';
          document.body.appendChild(ov);
        }
      } else if (ov) {
        ov.remove();
      }
    }
    
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode('PetroManagerSalt_' + password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return 'pm_' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    async function createCompany(companyData) {
      const ref = await db.collection('companies').add({
        name: companyData.name,
        tagline: companyData.tagline || '',
        address: companyData.address || '',
        phone: companyData.phone || '',
        email: companyData.email || '',
        tax_id: companyData.tax_id || '',
        website: companyData.website || '',
        logo_url: companyData.logo_url || '',
        created_at: firebase.firestore.FieldValue.serverTimestamp(),
        created_by: state.user ? state.user.id : null,
        active: true
      });
      return ref.id;
    }
    
    async function getCompany(companyId) {
      const doc = await db.collection('companies').doc(companyId).get();
      return doc.exists ? { id: doc.id, ...doc.data() } : null;
    }
    
    async function updateCompany(companyId, data) {
      await db.collection('companies').doc(companyId).set({
        ...data,
        updated_at: firebase.firestore.FieldValue.serverTimestamp(),
        updated_by: state.user ? state.user.id : null
      }, { merge: true });
    }
    
    async function getAllCompanies() {
      const snap = await db.collection('companies').get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    
    function getCompanyFilter() {
      if (state.user && state.user.role === 'super_admin') {
        return null;
      }
      return state.user ? state.user.companyId : null;
    }
    
    // Override getAll to filter by company
    const originalGetAll = getAll;
    async function getAll(col, queryFn = null) {
      let ref = db.collection(col);
      const companyId = getCompanyFilter();
      if (companyId) {
        ref = ref.where('companyId', '==', companyId);
      }
      if (queryFn) ref = queryFn(ref);
      const snap = await ref.get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    
    async function getDoc(col, id) {
      const d = await db.collection(col).doc(String(id)).get();
      return d.exists ? Object.assign({ id: d.id }, d.data()) : null;
    }
    
    async function addDoc(col, data) {
      const companyId = state.user ? state.user.companyId : null;
      const ref = await db.collection(col).add({
        ...data,
        companyId: companyId,
        created_at: firebase.firestore.FieldValue.serverTimestamp(),
        created_by: state.user ? state.user.id : null
      });
      return ref.id;
    }
    
    async function updateDoc(col, id, data) {
      const ref = db.collection(col).doc(String(id));
      const doc = await ref.get();
      if (!doc.exists) throw new Error(`Document ${id} not found in ${col}`);
      await ref.update(data);
    }
    
    async function deleteDoc(col, id) {
      const ref = db.collection(col).doc(String(id));
      const doc = await ref.get();
      if (!doc.exists) throw new Error(`Document ${id} not found in ${col}`);
      await ref.delete();
    }
    
    async function adjustInventory(stationId, product, delta, costPrice = null) {
      const ref = db.collection('inventory').doc(`${stationId}_${product}`);
      return db.runTransaction(async (tx) => {
        const doc = await tx.get(ref);
        let currentQty = 0, currentCost = 0;
        if (doc.exists) {
          currentQty = doc.data().quantity || 0;
          currentCost = doc.data().cost_price || 0;
        }
        const newQty = currentQty + delta;
        if (newQty < 0) throw new Error(`Insufficient stock for ${product}. Available: ${currentQty.toFixed(2)} L`);
        const newCost = (costPrice !== null && costPrice !== undefined) ? costPrice : currentCost;
        tx.set(ref, {
          station_id: Number(stationId),
          product_type: product,
          quantity: newQty,
          cost_price: newCost,
          selling_price: doc.exists ? (doc.data().selling_price || 0) : 0,
          companyId: state.user ? state.user.companyId : null,
          last_updated: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        return newQty;
      });
    }
    
    async function logAudit(action, details) {
      try {
        await addDoc('audit_logs', {
          user_id: state.user ? state.user.id : 'system',
          username: state.user ? state.user.username : 'system',
          action: action,
          details: details,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) { console.warn('Audit log failed', e); }
    }
    
    function exportCSV(headers, rows, filename = 'report.csv') {
      let csv = headers.join(',') + '\n';
      rows.forEach(row => {
        csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }
    
    function exportPDF(headers, rows, filename = 'report.pdf') {
      if (!rows || rows.length === 0) {
        toast('No data to export', 'warning');
        return;
      }
      const pdfWindow = window.open('', '_blank', 'width=800,height=600');
      if (!pdfWindow) {
        toast('Please allow popups for this site', 'warning');
        return;
      }
      const now = new Date();
      const dateStr = now.toLocaleString('en-GB');
      let tableHtml = '<table border="1" cellpadding="8" cellspacing="0" style="width:100%;border-collapse:collapse;font-size:12px;">';
      tableHtml += '<thead><tr style="background:#0b1a33;color:#fff;">';
      headers.forEach(h => tableHtml += '<th style="padding:8px;text-align:left;">' + h + '</th>');
      tableHtml += '</tr></thead><tbody>';
      rows.forEach(row => {
        tableHtml += '<tr>';
        row.forEach(cell => tableHtml += '<td style="padding:6px;border-bottom:1px solid #ddd;">' + cell + '</td>');
        tableHtml += '</tr>';
      });
      tableHtml += '</tbody></table>';
      pdfWindow.document.write(`
        <html>
        <head><title>${filename}</title>

    async function checkLowStock() {
      const threshold = 100;
      const inv = await getAll('inventory');
      const lowItems = inv.filter(i => {
        if (state.currentStationId && Number(i.station_id) !== state.currentStationId) return false;
        return (i.quantity || 0) < threshold;
      });
      if (lowItems.length > 0) {
        const message = lowItems.map(i => 
          `${i.product_type} at ${stationName(i.station_id)}: ${(i.quantity || 0).toFixed(2)}L`
        ).join(' | ');
        toast('⚠️ LOW STOCK: ' + message, 'warning');
      }
      return lowItems;
    }
    
    async function sendDailyReportEmail() {
      const sales = await getAll('sales');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      const todaySales = sales.filter(s => {
        const d = s.created_at ? (s.created_at.toDate ? s.created_at.toDate() : new Date(s.created_at)) : new Date();
        return d >= today && d < tomorrow;
      });
      let totalQty = 0, totalRevenue = 0;
      const byProduct = {};
      todaySales.forEach(s => {
        const qty = Number(s.quantity) || 0;
        const amt = Number(s.amount) || 0;
        totalQty += qty;
        totalRevenue += amt;
        const p = s.product_type || 'Unknown';
        if (!byProduct[p]) byProduct[p] = { qty: 0, revenue: 0 };
        byProduct[p].qty += qty;
        byProduct[p].revenue += amt;
      });
      let emailBody = `📊 DAILY SALES REPORT\n`;
      emailBody += `📅 ${today.toLocaleDateString('en-GB')}\n`;
      emailBody += `━━━━━━━━━━━━━━━━━━━━━\n\n`;
      emailBody += `💰 Total Revenue: ${formatMoney(totalRevenue)}\n`;
      emailBody += `⛽ Total Quantity: ${totalQty.toFixed(2)}L\n`;
      emailBody += `📋 Transactions: ${todaySales.length}\n\n`;
      emailBody += `📦 By Product:\n`;
      Object.keys(byProduct).forEach(p => {
        const d = byProduct[p];
        emailBody += `  • ${p}: ${d.qty.toFixed(2)}L – ${formatMoney(d.revenue)}\n`;
      });
      emailBody += `\n━━━━━━━━━━━━━━━━━━━━━\n`;
      emailBody += `Generated by PetroManager Pro\n`;
      try {
        await navigator.clipboard.writeText(emailBody);
        toast('📋 Daily report copied to clipboard!', 'success');
      } catch (err) {
        alert(emailBody);
      }
    }

    <script>
    // ============================================================

    async function loadCompaniesForLogin() {
      const select = $('#loginCompany');
      select.innerHTML = '<option value="">— Select Company —</option>';
      try {
        const companies = await getAllCompanies();
        companies.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.name;
          select.appendChild(opt);
        });
        if (companies.length === 0) {
          select.innerHTML = '<option value="">No companies yet – create first company</option>';
        }
      } catch (e) {
        console.error(e);
        select.innerHTML = '<option value="">Error loading companies</option>';
      }
    }
    
    async function loadUsersForLogin(companyId = null) {
      const select = $('#loginUsername');
      select.innerHTML = '<option value="">— Select User —</option>';
      if (!companyId) {
        select.innerHTML = '<option value="">Select a company first</option>';
        return;
      }
      try {
        const snap = await db.collection('users')
          .where('companyId', '==', companyId)
          .get();
        const users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        users.sort((a, b) => (a.name || a.username || '').localeCompare(b.name || b.username || ''));
        users.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = (u.name || u.username) + ' (' + u.role + ')';
          select.appendChild(opt);
        });
        if (users.length === 0) {
          select.innerHTML = '<option value="">No users yet</option>';
        }
      } catch (e) {
        console.error(e);
        select.innerHTML = '<option value="">Error loading users</option>';
      }
    }
    
    $('#loginCompany').addEventListener('change', function() {
      loadUsersForLogin(this.value);
    });
    
    $('#showCreateCompanyBtn').addEventListener('click', function() {
      $('#normalLogin').style.display = 'none';
      $('#createCompanyForm').style.display = 'block';
    });
    
    $('#cancelCreateCompanyBtn').addEventListener('click', function() {
      $('#createCompanyForm').style.display = 'none';
      $('#normalLogin').style.display = 'block';
      $('#createCompanyResult').textContent = '';
    });
    
    $('#createCompanyBtn').addEventListener('click', async function() {
      const name = $('#newCompName').value.trim();
      const tagline = $('#newCompTagline').value.trim();
      const address = $('#newCompAddress').value.trim();
      const adminUser = $('#newCompAdminUser').value.trim().toLowerCase();
      const adminPass = $('#newCompAdminPass').value;
      const resultEl = $('#createCompanyResult');
      resultEl.innerHTML = '';
      if (!name) { resultEl.innerHTML = '<span class="text-danger">Company name is required</span>'; return; }
      if (!adminUser) { resultEl.innerHTML = '<span class="text-danger">Admin username is required</span>'; return; }
      if (!adminPass || adminPass.length < 4) { resultEl.innerHTML = '<span class="text-danger">Password must be at least 4 characters</span>'; return; }
      try {
        const companyId = await createCompany({ name, tagline, address, phone: '', email: '', tax_id: '', website: '', logo_url: '' });
        const hashed = await hashPassword(adminPass);
        await db.collection('users').add({
          username: adminUser,
          name: 'System Admin',
          password: hashed,
          role: 'top_admin',
          companyId: companyId,
          station_id: null,
          active: true
        });
        resultEl.innerHTML = `<span class="text-success">✅ Company "${name}" created!<br>Admin user: <strong>${adminUser}</strong><br>You can now log in.</span>`;
        setTimeout(() => {
          $('#createCompanyForm').style.display = 'none';
          $('#normalLogin').style.display = 'block';
          loadCompaniesForLogin();
          $('#loginCompany').value = companyId;
          loadUsersForLogin(companyId);
        }, 1500);
      } catch (err) {
        resultEl.innerHTML = `<span class="text-danger">❌ Error: ${err.message}</span>`;
      }
    });
    
    $('#loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const companyId = $('#loginCompany').value;
      const userId = $('#loginUsername').value;
      const password = $('#loginPassword').value;
      const errorEl = $('#loginError');
      errorEl.style.display = 'none';
      if (!companyId) {
        errorEl.textContent = 'Please select a company';
        errorEl.style.display = 'block';
        return;
      }
      if (!userId) {
        errorEl.textContent = 'Please select a user';
        errorEl.style.display = 'block';
        return;
      }
      if (!password) {
        errorEl.textContent = 'Password is required';
        errorEl.style.display = 'block';
        return;
      }
      try {
        $('#loginBtn').disabled = true;
        $('#loginBtn').textContent = 'Signing in...';
        const userDoc = await getDoc('users', userId);
        if (!userDoc) {
          errorEl.textContent = 'User not found';
          errorEl.style.display = 'block';
          return;
        }
        if (userDoc.companyId !== companyId) {
          errorEl.textContent = 'User does not belong to this company';
          errorEl.style.display = 'block';
          return;
        }
        if (userDoc.active === false) {
          errorEl.textContent = 'This account is disabled';
          errorEl.style.display = 'block';
          return;
        }
        const hashedInput = await hashPassword(password);
        if (userDoc.password !== hashedInput) {
          errorEl.textContent = 'Incorrect password';
          errorEl.style.display = 'block';
          return;
        }
        state.user = { ...userDoc, id: userDoc.id, companyId: companyId };
        localStorage.setItem('petro_user', JSON.stringify({
          id: userDoc.id,
          username: userDoc.username,
          name: userDoc.name,
          role: userDoc.role,
          station_id: userDoc.station_id,
          companyId: companyId
        }));
        await loadStations();
        initApp();
        toast('Welcome, ' + (userDoc.name || userDoc.username) + '!');
        await logAudit('login', { username: userDoc.username, companyId: companyId });
        $('#loginBtn').disabled = false;
        $('#loginBtn').textContent = 'Sign In';
      } catch (err) {
        console.error(err);
        errorEl.textContent = err.message || 'Login failed';
        errorEl.style.display = 'block';
        $('#loginBtn').disabled = false;
        $('#loginBtn').textContent = 'Sign In';
      }
    });
    
    $('#headerLogout').addEventListener('click', async function() {
      if (state.user) await logAudit('logout', { username: state.user.username });
      state.user = null;
      localStorage.removeItem('petro_user');
      $('#loginScreen').style.display = 'flex';
      $('#appMain').style.display = 'none';
      $('#loginPassword').value = '';
      loadCompaniesForLogin();
      toast('Signed out', 'info');
    });
    
    $('#headerSwitchUser').addEventListener('click', function() {
      if (state.user) logAudit('switch_user', { username: state.user.username });
      state.user = null;
      localStorage.removeItem('petro_user');
      $('#loginScreen').style.display = 'flex';
      $('#appMain').style.display = 'none';
      $('#loginPassword').value = '';
      loadCompaniesForLogin();
      toast('Please sign in again', 'info');
    });
    
    async function checkSession() {
      const saved = localStorage.getItem('petro_user');
      if (!saved) {
        loadCompaniesForLogin();
        return;
      }
      try {
        const data = JSON.parse(saved);
        const userDoc = await getDoc('users', data.id);
        if (userDoc && userDoc.active !== false && userDoc.companyId === data.companyId) {
          state.user = { ...userDoc, id: userDoc.id, companyId: data.companyId };
          await loadStations();
          initApp();
        } else {
          localStorage.removeItem('petro_user');
          loadCompaniesForLogin();
        }
      } catch (e) {
        localStorage.removeItem('petro_user');
        loadCompaniesForLogin();
      }
    }
    
    async function seedData() {
      const existing = await db.collection('stations').get();
      if (existing.size > 0) return;
      const companyId = state.user ? state.user.companyId : null;
      if (!companyId) {
        toast('No company selected', 'warning');
        return;
      }
      const stations = [
        { id: 1, name: 'Lwaba', location: 'Lwaba', companyId: companyId },
        { id: 2, name: 'Bugiri Town', location: 'Bugiri', companyId: companyId },
        { id: 3, name: 'Mayuge', location: 'Mayuge', companyId: companyId },
        { id: 4, name: 'Nango', location: 'Nango', companyId: companyId }
      ];
      for (let s of stations) {
        await db.collection('stations').doc(String(s.id)).set(s);
      }
      const products = [
        { type: 'Petrol', cost: 3800, sell: 4200, base: 5000 },
        { type: 'Diesel', cost: 3600, sell: 4000, base: 3000 },
        { type: 'Gas', cost: 2000, sell: 2500, base: 1000 }
      ];
      for (let s of stations) {
        for (let p of products) {
          await db.collection('inventory').doc(s.id + '_' + p.type).set({
            station_id: s.id,
            product_type: p.type,
            quantity: p.base + s.id * 200,
            cost_price: p.cost,
            selling_price: p.sell,
            companyId: companyId,
            last_updated: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }
      toast('Seed completed successfully', 'success');
    }
    
    async function loadStations() {
      const companyId = state.user ? state.user.companyId : null;
      let stations = [];
      if (companyId) {
        const snap = await db.collection('stations')
          .where('companyId', '==', companyId)
          .get();
        stations = snap.docs.map(d => ({ id: Number(d.id), ...d.data() }));
      } else {
        const snap = await db.collection('stations').get();
        stations = snap.docs.map(d => ({ id: Number(d.id), ...d.data() }));
      }
      if (stations.length === 0 && state.user && state.user.role === 'top_admin') {
        await seedData();
        const snap = await db.collection('stations')
          .where('companyId', '==', companyId)
          .get();
        stations = snap.docs.map(d => ({ id: Number(d.id), ...d.data() }));
      }
      state.stations = stations;
      updateStationDropdown();
    }
    
    function updateStationDropdown() {
      const sel = $('#stationSelector');
      sel.innerHTML = '<option value="">All Stations</option>';
      state.stations.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name + ' (' + s.location + ')';
        sel.appendChild(opt);
      });
      if (state.currentStationId) sel.value = state.currentStationId;
    }
    
    console.log('Part 3 loaded');

    <script>

      $('#sidebarRole').textContent = state.user.role;

    function buildSidebar() {
      const role = roleNorm(state.user.role);
      let links = [];

        links = [
          { page: 'dashboard', icon: 'bi-grid-1x2-fill', label: 'Dashboard' },

          { page: 'shifts', icon: 'bi-clock-history', label: 'Shifts' },

        ];

    function navigate(page) {
      state.currentPage = page;
      document.querySelectorAll('.sidebar .nav-link').forEach(el => el.classList.remove('active'));
      const active = document.querySelector(`.sidebar .nav-link[data-page="${page}"]`);
      if (active) active.classList.add('active');
      const titles = {
        dashboard: 'Dashboard', sales: 'Sales', shifts: 'Shifts', meters: 'Meter Readings',
        balancing: 'Cashier Balancing', inventory: 'Inventory', stock: 'Stock Receiving',
        adjustments: 'Adjustments', financials: 'Financials', reports: 'Reports',
        users: 'Users', company: 'Company', activity: 'Activity Log',
        receipts: 'Receipts', customers: 'Customers', mysummary: 'My Summary'
      };
      $('#pageTitle').textContent = titles[page] || page;
      renderPage(page);

    async function renderPage(page) {
      const role = roleNorm(state.user.role);
      if (role === 'cashier' && !['dashboard', 'shifts', 'meters', 'mysummary'].includes(page)) {
        toast('Access denied', 'warning');
        return navigate('dashboard');
      }
      if (page === 'users' && !canManageUsers(role)) {
        toast('Only Top Admin can manage users', 'warning');
        return navigate('dashboard');
      }
      if (page === 'activity' && !canManageUsers(role)) {
        toast('Only Top Admin can view logs', 'warning');
        return navigate('dashboard');
      }
      if (page === 'company' && !canManageCompany(role)) {
        toast('Only Admins can manage company', 'warning');
        return navigate('dashboard');
      }
      showLoading(true);
      try {
        if (page === 'dashboard') await renderDashboard();
        else if (page === 'sales') await renderSales();
        else if (page === 'shifts') await renderShifts();
        else if (page === 'meters') await renderMeters();
        else if (page === 'mysummary') await renderShiftSummary();
        else if (page === 'balancing') await renderBalancing();
        else if (page === 'inventory') await renderInventory();
        else if (page === 'stock') await renderStock();
        else if (page === 'adjustments') await renderAdjustments();
        else if (page === 'financials') await renderFinancials();
        else if (page === 'reports') await renderReports();
        else if (page === 'users') await renderUsers();

      $('#completeSaleBtn').onclick = async function() {
        if (cart.length === 0) {
          toast('Cart is empty', 'warning');
          return;
        }
    
        const stationId = cart[0].stationId;
        const payment = $('#salePayment').value;
        const customer = $('#saleCustomer').value.trim() || 'Walk-in';
        const saleDate = $('#saleDate').value;
    
        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-hourglass"></i> Processing...';
    
        try {
          await db.runTransaction(async (transaction) => {
            const inventoryRefs = cart.map(item => 
              db.collection('inventory').doc(`${item.stationId}_${item.product}`)
            );
    
            const inventoryDocs = await Promise.all(
              inventoryRefs.map(ref => transaction.get(ref))
            );
    
            const updates = [];
            cart.forEach((item, idx) => {
              const doc = inventoryDocs[idx];
              if (!doc.exists) {
                throw new Error(`No inventory found for ${item.product}`);
              }
              const currentQty = doc.data().quantity || 0;
              if (currentQty < item.qty) {
                throw new Error(`Insufficient ${item.product}. Available: ${currentQty.toFixed(2)}L`);
              }
              const newQty = currentQty - item.qty;
              updates.push({ ref: doc.ref, newQty, cost: doc.data().cost_price || 0, sell: item.price });
            });
    
            updates.forEach(({ ref, newQty }) => {
              transaction.update(ref, {
                quantity: newQty,
                last_updated: firebase.firestore.FieldValue.serverTimestamp()
              });
            });
    
            const transactionId = 'TXN_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            const dateObj = saleDate ? new Date(saleDate) : new Date();
            
            cart.forEach((item, idx) => {
              const saleRef = db.collection('sales').doc();
              const amount = item.qty * item.price;
              transaction.set(saleRef, {
                station_id: item.stationId,
                product_type: item.product,
                quantity: item.qty,
                selling_price: item.price,
                cost_price: updates[idx].cost,
                amount: amount,
                payment_method: payment,
                customer_name: customer,
                transaction_id: transactionId,
                recorded_by: state.user.id,
                companyId: state.user.companyId,
                sale_date: dateObj,
                created_at: firebase.firestore.FieldValue.serverTimestamp()
              });
            });
          });
    
          await logAudit('cart_sale', { station: stationId, items: cart.length });
          toast(`✅ Sale complete! ${cart.length} item(s) sold.`, 'success');
          
          const receiptData = {
            transactionId: 'TXN_' + Date.now(),
            items: cart.map(item => ({ product: item.product, qty: item.qty, price: item.price })),
            total: cart.reduce((sum, i) => sum + i.qty * i.price, 0),
            payment: payment,
            customer: customer,
            station: stationName(stationId),
            date: saleDate ? new Date(saleDate) : new Date()
          };
          printReceipt(receiptData);
          
          cart = [];
          renderCart();
          renderSales();
    
        } catch (err) {
          console.error(err);
          toast('❌ Sale failed: ' + err.message, 'danger');
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-check-circle"></i> Complete Sale';
        }

          const currentPrice = parseFloat(this.dataset.price);
          const product = this.dataset.product;
          const stationId = Number(this.dataset.station);
          const currentDate = this.dataset.date;
    
          const newQty = prompt('Enter new quantity:', currentQty);
          if (newQty === null) return;
          const newPrice = prompt('Enter new selling price:', currentPrice);
          if (newPrice === null) return;
          const newDate = prompt('Enter new date (YYYY-MM-DD):', currentDate);
          if (newDate === null) return;

          const priceVal = parseFloat(newPrice);
          const amount = qtyVal * priceVal;
    
          if (isNaN(qtyVal) || qtyVal <= 0 || isNaN(priceVal) || priceVal <= 0) {
            toast('Invalid values', 'danger');
            return;
          }
    
          const diff = currentQty - qtyVal;
          
          updateDoc('sales', id, {
            quantity: qtyVal,
            selling_price: priceVal,
            amount: amount,
            sale_date: new Date(newDate)
          }).then(async () => {

      let html = `

                </div>
              </div>

            <table class="table table-sm table-hover">
              <thead><tr><th>Product</th><th>Qty (L)</th><th>Revenue</th><th>% of Total</th></tr></thead>

        html += '<tr><td colspan="4" class="text-center text-muted">No sales today</td></tr>';

      let html = `

        <h5 class="mb-3"><i class="bi bi-balance-scale"></i> Cashier Reconciliation</h5>
        <p class="text-muted small">Select a closed shift to reconcile. Expected amount is calculated from meter readings × selling prices.</p>
        
        <div class="table-responsive" style="max-height:600px; overflow-y:auto;">
          <table class="table table-sm table-hover table-bordered">
            <thead class="table-dark">
              <tr>
                <th>Station</th>
                <th>Cashier</th>
                <th>Shift</th>
                <th>Date</th>
                <th>Petrol</th>
                <th>Diesel</th>
                <th>Gas</th>
                <th>Expected</th>
                <th>Cash</th>
                <th>Mobile</th>
                <th>Credit</th>
                <th>Total</th>
                <th>Difference</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>`;
    
      if (shifts.length === 0) {
        html += `<tr><td colspan="15" class="text-center text-muted py-4">No closed shifts available for reconciliation</td></tr>`;
      } else {
        for (let s of shifts) {
          const cashier = users.find(u => u.id === s.cashier_id);
          const cashierName = cashier ? (cashier.name || cashier.username) : 'Unknown';
          
          const petrolSold = Math.max(0, (s.end_petrol || 0) - (s.start_petrol || 0));
          const dieselSold = Math.max(0, (s.end_diesel || 0) - (s.start_diesel || 0));
          const gasSold = Math.max(0, (s.end_gas || 0) - (s.start_gas || 0));
    
          const pPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Petrol') || {}).selling_price || 0;
          const dPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Diesel') || {}).selling_price || 0;
          const gPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Gas') || {}).selling_price || 0;
    
          const expectedAmount = (petrolSold * pPrice) + (dieselSold * dPrice) + (gasSold * gPrice);
          const recon = recons.find(r => r.shift_id === s.id);
          const done = !!recon;
          
          const cash = recon ? (recon.cash_actual || 0) : 0;
          const mobile = recon ? (recon.mobile_actual || 0) : 0;
          const credit = recon ? (recon.credit_actual || 0) : 0;
          const totalActual = cash + mobile + credit;
          const difference = totalActual - expectedAmount;
          const diffClass = Math.abs(difference) < 1 ? 'text-success' : (difference > 0 ? 'text-warning' : 'text-danger');
    
          html += `<tr class="${done ? 'table-success' : ''}" id="recon_row_${s.id}">
            <td><strong>${stationName(s.station_id)}</strong></td>
            <td>${cashierName}</td>
            <td><span class="${s.shift_type === 'day' ? 'badge-day' : 'badge-night'}">${s.shift_type}</span></td>
            <td class="fs-xs">${formatDate(s.created_at)}</td>
            <td>
              <div><small>Sold: <strong>${petrolSold.toFixed(2)}L</strong></small></div>
              <div><small>@ ${formatMoney(pPrice)}</small></div>
              <div><small>= ${formatMoney(petrolSold * pPrice)}</small></div>
            </td>
            <td>
              <div><small>Sold: <strong>${dieselSold.toFixed(2)}L</strong></small></div>
              <div><small>@ ${formatMoney(dPrice)}</small></div>
              <div><small>= ${formatMoney(dieselSold * dPrice)}</small></div>
            </td>
            <td>
              <div><small>Sold: <strong>${gasSold.toFixed(2)}L</strong></small></div>
              <div><small>@ ${formatMoney(gPrice)}</small></div>
              <div><small>= ${formatMoney(gasSold * gPrice)}</small></div>
            </td>
            <td><strong>${formatMoney(expectedAmount)}</strong></td>`;
    
          if (done) {
            html += `
              <td>${formatMoney(cash)}</td>
              <td>${formatMoney(mobile)}</td>
              <td>${formatMoney(credit)}</td>
              <td><strong>${formatMoney(totalActual)}</strong></td>
              <td class="${diffClass}"><strong>${formatMoney(difference)}</strong></td>
              <td><span class="badge bg-success">✅ Done</span></td>
              <td>—</td>`;
          } else {
            html += `
              <td><input type="number" class="form-control form-control-sm rec-cash" style="width:90px" step="100" placeholder="0"></td>
              <td><input type="number" class="form-control form-control-sm rec-mobile" style="width:90px" step="100" placeholder="0"></td>
              <td><input type="number" class="form-control form-control-sm rec-credit" style="width:90px" step="100" placeholder="0"></td>
              <td><span id="total_${s.id}">0</span></td>
              <td><span id="diff_${s.id}" class="text-muted">0</span></td>
              <td><span class="badge bg-warning text-dark">⏳ Pending</span></td>
              <td>
                <button class="btn btn-sm btn-success recon-btn" data-id="${s.id}" data-expected="${expectedAmount}">
                  <i class="bi bi-check-circle"></i> Save
                </button>
              </td>`;
          }
    
          html += `</tr>`;
          
          // Live calculation for pending rows
          if (!done) {
            html += `
            <script>
              (function() {
                const row = document.getElementById('recon_row_${s.id}');
                const cashInput = row.querySelector('.rec-cash');
                const mobileInput = row.querySelector('.rec-mobile');
                const creditInput = row.querySelector('.rec-credit');
                const totalSpan = document.getElementById('total_${s.id}');
                const diffSpan = document.getElementById('diff_${s.id}');
                const expected = ${expectedAmount};
                
                function updateTotals() {
                  const cash = parseFloat(cashInput.value) || 0;
                  const mobile = parseFloat(mobileInput.value) || 0;
                  const credit = parseFloat(creditInput.value) || 0;
                  const total = cash + mobile + credit;
                  const diff = total - expected;
                  totalSpan.textContent = formatMoney(total);
                  diffSpan.textContent = formatMoney(diff);
                  diffSpan.className = Math.abs(diff) < 1 ? 'text-success' : (diff > 0 ? 'text-warning' : 'text-danger');
                }
                
                cashInput.oninput = updateTotals;
                mobileInput.oninput = updateTotals;
                creditInput.oninput = updateTotals;
              })();
            <\/script>`;
          }
        }
      }
    
      html += `</tbody></table></div></div>`;
      $('#pageContent').innerHTML = html;
    
      document.querySelectorAll('.recon-btn').forEach(btn => {
        btn.onclick = async function() {
          const shiftId = this.dataset.id;
          const expected = parseFloat(this.dataset.expected);

          toast('All logs cleared', 'success');
          renderActivityLog();
        } catch (err) {
          toast('Error: ' + err.message, 'danger');
        }
      };
    }

    async function renderReceiptHistory() {
      const sales = (await getAll('sales'))
        .filter(s => !state.currentStationId || Number(s.station_id) === state.currentStationId)
        .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
    
      let html = `
      <div class="card-box">
        <h5 class="mb-3"><i class="bi bi-receipt"></i> Receipt History</h5>
        <div class="mb-3">
          <input type="text" id="receiptSearch" class="form-control form-control-sm" placeholder="🔍 Search by transaction ID, customer, or product...">
        </div>
        <div class="table-responsive" style="max-height:500px; overflow-y:auto;">
          <table class="table table-sm table-hover">
            <thead><tr><th>Receipt #</th><th>Station</th><th>Items</th><th>Total</th><th>Payment</th><th>Customer</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody>`;
    
      const grouped = {};
      sales.forEach(s => {
        const tid = s.transaction_id || s.id;
        if (!grouped[tid]) {
          grouped[tid] = {
            transactionId: tid,
            station: s.station_id,
            items: [],
            total: 0,
            payment: s.payment_method || 'cash',
            customer: s.customer_name || 'Walk-in',
            date: s.created_at,
            recorded_by: s.recorded_by
          };
        }
        grouped[tid].items.push({
          product: s.product_type,
          qty: s.quantity,
          price: s.selling_price,
          amount: s.amount
        });
        grouped[tid].total += Number(s.amount) || 0;
      });
    
      const groupedArray = Object.values(grouped);
      
      if (groupedArray.length === 0) {
        html += '<tr><td colspan="8" class="text-center text-muted">No receipts found</td></tr>';
      } else {
        groupedArray.slice(0, 50).forEach(g => {
          const itemsList = g.items.map(i => i.product + ' ' + i.qty + 'L').join(', ');
          html += `<tr>
            <td><strong>#${g.transactionId.slice(0, 8)}</strong></td>
            <td>${stationName(g.station)}</td>
            <td class="fs-xs">${itemsList}</td>
            <td><strong>${formatMoney(g.total)}</strong></td>
            <td><span class="badge bg-secondary">${g.payment}</span></td>
            <td>${g.customer}</td>
            <td class="fs-xs">${formatDate(g.date)}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary reprint-btn" data-data='${JSON.stringify(g)}'>
                <i class="bi bi-printer"></i>
              </button>
            </td>
          </tr>`;
        });
      }
    
      html += `</tbody></table></div></div>`;
      $('#pageContent').innerHTML = html;
    
      $('#receiptSearch').oninput = function() {
        const query = this.value.toLowerCase();
        const rows = document.querySelectorAll('#pageContent tbody tr');
        rows.forEach(row => {
          const text = row.textContent.toLowerCase();
          row.style.display = text.includes(query) ? '' : 'none';
        });
      };
    
      document.querySelectorAll('.reprint-btn').forEach(btn => {
        btn.onclick = function() {
          const data = JSON.parse(this.dataset.data);
          printReceipt({
            transactionId: data.transactionId,
            items: data.items,
            total: data.total,
            payment: data.payment,
            customer: data.customer,
            station: stationName(data.station),
            date: formatDate(data.date)
          });
        };
      });
    }

        return arr.filter(x => {
          if (f.stationId && Number(x.station_id) !== f.stationId) return false;
          if (f.product && x.product_type && x.product_type !== f.product) return false;
          if (x.created_at && !dateInRange(x.created_at, f.from, f.to)) return false;
          if (x.received_date && !dateInRange(x.received_date, f.from, f.to)) return false;
          return true;
        });
      }
    
      function regenerateTable(headers, rows) {
        let tableHtml = '<div class="table-responsive"><table class="table table-sm table-hover table-report">';
        tableHtml += '<thead><tr>';
        headers.forEach(h => tableHtml += '<th>' + h + '</th>');
        tableHtml += '</tr></thead><tbody>';
        if (rows.length === 0) {
          tableHtml += '<tr><td colspan="' + headers.length + '" class="text-center text-muted">No results found</td></tr>';
        } else {
          rows.forEach(row => {
            tableHtml += '<tr>';
            row.forEach(cell => tableHtml += '<td>' + cell + '</td>');
            tableHtml += '</tr>';
          });
        }
        tableHtml += '</tbody></table></div>';
        return tableHtml;
      }
    
      function genSales(f) {
        const data = filterByCommon(sales, f).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
        let totalQty = 0, totalAmt = 0;
        const headers = ['Station', 'Product', 'Qty (L)', 'Unit Price', 'Amount', 'Payment', 'Date'];
        const rows = [];
    
        data.forEach(s => {
          const qty = Number(s.quantity) || 0;
          const amt = Number(s.amount) || 0;
          totalQty += qty;
          totalAmt += amt;
          rows.push([stationName(s.station_id), s.product_type || '—', qty.toFixed(2), formatMoney(s.selling_price || 0), formatMoney(amt), s.payment_method || 'cash', formatDate(s.created_at)]);
        });
    
        let body = '<div class="d-flex justify-content-between align-items-center mb-3">' +
          '<h5 class="mb-0">Sales Summary <span class="badge bg-primary">' + data.length + '</span></h5>' +
          '<div class="text-end"><div class="fw-bold">' + formatMoney(totalAmt) + '</div><small class="text-muted">' + totalQty.toFixed(2) + ' L total</small></div></div>';
    
        body += regenerateTable(headers, rows);
    
        if (data.length > 0) {
          body += '<div class="mt-3"><strong>Grand Total:</strong> ' + formatMoney(totalAmt) + ' | <strong>Total Qty:</strong> ' + totalQty.toFixed(2) + ' L</div>';
        }
    
        return { html: body, headers: headers, rows: rows, filename: 'sales_report' };
      }
    
      function genProfit(f) {
        const data = filterByCommon(sales, f);
        let totalRev = 0, totalCost = 0, totalQty = 0;
        const byProduct = {};
    
        data.forEach(s => {
          const qty = Number(s.quantity) || 0;
          const rev = Number(s.amount) || 0;
          const cost = (Number(s.cost_price) || 0) * qty;
          totalRev += rev;
          totalCost += cost;
          totalQty += qty;
          const key = s.product_type || 'Unknown';
          if (!byProduct[key]) byProduct[key] = { qty: 0, rev: 0, cost: 0 };
          byProduct[key].qty += qty;
          byProduct[key].rev += rev;
          byProduct[key].cost += cost;
        });
    
        const profit = totalRev - totalCost;
        const margin = totalRev > 0 ? (profit / totalRev * 100) : 0;
    
        const headers = ['Product', 'Qty (L)', 'Revenue', 'Cost', 'Profit', 'Margin %'];
        const rows = [];
    
        Object.keys(byProduct).sort().forEach(p => {
          const d = byProduct[p];
          const pr = d.rev - d.cost;
          const m = d.rev > 0 ? (pr / d.rev * 100) : 0;
          rows.push([p, d.qty.toFixed(2), formatMoney(d.rev), formatMoney(d.cost), formatMoney(pr), m.toFixed(1) + '%']);
        });
    
        let body = '<div class="row g-3 mb-4">' +
          '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#198754"><i class="bi bi-cash-stack"></i></div>' +
          '<div><div class="num">' + formatMoney(totalRev) + '</div><div class="lbl">Revenue</div></div></div></div>' +
          '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#dc3545"><i class="bi bi-cart"></i></div>' +
          '<div><div class="num">' + formatMoney(totalCost) + '</div><div class="lbl">COGS</div></div></div></div>' +
          '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#0d6efd"><i class="bi bi-graph-up-arrow"></i></div>' +
          '<div><div class="num ' + (profit >= 0 ? 'profit-positive' : 'profit-negative') + '">' + formatMoney(profit) + '</div><div class="lbl">Gross Profit</div></div></div></div>' +
          '<div class="col-md-3"><div class="stat-item"><div class="icon" style="background:#ffc107"><i class="bi bi-percent"></i></div>' +
          '<div><div class="num">' + margin.toFixed(1) + '%</div><div class="lbl">Margin</div></div></div></div></div>';
    
        body += regenerateTable(headers, rows);
        return { html: body, headers: headers, rows: rows, filename: 'profit_report' };
      }
    
      function genInventory(f) {
        const data = inv.filter(i => {
          if (f.stationId && Number(i.station_id) !== f.stationId) return false;
          if (f.product && i.product_type !== f.product) return false;
          return true;
        });
    
        let totalLitres = 0, totalValue = 0;
        const headers = ['Station', 'Product', 'Quantity (L)', 'Cost/L', 'Sell/L', 'Stock Value', 'Potential Revenue'];
        const rows = [];
    
        data.forEach(i => {
          const qty = Number(i.quantity) || 0;
          const cost = Number(i.cost_price) || 0;
          const sell = Number(i.selling_price) || 0;
          totalLitres += qty;
          totalValue += qty * cost;
          rows.push([stationName(i.station_id), i.product_type, qty.toFixed(2), formatMoney(cost), formatMoney(sell), formatMoney(qty * cost), formatMoney(qty * sell)]);
        });
    
        let body = '<div class="d-flex justify-content-between mb-3">' +
          '<h5 class="mb-0">Inventory Snapshot <span class="badge bg-secondary">' + data.length + '</span></h5>' +
          '<div class="text-end"><div class="fw-bold">' + totalLitres.toFixed(2) + ' L</div><small class="text-muted">' + formatMoney(totalValue) + ' total value</small></div></div>';
    
        body += regenerateTable(headers, rows);
        return { html: body, headers: headers, rows: rows, filename: 'inventory_report' };
      }
    
      function genShifts(f) {
        const data = shifts.filter(s => {
          if (f.stationId && Number(s.station_id) !== f.stationId) return false;
          if (s.created_at && !dateInRange(s.created_at, f.from, f.to)) return false;
          return true;
        }).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
    
        const headers = ['Station', 'Cashier', 'Type', 'Status', 'Start P/D/G', 'End P/D/G', 'Sold P/D/G', 'Date'];
        const rows = [];
    
        data.forEach(s => {
          const cashier = users.find(u => u.id === s.cashier_id);
          const name = cashier ? (cashier.name || cashier.username) : '—';
          const start = (s.start_petrol || 0) + '/' + (s.start_diesel || 0) + '/' + (s.start_gas || 0);
          const end = s.status === 'closed' ? ((s.end_petrol || 0) + '/' + (s.end_diesel || 0) + '/' + (s.end_gas || 0)) : '—';
          const soldP = s.status === 'closed' ? Math.max(0, (s.end_petrol || 0) - (s.start_petrol || 0)).toFixed(1) : '—';
          const soldD = s.status === 'closed' ? Math.max(0, (s.end_diesel || 0) - (s.start_diesel || 0)).toFixed(1) : '—';
          const soldG = s.status === 'closed' ? Math.max(0, (s.end_gas || 0) - (s.start_gas || 0)).toFixed(1) : '—';
          rows.push([stationName(s.station_id), name, s.shift_type, s.status, start, end, soldP + '/' + soldD + '/' + soldG, formatDate(s.created_at)]);
        });
    
        let body = '<div class="d-flex justify-content-between mb-3">' +
          '<h5 class="mb-0">Shift Performance <span class="badge bg-secondary">' + data.length + '</span></h5></div>';
        body += regenerateTable(headers, rows);
        return { html: body, headers: headers, rows: rows, filename: 'shifts_report' };
      }
    
      function genReconciliation(f) {
        let closed = shifts.filter(s => s.status === 'closed');
        if (f.stationId) closed = closed.filter(s => Number(s.station_id) === f.stationId);
        closed = closed.filter(s => !s.created_at || dateInRange(s.created_at, f.from, f.to));
    
        const headers = ['Station', 'Shift', 'Date', 'Expected', 'Cash', 'Mobile', 'Credit', 'Total Actual', 'Difference', 'Status'];
        const rows = [];
    
        closed.forEach(s => {
          const petrolSold = Math.max(0, (s.end_petrol || 0) - (s.start_petrol || 0));
          const dieselSold = Math.max(0, (s.end_diesel || 0) - (s.start_diesel || 0));
          const gasSold = Math.max(0, (s.end_gas || 0) - (s.start_gas || 0));
          const pPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Petrol') || {}).selling_price || 0;
          const dPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Diesel') || {}).selling_price || 0;
          const gPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type === 'Gas') || {}).selling_price || 0;
          const expected = petrolSold * pPrice + dieselSold * dPrice + gasSold * gPrice;
          const recon = recons.find(r => r.shift_id === s.id);
          const cash = recon ? (recon.cash_actual || 0) : 0;
          const mobile = recon ? (recon.mobile_actual || 0) : 0;
          const credit = recon ? (recon.credit_actual || 0) : 0;
          const actual = cash + mobile + credit;
          const diff = actual - expected;
          const status = recon ? 'Done' : 'Pending';
          rows.push([stationName(s.station_id), s.shift_type, formatDate(s.created_at), formatMoney(expected), formatMoney(cash), formatMoney(mobile), formatMoney(credit), formatMoney(actual), formatMoney(diff), status]);
        });
    
        let body = '<div class="d-flex justify-content-between mb-3">' +
          '<h5 class="mb-0">Reconciliation Report <span class="badge bg-secondary">' + closed.length + '</span></h5></div>';
        body += regenerateTable(headers, rows);
        return { html: body, headers: headers, rows: rows, filename: 'reconciliation_report' };
      }
    
      function genExpenses(f) {
        const data = filterByCommon(expenses, f).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
        let total = 0;
        const headers = ['Station', 'Source', 'Description', 'Category', 'Amount', 'Date'];
        const rows = [];
    
        data.forEach(e => {
          total += Number(e.amount) || 0;
          const src = e.source_account === 'petty_cash' ? 'Petty Cash' : (e.source_account || '—');
          rows.push([stationName(e.station_id), src, e.description || '—', e.category || 'other', formatMoney(e.amount || 0), formatDate(e.created_at)]);
        });
    
        let body = '<div class="d-flex justify-content-between mb-3">' +
          '<h5 class="mb-0">Expenses <span class="badge bg-danger">' + data.length + '</span></h5>' +
          '<div class="fw-bold text-danger">' + formatMoney(total) + '</div></div>';
        body += regenerateTable(headers, rows);
        return { html: body, headers: headers, rows: rows, filename: 'expenses_report' };
      }
    
      function genBanking(f) {
        const data = filterByCommon(bankings, f).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
        let total = 0;
        const headers = ['Station', 'Source', 'Destination', 'Depositor', 'Amount', 'Description', 'Date'];
        const rows = [];
    
        data.forEach(b => {
          total += Number(b.amount) || 0;
          const from = b.source_account === 'cash_till' ? 'Cash Till' :
            b.source_account === 'petty_cash' ? 'Petty Cash' : (b.source_account || '—');
          rows.push([stationName(b.station_id), from, b.bank_account_id || '—', b.depositor || '—', formatMoney(b.amount || 0), b.description || '—', formatDate(b.created_at)]);
        });
    
        let body = '<div class="d-flex justify-content-between mb-3">' +
          '<h5 class="mb-0">Banking Deposits <span class="badge bg-success">' + data.length + '</span></h5>' +
          '<div class="fw-bold text-success">' + formatMoney(total) + '</div></div>';
        body += regenerateTable(headers, rows);
        return { html: body, headers: headers, rows: rows, filename: 'banking_report' };
      }
    
      function genStock(f) {
        const data = stock.filter(s => {
          if (f.stationId && Number(s.station_id) !== f.stationId) return false;
          const dt = s.received_date || s.created_at;
          if (dt && !dateInRange(dt, f.from, f.to)) return false;
          return true;
        }).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
    
        const headers = ['Station', 'Invoice', 'Items', 'Total Qty (L)', 'Date'];
        const rows = [];
    
        data.forEach(r => {
          const items = (r.items || []).map(it => it.product_type + ' ' + it.quantity + 'L @' + it.cost_price).join('; ');
          const totalQty = (r.items || []).reduce((sum, it) => sum + (Number(it.quantity) || 0), 0);
          rows.push([stationName(r.station_id), r.invoice_number || '—', items, totalQty.toFixed(2), formatDate(r.received_date || r.created_at)]);
        });
    
        let body = '<div class="d-flex justify-content-between mb-3">' +
          '<h5 class="mb-0">Stock Receiving <span class="badge bg-info">' + data.length + '</span></h5></div>';
        body += regenerateTable(headers, rows);
        return { html: body, headers: headers, rows: rows, filename: 'stock_report' };
      }
    
      function genAdjustments(f) {
        const data = filterByCommon(adjustments, f).sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
        const headers = ['Station', 'Product', 'Quantity', 'Reason', 'Date'];
        const rows = [];
    
        data.forEach(a => {
          rows.push([stationName(a.station_id), a.product_type, (Number(a.quantity) || 0).toFixed(2), a.reason || '—', formatDate(a.created_at)]);
        });
    
        let body = '<div class="d-flex justify-content-between mb-3">' +
          '<h5 class="mb-0">Stock Adjustments <span class="badge bg-warning text-dark">' + data.length + '</span></h5></div>';
        body += regenerateTable(headers, rows);
        return { html: body, headers: headers, rows: rows, filename: 'adjustments_report' };
      }
    
      let lastReport = null;
    
      function runReport() {
        const f = getFilters();
        let result;
        switch (f.type) {
          case 'sales': result = genSales(f); break;
          case 'profit': result = genProfit(f); break;
          case 'inventory': result = genInventory(f); break;
          case 'shifts': result = genShifts(f); break;
          case 'reconciliation': result = genReconciliation(f); break;
          case 'expenses': result = genExpenses(f); break;
          case 'banking': result = genBanking(f); break;
          case 'stock': result = genStock(f); break;
          case 'adjustments': result = genAdjustments(f); break;
          default: result = { html: '<div class="alert alert-info">Unknown report type</div>', headers: [], rows: [], filename: 'report' };
        }
    
        if (f.search && result.rows && result.rows.length > 0) {
          const filteredRows = result.rows.filter(row => {
            return row.some(cell => String(cell).toLowerCase().includes(f.search));
          });
          result.rows = filteredRows;
          result.html = regenerateTable(result.headers, filteredRows);
          if (filteredRows.length === 0) {
            result.html = '<div class="alert alert-info">No results matching "' + f.search + '"</div>';
          }
        }
    
        lastReport = result;
        $('#rptResult').innerHTML = result.html;
      }
    
      $('#rptGenerate').onclick = runReport;
    
      $('#rptReset').onclick = function() {
        const today = new Date();
        const thirtyDaysAgo = new Date(today);
        thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
    
        $('#rptType').value = 'sales';
        $('#rptStation').value = '';
        $('#rptFrom').value = toISO(thirtyDaysAgo);
        $('#rptTo').value = toISO(today);
        $('#rptProduct').value = '';
        $('#rptSearch').value = '';
    
        toast('Filters reset', 'info');
        runReport();
      };
    
      $('#rptExport').onclick = function() {
        if (!lastReport || !lastReport.rows || lastReport.rows.length === 0) {
          toast('Generate a report with data first', 'warning');
          return;
        }
        exportCSV(lastReport.headers, lastReport.rows, lastReport.filename + '.csv');
        toast('CSV exported');
      };
    
      $('#rptExportPDF').onclick = function() {
        if (!lastReport || !lastReport.rows || lastReport.rows.length === 0) {
          toast('Generate a report with data first', 'warning');
          return;
        }
        exportPDF(lastReport.headers, lastReport.rows, lastReport.filename + '.pdf');
        toast('PDF generated');
      };
    
      $('#rptSearch').onkeypress = function(e) {
        if (e.key === 'Enter') {
          runReport();
        }
      };
    
      runReport();
    }
    
    console.log('Part 8 loaded – Reports complete');
    </body>
