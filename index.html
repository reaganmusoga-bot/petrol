<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetroManager Pro</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --sidebar-w: 260px;
      --header-h: 60px;
      --bg: #f0f2f6;
      --sidebar-bg: #0b1a33;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; }
    .sidebar {
      position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh;
      background: var(--sidebar-bg); color: #b0c4de; z-index: 1050;
      display: flex; flex-direction: column; transition: transform .3s;
      overflow-y: auto; overflow-x: hidden;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    .sidebar::-webkit-scrollbar-thumb { background: #ffc107; border-radius: 4px; }
    .sidebar-brand {
      padding: 18px 20px; font-size: 1.25rem; font-weight: 700; color: #fff;
      background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .sidebar-brand i { font-size: 1.7rem; color: #ffc107; }
    .sidebar .nav-link {
      color: #b0c4de; padding: 10px 16px; border-left: 3px solid transparent;
      display: flex; align-items: center; gap: 12px; font-weight: 500; cursor: pointer;
      font-size: 0.9rem; white-space: nowrap;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      background: rgba(255,255,255,.07); color: #fff; border-left-color: #ffc107;
    }
    .sidebar .nav-link i { width: 22px; font-size: 1.15rem; }
    .sidebar-footer {
      margin-top: auto; padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.07);
      font-size: .85rem; flex-shrink: 0;
    }
    .main-content { margin-left: var(--sidebar-w); min-height: 100vh; }
    .top-header {
      height: var(--header-h); background: #fff; border-bottom: 1px solid #e9ecef;
      padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 1040;
    }
    .page-title { font-weight: 600; font-size: 1.15rem; color: #1a2a4a; }
    .page-content { padding: 22px 24px; }
    .card-box {
      background: #fff; border-radius: 12px; padding: 18px 20px;
      border: 1px solid #eef0f3; box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px; margin-bottom: 20px;
    }
    .stat-item {
      background: #fff; border-radius: 12px; padding: 16px;
      border: 1px solid #eef0f3; display: flex; align-items: center; gap: 14px;
    }
    .stat-item .icon {
      width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.25rem;
    }
    .stat-item .num { font-size: 1.4rem; font-weight: 700; color: #1a2a4a; }
    .stat-item .lbl { font-size: .8rem; color: #6c7a8e; }
    .hero {
      background: linear-gradient(135deg, #0b1a33, #1a3a6a);
      border-radius: 14px; padding: 24px 28px; color: #fff; margin-bottom: 20px;
    }
    .hero .company { font-size: 1.55rem; font-weight: 700; color: #ffc107; }
    .hero .tag { opacity: .85; font-size: .9rem; }
    .hero .details {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px 20px; margin-top: 12px;
      background: rgba(255,255,255,0.08); padding: 12px 16px; border-radius: 8px;
    }
    .hero .details i { color: #ffc107; }
    .badge-day { background: #fff3cd; color: #856404; padding: 3px 11px; border-radius: 20px; font-size: .71rem; font-weight: 600; }
    .badge-night { background: #d1ecf1; color: #0c5460; padding: 3px 11px; border-radius: 20px; font-size: .71rem; font-weight: 600; }
    .badge-active { background: #d4edda; color: #155724; padding: 2px 10px; border-radius: 20px; font-size: .7rem; font-weight: 600; }
    .badge-closed { background: #f8d7da; color: #721c24; padding: 2px 10px; border-radius: 20px; font-size: .7rem; font-weight: 600; }
    .product-badge { padding: 2px 10px; border-radius: 12px; font-size: .72rem; font-weight: 600; }
    .product-badge.petrol { background: #cfe2ff; color: #084298; }
    .product-badge.diesel { background: #f8d7da; color: #58151c; }
    .product-badge.gas { background: #d1ecf1; color: #0c5460; }
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0b1a33, #1a3a6a); padding: 20px;
    }
    .login-card {
      background: #fff; border-radius: 18px; padding: 36px 32px;
      max-width: 480px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }
    .login-card .logo { text-align: center; margin-bottom: 24px; }
    .login-card .logo i { font-size: 2.8rem; color: #ffc107; background: #0b1a33; padding: 12px; border-radius: 14px; }
    .fs-xs { font-size: .78rem; }
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(255,255,255,.75); z-index: 9999;
      display: flex; align-items: center; justify-content: center;
    }
    .spinner {
      width: 2.2rem; height: 2.2rem; border: .25em solid #0d6efd;
      border-right-color: transparent; border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .sidebar-toggle { display: inline-block !important; }
    }
    @media (min-width: 769px) { .sidebar-toggle { display: none !important; } }
    .report-filter .form-label { font-weight: 600; font-size: 0.8rem; margin-bottom: 2px; }
    .report-filter .form-control, .report-filter .form-select { font-size: 0.85rem; }
    .table-report thead th { background: #f8f9fa; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .table-report td { font-size: 0.85rem; }
    .profit-positive { color: #198754; font-weight: 700; }
    .profit-negative { color: #dc3545; font-weight: 700; }
    .table-dark th { background: #0b1a33 !important; color: #fff !important; position: sticky; top: 0; z-index: 10; }
    #offlineBanner {
      display: none; background: #dc3545; color: #fff; text-align: center;
      padding: 8px; font-size: 0.9rem; position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
    }
    body.offline #offlineBanner { display: block; }
    body.offline .main-content { padding-top: 40px; }
  </style>
</head>
<body>

<div id="offlineBanner"><i class="bi bi-wifi-off"></i> You are offline – showing cached data only</div>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <i class="bi bi-fuel-pump"></i>
      <h4 class="mt-2 mb-0 fw-bold">PetroManager Pro</h4>
      <p class="text-muted small mb-0">Multi-Company Fuel Management</p>
    </div>

    <div id="normalLogin">
      <form id="loginForm" autocomplete="off">
        <div class="mb-3">
          <label class="form-label fw-semibold">Company</label>
          <select id="loginCompany" class="form-select form-select-lg" required>
            <option value="">— Select Company —</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <select id="loginUsername" class="form-select form-select-lg" required>
            <option value="">— Select User —</option>
          </select>
        </div>
        <div class="mb-3">

          <input type="password" id="loginPassword" class="form-control form-control-lg" required placeholder="Enter password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn">Sign In</button>

      </form>
      <div class="mt-4 text-center">
        <button type="button" id="showCreateCompanyBtn" class="btn btn-outline-warning btn-sm">Create First Company</button>
      </div>

    <div id="createCompanyForm" style="display:none;">
      <h5 class="mb-3 text-center">Create First Company</h5>
      <div class="mb-3">
        <label class="form-label">Company Name</label>
        <input type="text" id="newCompName" class="form-control" placeholder="e.g. GIMIX Fuel">
      </div>
      <div class="mb-3">
        <label class="form-label">Tagline</label>
        <input type="text" id="newCompTagline" class="form-control" placeholder="Fueling Uganda">
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" id="newCompAddress" class="form-control" placeholder="Kampala, Uganda">
      </div>
      <div class="mb-3">
        <label class="form-label">Admin Username</label>
        <input type="text" id="newCompAdminUser" class="form-control" placeholder="admin">
      </div>
      <div class="mb-3">
        <label class="form-label">Admin Password</label>
        <input type="password" id="newCompAdminPass" class="form-control" placeholder="Min 4 characters">
      </div>
      <button type="button" id="createCompanyBtn" class="btn btn-warning w-100">Create Company & Admin</button>
      <button type="button" id="cancelCreateCompanyBtn" class="btn btn-outline-secondary w-100 mt-2">Cancel</button>
      <div id="createCompanyResult" class="text-center mt-3 small"></div>
    </div>

    <div class="mt-3 d-flex gap-2 justify-content-center">
      <button type="button" id="diagnoseBtn" class="btn btn-sm btn-outline-info">Diagnose</button>
    </div>
    <div id="diagnoseBox" class="mt-3 p-2 bg-light rounded small" style="display:none;"></div>
  </div>
</div>

<div id="appMain" style="display:none;">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="bi bi-fuel-pump"></i> PetroManager</div>
    <div class="mt-2 flex-grow-1" id="sidebarNav"></div>
    <div class="sidebar-footer">
      <div class="d-flex align-items-center gap-2 mb-2">
        <i class="bi bi-person-circle"></i>
        <span id="sidebarUser">—</span>
        <span class="ms-auto badge bg-secondary" id="sidebarRole">—</span>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <header class="top-header">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light sidebar-toggle p-1" id="sidebarToggle">
          <i class="bi bi-list fs-4"></i>
        </button>
        <span class="page-title" id="pageTitle">Dashboard</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <select id="stationSelector" class="form-select form-select-sm" style="max-width:180px;">
          <option value="">All Stations</option>
        </select>
        <div class="dropdown">
          <div class="d-flex align-items-center gap-2" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="cursor:pointer;">
            <span class="fw-semibold d-none d-md-inline" id="headerUser">—</span>
            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:36px;height:36px;" id="headerAvatar">U</div>
            <i class="bi bi-chevron-down text-muted small"></i>
          </div>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li><span class="dropdown-item-text text-muted small" id="headerRole">—</span></li>
            <li><span class="dropdown-item-text text-muted small" id="headerCompany">—</span></li>
            <li><hr class="dropdown-divider"></li>

</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999;"></div>
<script>
// ============================================================
// PART 2: FIREBASE CONFIG & CORE UTILITIES
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyCWyrW4xa4i1X3D6uzEPbKfFbwEBU0UVbk",
  authDomain: "petrol-59a19.firebaseapp.com",
  projectId: "petrol-59a19",
  storageBucket: "petrol-59a19.firebasestorage.app",
  messagingSenderId: "195467455062",
  appId: "1:195467455062:web:288de1c059ca60a2e769f7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

db.enablePersistence({ synchronizeTabs: true }).catch(err => console.warn('Persistence not enabled', err));

const state = {
  user: null,
  stations: [],
  currentStationId: null,
  currentPage: 'dashboard',
  isOnline: navigator.onLine,
  companies: []
};

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function toast(msg, type = 'success') {
  const colors = {
    success: 'bg-success',
    danger: 'bg-danger',
    warning: 'bg-warning text-dark',
    info: 'bg-info text-dark'
  };
  const el = document.createElement('div');
  el.className = `toast align-items-center text-white ${colors[type] || colors.info} border-0 show`;
  el.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  $('.toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

function formatMoney(n) { return 'UGX ' + (Number(n) || 0).toLocaleString(); }
function formatDate(d) {
  if (!d) return '—';
  const dt = d.toDate ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-GB');
}
function formatDateTime(d) {
  if (!d) return '—';
  const dt = d.toDate ? d.toDate() : new Date(d);
  return dt.toLocaleString('en-GB');
}

function roleNorm(r) {
  if (!r) return 'cashier';
  const x = String(r).toLowerCase().trim();
  if (x === 'super_admin' || x === 'super admin') return 'super_admin';
  if (x === 'top_admin' || x === 'top admin') return 'top_admin';
  if (x === 'admin') return 'admin';
  if (x === 'manager') return 'manager';
  return 'cashier';
}
function isAdmin(r) { return ['super_admin', 'top_admin', 'admin', 'manager'].includes(roleNorm(r)); }
function canManageUsers(r) { return ['super_admin', 'top_admin'].includes(roleNorm(r)); }
function canManageCompany(r) { return ['super_admin', 'top_admin'].includes(roleNorm(r)); }

function stationName(id) {
  const s = state.stations.find(st => Number(st.id) === Number(id));
  return s ? s.name : 'Unknown';
}

function showLoading(show) {
  let ov = $('#loadingOverlay');
  if (show) {
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'loadingOverlay';
      ov.className = 'loading-overlay';
      ov.innerHTML = '<div class="spinner"></div>';
      document.body.appendChild(ov);
    }
  } else if (ov) {
    ov.remove();
  }
}

async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode('PetroManagerSalt_' + password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return 'pm_' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function createCompany(companyData) {
  const ref = await db.collection('companies').add({
    name: companyData.name,
    tagline: companyData.tagline || '',
    address: companyData.address || '',
    phone: companyData.phone || '',
    email: companyData.email || '',
    tax_id: companyData.tax_id || '',
    website: companyData.website || '',
    logo_url: companyData.logo_url || '',
    created_at: firebase.firestore.FieldValue.serverTimestamp(),
    created_by: state.user ? state.user.id : null,
    active: true
  });
  return ref.id;
}

async function getCompany(companyId) {
  const doc = await db.collection('companies').doc(companyId).get();
  return doc.exists ? { id: doc.id, ...doc.data() } : null;
}

async function updateCompany(companyId, data) {
  await db.collection('companies').doc(companyId).set({
    ...data,
    updated_at: firebase.firestore.FieldValue.serverTimestamp(),
    updated_by: state.user ? state.user.id : null
  }, { merge: true });
}

async function getAllCompanies() {
  const snap = await db.collection('companies').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function getCompanyFilter() {
  if (state.user && state.user.role === 'super_admin') return null;
  return state.user ? state.user.companyId : null;
}

async function getAll(col, queryFn = null) {
  let ref = db.collection(col);
  const companyId = getCompanyFilter();
  if (companyId) {
    ref = ref.where('companyId', '==', companyId);
  }
  if (queryFn) ref = queryFn(ref);
  const snap = await ref.get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function getDoc(col, id) {
  const d = await db.collection(col).doc(String(id)).get();
  return d.exists ? Object.assign({ id: d.id }, d.data()) : null;
}

async function addDoc(col, data) {
  const companyId = state.user ? state.user.companyId : null;
  const ref = await db.collection(col).add({
    ...data,
    companyId: companyId,
    created_at: firebase.firestore.FieldValue.serverTimestamp(),
    created_by: state.user ? state.user.id : null
  });
  return ref.id;
}

async function updateDoc(col, id, data) {
  const ref = db.collection(col).doc(String(id));
  const doc = await ref.get();
  if (!doc.exists) throw new Error(`Document ${id} not found in ${col}`);
  await ref.update(data);
}

async function deleteDoc(col, id) {
  const ref = db.collection(col).doc(String(id));
  const doc = await ref.get();
  if (!doc.exists) throw new Error(`Document ${id} not found in ${col}`);
  await ref.delete();
}

async function adjustInventory(stationId, product, delta, costPrice = null) {
  const ref = db.collection('inventory').doc(`${stationId}_${product}`);
  return db.runTransaction(async (tx) => {
    const doc = await tx.get(ref);
    let currentQty = 0, currentCost = 0;
    if (doc.exists) {
      currentQty = doc.data().quantity || 0;
      currentCost = doc.data().cost_price || 0;
    }
    const newQty = currentQty + delta;
    if (newQty < 0) throw new Error(`Insufficient stock for ${product}. Available: ${currentQty.toFixed(2)} L`);
    const newCost = (costPrice !== null && costPrice !== undefined) ? costPrice : currentCost;
    tx.set(ref, {
      station_id: Number(stationId),
      product_type: product,
      quantity: newQty,
      cost_price: newCost,
      selling_price: doc.exists ? (doc.data().selling_price || 0) : 0,
      companyId: state.user ? state.user.companyId : null,
      last_updated: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    return newQty;
  });
}

async function logAudit(action, details) {
  try {
    await addDoc('audit_logs', {
      user_id: state.user ? state.user.id : 'system',
      username: state.user ? state.user.username : 'system',
      action: action,
      details: details,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) { console.warn('Audit log failed', e); }
}

function exportCSV(headers, rows, filename = 'report.csv') {
  let csv = headers.join(',') + '\n';
  rows.forEach(row => {
    csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportPDF(headers, rows, filename = 'report.pdf') {
  if (!rows || rows.length === 0) {
    toast('No data to export', 'warning');
    return;
  }
  const pdfWindow = window.open('', '_blank', 'width=800,height=600');
  if (!pdfWindow) {
    toast('Please allow popups for this site', 'warning');
    return;
  }
  const now = new Date();
  const dateStr = now.toLocaleString('en-GB');
  let tableHtml = '<table border="1" cellpadding="8" cellspacing="0" style="width:100%;border-collapse:collapse;font-size:12px;">';
  tableHtml += '<thead><tr style="background:#0b1a33;color:#fff;">';
  headers.forEach(h => tableHtml += '<th style="padding:8px;text-align:left;">' + h + '</th>');
  tableHtml += '</tr></thead><tbody>';
  rows.forEach(row => {
    tableHtml += '<tr>';
    row.forEach(cell => tableHtml += '<td style="padding:6px;border-bottom:1px solid #ddd;">' + cell + '</td>');
    tableHtml += '</tr>';
  });
  tableHtml += '</tbody></table>';
  pdfWindow.document.write(`
    <html>
    <head><title>${filename}</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 30px; }
      .header { text-align: center; border-bottom: 2px solid #0b1a33; padding-bottom: 10px; margin-bottom: 20px; }
      .header h1 { margin: 0; color: #0b1a33; }
      .header p { margin: 2px 0; color: #666; font-size: 12px; }
      .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #999; border-top: 1px solid #ddd; padding-top: 10px; }
      .no-print { text-align: center; margin: 20px 0; }
      button { padding: 10px 30px; margin: 0 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
      .btn-print { background: #0b1a33; color: #fff; }
      .btn-close { background: #dc3545; color: #fff; }

function updateOnlineStatus() {

}

<script>
// ============================================================
// PART 3: AUTHENTICATION & NAVIGATION
// ============================================================

async function loadCompaniesForLogin() {
  const select = $('#loginCompany');
  select.innerHTML = '<option value="">— Select Company —</option>';
  try {
    const companies = await getAllCompanies();
    companies.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      select.appendChild(opt);
    });
  } catch (e) {
    select.innerHTML = '<option value="">Error loading companies</option>';
  }
}

async function loadUsersForLogin(companyId = null) {
  const select = $('#loginUsername');
  select.innerHTML = '<option value="">— Select User —</option>';
  if (!companyId) return;
  try {
    const snap = await db.collection('users').where('companyId', '==', companyId).get();
    const users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    users.sort((a, b) => (a.name || a.username || '').localeCompare(b.name || b.username || ''));
    users.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = `${u.name || u.username} (${u.role})`;
      select.appendChild(opt);
    });
  } catch (e) {
    select.innerHTML = '<option value="">Error loading users</option>';
  }
}

$('#loginCompany').addEventListener('change', function() { loadUsersForLogin(this.value); });
$('#showCreateCompanyBtn').addEventListener('click', () => {
  $('#normalLogin').style.display = 'none';
  $('#createCompanyForm').style.display = 'block';
});
$('#cancelCreateCompanyBtn').addEventListener('click', () => {
  $('#createCompanyForm').style.display = 'block' ? $('#createCompanyForm').style.display = 'none' : null;
  $('#normalLogin').style.display = 'block';
});

$('#createCompanyBtn').addEventListener('click', async () => {
  const name = $('#newCompName').value.trim();
  const adminUser = $('#newCompAdminUser').value.trim().toLowerCase();
  const adminPass = $('#newCompAdminPass').value;
  const resultEl = $('#createCompanyResult');
  
  if (!name || !adminUser || !adminPass) {
    resultEl.innerHTML = '<span class="text-danger">Please fill required fields</span>';
    return;
  }
  
  try {
    const compId = await createCompany({ name, tagline: $('#newCompTagline').value, address: $('#newCompAddress').value });
    const hashed = await hashPassword(adminPass);
    await db.collection('users').add({
      username: adminUser,
      name: 'System Admin',
      password: hashed,
      role: 'top_admin',
      companyId: compId,
      active: true
    });
    toast('Company and Admin created!', 'success');
    $('#createCompanyForm').style.display = 'none';
    $('#normalLogin').style.display = 'block';
    await loadCompaniesForLogin();
  } catch (err) {
    resultEl.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
  }
});

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const userId = $('#loginUsername').value;
  const pass = $('#loginPassword').value;
  const errBox = $('#loginError');
  errBox.style.display = 'none';
  
  try {
    const userDoc = await db.collection('users').doc(userId).get();
    if (!userDoc.exists) throw new Error('User does not exist');
    const uData = { id: userDoc.id, ...userDoc.data() };
    const hashed = await hashPassword(pass);
    
    if (uData.password !== hashed) throw new Error('Invalid password');
    state.user = uData;
    localStorage.setItem('pm_user', JSON.stringify(uData));
    await initApp();
  } catch(err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
});

async function initApp() {
  $('#loginScreen').style.display = 'none';
  $('#appMain').style.display = 'block';
  
  state.stations = await getAll('stations');
  buildSidebar();
  
  $('#sidebarUser').textContent = state.user.name || state.user.username;
  $('#sidebarRole').textContent = state.user.role;
  $('#headerUser').textContent = state.user.name || state.user.username;
  $('#headerRole').textContent = state.user.role;
  
  renderPage();
}

function buildSidebar() {
  const isAdm = isAdmin(state.user.role);
  let nav = `
    <a class="nav-link active" onclick="navigateTo('dashboard')"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a class="nav-link" onclick="navigateTo('pos')"><i class="bi bi-cart"></i> POS & Sales</a>
    <a class="nav-link" onclick="navigateTo('balancing')"><i class="bi bi-journal-check"></i> Shift Balancing</a>
    <a class="nav-link" onclick="navigateTo('inventory')"><i class="bi bi-box-seam"></i> Inventory</a>
    <a class="nav-link" onclick="navigateTo('adjustments')"><i class="bi bi-sliders"></i> Adjustments</a>
    <a class="nav-link" onclick="navigateTo('financials')"><i class="bi bi-cash-stack"></i> Financials</a>
    <a class="nav-link" onclick="navigateTo('reports')"><i class="bi bi-bar-chart"></i> Reports</a>
  `;
  if (isAdm) {
    nav += `<a class="nav-link" onclick="navigateTo('users')"><i class="bi bi-people"></i> Users</a>`;
    nav += `<a class="nav-link" onclick="navigateTo('company')"><i class="bi bi-building"></i> Company Profile</a>`;
    nav += `<a class="nav-link" onclick="navigateTo('activity')"><i class="bi bi-activity"></i> Activity Log</a>`;
  }
  $('#sidebarNav').innerHTML = nav;
}

function navigateTo(page) {
  state.currentPage = page;
  $$('#sidebarNav .nav-link').forEach(el => el.classList.remove('active'));
  renderPage();
}

$('#headerLogout').addEventListener('click', () => {
  localStorage.removeItem('pm_user');
  location.reload();
});

window.addEventListener('DOMContentLoaded', () => {
  loadCompaniesForLogin();
  const saved = localStorage.getItem('pm_user');
  if (saved) {
    state.user = JSON.parse(saved);
    initApp();
  }
});
</script>
<script>
// ============================================================
// PART 4: ROUTER & DASHBOARD
// ============================================================

async function renderPage() {
  const page = state.currentPage;
  $('#pageTitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);
  
  switch(page) {
    case 'dashboard': await renderDashboard(); break;
    case 'pos': await renderPOS(); break;
    case 'balancing': await renderBalancing(); break;
    case 'inventory': await renderInventory(); break;
    case 'adjustments': await renderAdjustments(); break;
    case 'financials': await renderFinancials(); break;
    case 'reports': await renderReports(); break;
    case 'users': await renderUsers(); break;
    case 'company': await renderCompanyProfile(); break;
    case 'activity': await renderActivityLog(); break;
    default: renderDashboard();
  }
}

async function renderDashboard() {
  const sales = await getAll('sales');
  const inventory = await getAll('inventory');
  
  let totalSalesAmt = sales.reduce((acc, s) => acc + (Number(s.amount) || 0), 0);
  let totalLiters = sales.reduce((acc, s) => acc + (Number(s.quantity) || 0), 0);

  let html = `
    <div class="hero">
      <div class="company">${state.user ? state.user.companyId : 'PetroManager'}</div>
      <div class="tag">Real-time Station Overview</div>
    </div>
    
    <div class="stat-grid">
      <div class="stat-item">
        <div class="icon bg-primary"><i class="bi bi-currency-dollar"></i></div>
        <div><div class="num">${formatMoney(totalSalesAmt)}</div><div class="lbl">Total Gross Sales</div></div>
      </div>
      <div class="stat-item">
        <div class="icon bg-success"><i class="bi bi-fuel-pump"></i></div>
        <div><div class="num">${totalLiters.toFixed(2)} L</div><div class="lbl">Volume Dispensed</div></div>
      </div>
      <div class="stat-item">
        <div class="icon bg-warning text-dark"><i class="bi bi-box-seam"></i></div>
        <div><div class="num">${inventory.length}</div><div class="lbl">Tracked Products</div></div>
      </div>
    </div>

    <div class="card-box">
      <h5><i class="bi bi-graph-up"></i> Sales Performance</h5>
      <canvas id="dashboardChart" style="max-height: 300px;"></canvas>
    </div>
  `;

  $('#pageContent').innerHTML = html;

  // Chart Rendering
  const ctx = $('#dashboardChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: sales.slice(-7).map(s => formatDate(s.created_at)),
      datasets: [{
        label: 'Revenue (UGX)',
        data: sales.slice(-7).map(s => s.amount || 0),
        borderColor: '#0d6efd',
        tension: 0.3
      }]
    }
  });
}
</script>
<script>
// ============================================================
// PART 5: SHIFT BALANCING & RECONCILIATION
// ============================================================

async function renderBalancing() {
  const shifts = await getAll('shifts');
  const reconciliations = await getAll('reconciliations');
  const closedShifts = shifts.filter(s => s.status === 'closed');

  let html = `
    <div class="card-box">
      <h5 class="mb-3"><i class="bi bi-journal-check"></i> Shift Balancing & Reconciliation</h5>
      <div class="table-responsive">
        <table class="table table-sm table-hover table-bordered">
          <thead class="table-dark">
            <tr>
              <th>Date</th>
              <th>Shift ID</th>
              <th>Cashier</th>
              <th>Expected Cash</th>
              <th>Actual Cash</th>
              <th>Mobile Money</th>
              <th>Variance</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>`;

  if (closedShifts.length === 0) {
    html += `<tr><td colspan="8" class="text-center text-muted py-4">No closed shifts available for reconciliation</td></tr>`;
  } else {
    closedShifts.forEach(s => {
      const rec = reconciliations.find(r => r.shift_id === s.id) || {};
      const expected = s.expected_amount || 0;
      const actualCash = rec.cash_actual || 0;
      const actualMobile = rec.mobile_actual || 0;
      const diff = (actualCash + actualMobile) - expected;

      html += `
        <tr>
          <td>${formatDate(s.created_at)}</td>
          <td>#${s.id.slice(0, 6)}</td>
          <td>${s.cashier_name || 'Cashier'}</td>
          <td>${formatMoney(expected)}</td>
          <td>${formatMoney(actualCash)}</td>
          <td>${formatMoney(actualMobile)}</td>
          <td class="${diff < 0 ? 'profit-negative' : 'profit-positive'}">${formatMoney(diff)}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary reconcile-btn" data-id="${s.id}" data-expected="${expected}">
              <i class="bi bi-calculator"></i> Reconcile
            </button>
          </td>
        </tr>`;
    });
  }

  html += `</tbody></table></div></div>`;
  $('#pageContent').innerHTML = html;

  $$('.reconcile-btn').forEach(btn => {
    btn.onclick = async function() {
      const id = this.dataset.id;
      const expected = parseFloat(this.dataset.expected);
      const cash = parseFloat(prompt('Enter Total Cash Collected:') || 0);
      const mobile = parseFloat(prompt('Enter Mobile Money Received:') || 0);

      try {
        await addDoc('reconciliations', {
          shift_id: id,
          cash_actual: cash,
          mobile_actual: mobile,
          expected_amount: expected,
          difference: (cash + mobile) - expected,
          reconciled_by: state.user.id
        });
        toast('Reconciliation updated successfully!');
        renderBalancing();
      } catch (err) {
        toast('Error: ' + err.message, 'danger');
      }
    };
  });
}
</script>
<script>
// ============================================================
// PART 6: POS & SALES TRANSACTIONS
// ============================================================

async function renderPOS() {
  const inventory = await getAll('inventory');
  
  let html = `
    <div class="row g-4">
      <div class="col-md-5">
        <div class="card-box">
          <h5><i class="bi bi-cart"></i> New Sale Transaction</h5>
          <form id="posForm">
            <div class="mb-3">
              <label class="form-label">Product</label>
              <select id="posProduct" class="form-select">
                ${inventory.map(i => `<option value="${i.product_type}" data-price="${i.selling_price}">${i.product_type} (${formatMoney(i.selling_price)}/L)</option>`).join('')}
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Quantity (Liters)</label>
              <input type="number" id="posQty" class="form-control" step="0.01" value="1.00">
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-circle"></i> Add To Sale</button>
          </form>
        </div>
      </div>
      <div class="col-md-7">
        <div class="card-box">
          <h5><i class="bi bi-receipt"></i> Active Terminal Cart</h5>
          <div id="cartItems" class="py-3">
            ${state.cart.length === 0 ? '<p class="text-muted">No items in cart</p>' : ''}
          </div>
          <div class="d-flex justify-content-between align-items-center mt-3 border-top pt-2">
            <h5>Total:</h5>
            <h4 class="text-success" id="cartTotal UGX">UGX 0</h4>
          </div>
          <button class="btn btn-success w-100 mt-3" id="checkoutBtn" ${state.cart.length === 0 ? 'disabled' : ''}>Complete Transaction</button>
        </div>
      </div>
    </div>
  `;
  
  $('#pageContent').innerHTML = html;

  $('#posForm').onsubmit = (e) => {
    e.preventDefault();
    const prod = $('#posProduct').value;
    const qty = parseFloat($('#posQty').value);
    const sel = $('#posProduct').options[$('#posProduct').selectedIndex];
    const price = parseFloat(sel.dataset.price || 0);

    state.cart.push({ product: prod, qty, price, total: qty * price });
    renderPOS();
  };
}
</script>
