                    <th>Expected</th><th>Cash</th><th>Mobile</th><th>Credit</th><th>Diff</th><th>Status</th><th></th>
                  </tr></thead><tbody>`;

            if (shifts.length === 0) {
                html += '<tr><td colspan="12" class="text-muted text-center">No closed shifts available</td></tr>';
            } else {
                for (let s of shifts) {
                    const petrolSold = Math.max(0, (s.end_petrol || 0) - (s.start_petrol || 0));
                    const dieselSold = Math.max(0, (s.end_diesel || 0) - (s.start_diesel || 0));
                    const gasSold = Math.max(0, (s.end_gas || 0) - (s.start_gas || 0));
                    const pPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type ===
                        'Petrol') || {}).selling_price || 0;
                    const dPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type ===
                        'Diesel') || {}).selling_price || 0;
                    const gPrice = (inv.find(i => Number(i.station_id) === Number(s.station_id) && i.product_type ===
                        'Gas') || {}).selling_price || 0;
                    const expected = petrolSold * pPrice + dieselSold * dPrice + gasSold * gPrice;
                    const recon = recons.find(r => r.shift_id === s.id);
                    const done = !!recon;
                    const cash = recon ? (recon.cash_actual || 0) : 0;
                    const mobile = recon ? (recon.mobile_actual || 0) : 0;
                    const credit = recon ? (recon.credit_actual || 0) : 0;
                    const total = cash + mobile + credit;
                    const diff = total - expected;
                    const diffClass = Math.abs(diff) < 1 ? 'text-success' : (diff > 0 ? 'text-warning' : 'text-danger');

                    html += `<tr class="${done ? 'table-secondary' : ''}">
                        <td>${stationName(s.station_id)}</td>
                        <td>${s.shift_type}<br><small class="text-muted">${formatDate(s.created_at)}</small></td>
                        <td>${petrolSold.toFixed(2)}</td>
                        <td>${dieselSold.toFixed(2)}</td>
                        <td>${gasSold.toFixed(2)}</td>
                        <td><strong>${formatMoney(expected)}</strong></td>`;

                    if (done) {
                        html +=
                            `<td>${formatMoney(cash)}</td><td>${formatMoney(mobile)}</td><td>${formatMoney(credit)}</td>`;
                    } else {
                        html +=
                            `<td><input type="number" class="form-control form-control-sm rec-cash" style="width:90px" step="100"></td>
                             <td><input type="number" class="form-control form-control-sm rec-mobile" style="width:90px" step="100"></td>
                             <td><input type="number" class="form-control form-control-sm rec-credit" style="width:90px" step="100"></td>`;
                    }

                    html += `<td class="${diffClass}">${formatMoney(diff)}</td>
                             <td>${done ? '<span class="badge bg-success">Done</span>' : '<span class="badge bg-warning text-dark">Pending</span>'}</td>
                             <td>${done ? '—' : `<button class="btn btn-sm btn-primary recon-btn" data-id="${s.id}">Save</button>`}</td>
                           </tr>`;
                }
            }

            html += `</tbody></table></div></div>`;
            $('#pageContent').innerHTML = html;

            document.querySelectorAll('.recon-btn').forEach(btn => {
                btn.onclick = async function() {
                    const shiftId = btn.getAttribute('data-id');
                    const row = btn.closest('tr');
                    const cash = parseFloat(row.querySelector('.rec-cash').value) || 0;
                    const mobile = parseFloat(row.querySelector('.rec-mobile').value) || 0;
                    const credit = parseFloat(row.querySelector('.rec-credit').value) || 0;
                    if (cash + mobile + credit === 0) {
                        toast('Enter at least one amount', 'warning');
                        return;
                    }
                    btn.disabled = true;
                    btn.textContent = 'Saving...';
                    try {
                        await addDoc('reconciliations', {
                            shift_id: shiftId,
                            cash_actual: cash,
                            mobile_actual: mobile,
                            credit_actual: credit,
                            reconciled_by: state.user.id
                        });
                        await logAudit('reconcile_shift', { shift: shiftId, cash, mobile, credit });
                        toast('Reconciliation saved');
                        renderBalancing();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                        btn.disabled = false;
                        btn.textContent = 'Save';
                    }
                };
            });
        }

        async function renderInventory() {
            const inv = (await getAll('inventory'))
                .filter(i => !state.currentStationId || Number(i.station_id) === state.currentStationId);
            const canEdit = isAdmin(state.user.role);

            let html = '<div class="card-box">' +
                '<div class="d-flex justify-content-between align-items-center mb-3">' +
                '<h5 class="mb-0"><i class="bi bi-box-seam"></i> Inventory</h5>' +
                '<span class="badge bg-secondary">' + inv.length + ' items</span>' +
                '</div>' +
                '<div class="table-responsive"><table class="table table-sm table-hover">' +
                '<thead><tr><th>Station</th><th>Product</th><th>Quantity (L)</th><th>Cost/L</th><th>Sell/L</th>' +
                (canEdit ? '<th>Actions</th>' : '') +
                '</tr></thead><tbody>';

            if (inv.length === 0) {
                html += '<tr><td colspan="' + (canEdit ? '6' : '5') +
                    '" class="text-muted text-center">No inventory</td></tr>';
            } else {
                inv.forEach(i => {
                    const docId = i.id;
                    html += '<tr id="row_' + docId + '">' +
                        '<td>' + stationName(i.station_id) + '</td>' +
                        '<td><span class="product-badge ' + (i.product_type || '').toLowerCase() + '">' + i
                        .product_type + '</span></td>' +
                        '<td><strong>' + (i.quantity || 0).toFixed(2) + '</strong></td>' +
                        '<td class="cost-display">' + formatMoney(i.cost_price || 0) + '</td>' +
                        '<td class="sell-display">' + formatMoney(i.selling_price || 0) + '</td>';
                    if (canEdit) {
                        html += '<td>' +
                            '<button class="btn btn-sm btn-outline-primary edit-inv-btn" data-id="' + docId +
                            '" data-cost="' + (i.cost_price || 0) + '" data-sell="' + (i.selling_price || 0) +
                            '">' +
                            '<i class="bi bi-pencil"></i> Edit</button>' +
                            '</td>';
                    }
                    html += '</tr>';
                });
            }

            html += '</tbody></table></div></div>';
            $('#pageContent').innerHTML = html;

            if (canEdit) {
                document.querySelectorAll('.edit-inv-btn').forEach(btn => {
                    btn.onclick = function() {
                        const id = this.dataset.id;
                        const currentCost = parseFloat(this.dataset.cost);
                        const currentSell = parseFloat(this.dataset.sell);
                        const newCost = prompt('Enter new Cost Price:', currentCost);
                        if (newCost === null) return;
                        const newSell = prompt('Enter new Selling Price:', currentSell);
                        if (newSell === null) return;
                        const costVal = parseFloat(newCost);
                        const sellVal = parseFloat(newSell);
                        if (isNaN(costVal) || isNaN(sellVal) || costVal < 0 || sellVal < 0) {
                            toast('Invalid prices', 'danger');
                            return;
                        }
                        updateDoc('inventory', id, {
                            cost_price: costVal,
                            selling_price: sellVal
                        }).then(() => {
                            toast('Inventory updated!', 'success');
                            renderInventory();
                        }).catch(err => {
                            toast('Error: ' + err.message, 'danger');
                        });
                    };
                });
            }
        }

        // ----- OFFLOADING (formerly Stock Receiving) -----
        async function renderStock() {
            const stock = (await getAll('stock'))
                .filter(s => !state.currentStationId || Number(s.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));

            let stationOptions = '';
            state.stations.forEach(s => {
                const selected = state.currentStationId === s.id ? ' selected' : '';
                stationOptions += '<option value="' + s.id + '"' + selected + '>' + s.name + '</option>';
            });

            let html = '<div class="row g-4">' +
                '<div class="col-lg-5"><div class="card-box">' +
                '<h5 class="mb-3"><i class="bi bi-truck"></i> Offloading (Receive Fuel)</h5>' +
                '<form id="stockForm">' +
                '<div class="mb-2"><label class="form-label small">Station *</label>' +
                '<select id="recStation" class="form-select form-select-sm" required>' + stationOptions +
                '</select></div>' +
                '<div class="mb-2"><label class="form-label small">Shipping / Delivery Note # *</label>' +
                '<input type="text" id="recInvoice" class="form-control form-control-sm" placeholder="e.g. DN-2026-0042" required></div>' +
                '<div class="mb-2"><label class="form-label small">Vendor / Supplier *</label>' +
                '<input type="text" id="recVendor" class="form-control form-control-sm" placeholder="e.g. Total Energies, Vivo Energy" required></div>' +
                '<div class="mb-2"><label class="form-label small">Date</label>' +
                '<input type="date" id="recDate" class="form-control form-control-sm" value="' + new Date()
                .toISOString().slice(0, 10) + '"></div>' +
                '<div id="recItems"></div>' +
                '<button type="button" class="btn btn-sm btn-outline-secondary mb-3" id="addRecItem"><i class="bi bi-plus"></i> Add Item</button>' +
                '<button type="submit" class="btn btn-success w-100">Confirm Offloading & Update Inventory</button>' +
                '</form></div></div>' +
                '<div class="col-lg-7"><div class="card-box">' +
                '<h5 class="mb-3">Offloading History</h5>' +
                '<div class="table-responsive"><table class="table table-sm table-hover">' +
                '<thead><tr><th>Station</th><th>Shipping #</th><th>Vendor</th><th>Items</th><th>Date</th><th>Actions</th></tr></thead><tbody>';

            if (stock.length === 0) {
                html += '<tr><td colspan="6" class="text-muted text-center">No offloading records</td></tr>';
            } else {
                stock.slice(0, 20).forEach(r => {
                    const items = (r.items || []).map(it => it.product_type + ' ' + it.quantity + 'L').join(
                    ', ');
                    html += '<tr>' +
                        '<td>' + stationName(r.station_id) + '</td>' +
                        '<td>' + (r.invoice_number || r.shipping_number || '—') + '</td>' +
                        '<td>' + (r.vendor || '—') + '</td>' +
                        '<td class="fs-xs">' + items + '</td>' +
                        '<td class="fs-xs">' + formatDate(r.received_date || r.created_at) + '</td>' +
                        '<td><button class="btn btn-sm btn-outline-danger delete-stock-btn" data-id="' + r
                        .id +
                        '" data-station="' + r.station_id + '" data-items=\'' + JSON.stringify(r.items ||
                            []) +
                        '\'><i class="bi bi-trash"></i></button></td>' +
                        '</tr>';
                });
            }

            html += '</tbody></table></div></div></div></div>';
            $('#pageContent').innerHTML = html;

            const container = $('#recItems');

            function addRecRow() {
                const row = document.createElement('div');
                row.className = 'row g-1 mb-2 rec-row';
                row.innerHTML =
                    '<div class="col-5">' +
                    '<select class="form-select form-select-sm rec-product">' +
                    '<option>Petrol</option><option>Diesel</option><option>Gas</option>' +
                    '</select></div>' +
                    '<div class="col-5"><input type="number" class="form-control form-control-sm rec-qty" placeholder="Qty (L)" step="0.01" required></div>' +
                    '<div class="col-2"><button type="button" class="btn btn-sm btn-outline-danger w-100 remove-rec"><i class="bi bi-x"></i></button></div>';
                container.appendChild(row);
                row.querySelector('.remove-rec').onclick = function() {
                    if (container.children.length > 1) row.remove();
                };
            }
            addRecRow();
            $('#addRecItem').onclick = addRecRow;

            $('#stockForm').onsubmit = async function(e) {
                e.preventDefault();
                const stationId = Number($('#recStation').value);
                const shippingNo = $('#recInvoice').value.trim();
                const vendor = $('#recVendor').value.trim();
                const date = $('#recDate').value;
                if (!shippingNo) { toast('Shipping / Delivery Note number is required', 'warning'); return; }
                if (!vendor) { toast('Vendor / Supplier is required', 'warning'); return; }

                const items = [];
                let valid = true;
                document.querySelectorAll('.rec-row').forEach(r => {
                    const product = r.querySelector('.rec-product').value;
                    const qty = parseFloat(r.querySelector('.rec-qty').value);
                    if (!qty || qty <= 0) {
                        valid = false;
                        return;
                    }
                    items.push({ product_type: product, quantity: qty });
                });
                if (!valid || items.length === 0) {
                    toast('Add at least one item with a valid quantity', 'warning');
                    return;
                }
                try {
                    showLoading(true);
                    const batch = db.batch();
                    const stockRef = db.collection('stock').doc();
                    batch.set(stockRef, {
                        station_id: stationId,
                        invoice_number: shippingNo,
                        shipping_number: shippingNo,
                        vendor: vendor,
                        received_date: date,
                        items: items,
                        created_by: state.user.id,
                        companyId: state.user.companyId,
                        created_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    for (let item of items) {
                        await adjustInventory(stationId, item.product_type, item.quantity, null);
                    }
                    await batch.commit();
                    await logAudit('offload_stock', { station: stationId, shipping: shippingNo, vendor, items });
                    toast('Offloading recorded. Inventory updated.');
                    renderStock();
                } catch (err) {
                    toast(err.message, 'danger');
                } finally {
                    showLoading(false);
                }
            };

            document.querySelectorAll('.delete-stock-btn').forEach(btn => {
                btn.onclick = async function() {
                    const id = this.dataset.id;
                    const stationId = Number(this.dataset.station);
                    const items = JSON.parse(this.dataset.items);
                    if (!confirm('Delete this offloading record? This will REMOVE stock from inventory.'))
                        return;
                    if (!confirm('Are you sure? This cannot be undone!')) return;
                    try {
                        for (let item of items) {
                            await adjustInventory(stationId, item.product_type, -item.quantity);
                        }
                        await deleteDoc('stock', id);
                        await logAudit('delete_offload', { station: stationId, items });
                        toast('Offloading record deleted. Inventory adjusted.', 'success');
                        renderStock();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            });
        }

        // ----- ADJUSTMENTS -----
        async function renderAdjustments() {
            const canAdjust = isAdmin(state.user.role);
            const adj = (await getAll('adjustments'))
                .filter(a => !state.currentStationId || Number(a.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
            const inv = await getAll('inventory');

            let stationOptions = '';
            state.stations.forEach(s => {
                const selected = state.currentStationId === s.id ? ' selected' : '';
                stationOptions += '<option value="' + s.id + '"' + selected + '>' + s.name + '</option>';
            });

            let html = '<div class="row g-4">';
            if (canAdjust) {
                html += '<div class="col-lg-4"><div class="card-box">' +
                    '<h5 class="mb-3"><i class="bi bi-sliders"></i> Adjustment</h5>' +
                    '<form id="adjForm">' +
                    '<div class="mb-2"><label class="form-label small">Adjustment Type *</label>' +
                    '<select id="adjType" class="form-select form-select-sm">' +
                    '<option value="quantity">Quantity (Stock Volume)</option>' +
                    '<option value="cost_price">Cost Price</option>' +
                    '<option value="selling_price">Selling Price</option>' +
                    '<option value="both_prices">Cost + Selling Price</option>' +
                    '</select></div>' +
                    '<div class="mb-2"><label class="form-label small">Station *</label>' +
                    '<select id="adjStation" class="form-select form-select-sm">' + stationOptions +
                    '</select></div>' +
                    '<div class="mb-2"><label class="form-label small">Product *</label>' +
                    '<select id="adjProduct" class="form-select form-select-sm">' +
                    '<option>Petrol</option><option>Diesel</option><option>Gas</option></select></div>' +
                    '<div class="mb-2 p-2 bg-light rounded small" id="adjCurrentInfo">' +
                    '<span class="text-muted">Current values will appear here</span></div>' +
                    '<div id="adjQtySection">' +
                    '<div class="row g-2 mb-2">' +
                    '<div class="col-6">' +
                    '<label class="form-label small">Current Quantity (L)</label>' +
                    '<input type="number" id="adjCurrentQty" class="form-control form-control-sm bg-light" step="0.01" readonly tabindex="-1">' +
                    '</div>' +
                    '<div class="col-6">' +
                    '<label class="form-label small">New Quantity (L) *</label>' +
                    '<input type="number" id="adjNewQty" class="form-control form-control-sm" step="0.01" min="0" placeholder="Enter target qty">' +
                    '</div>' +
                    '</div>' +
                    '<div class="mb-2 p-2 rounded small" id="adjQtyDelta" style="background:#e8f4fd;display:none;">' +
                    '<span class="text-muted">Difference: </span><strong id="adjDeltaValue">0 L</strong>' +
                    '</div>' +
                    '</div>' +
                    '<div id="adjCostSection" style="display:none;">' +
                    '<div class="mb-2"><label class="form-label small">New Cost Price (UGX/L) *</label>' +
                    '<input type="number" id="adjCost" class="form-control form-control-sm" step="10" min="0" placeholder="e.g. 3800"></div>' +
                    '</div>' +
                    '<div id="adjSellSection" style="display:none;">' +
                    '<div class="mb-2"><label class="form-label small">New Selling Price (UGX/L) *</label>' +
                    '<input type="number" id="adjSell" class="form-control form-control-sm" step="10" min="0" placeholder="e.g. 4200"></div>' +
                    '</div>' +
                    '<div class="mb-2"><label class="form-label small">Reason *</label>' +
                    '<input type="text" id="adjReason" class="form-control form-control-sm" placeholder="e.g. price revision, spill, leakage" required></div>' +
                    '<button type="submit" class="btn btn-warning w-100">Apply Adjustment</button>' +
                    '</form></div></div>';
            }

            html += '<div class="col-lg-' + (canAdjust ? '8' : '12') + '"><div class="card-box">' +
                '<h5 class="mb-3">Adjustment History</h5>' +
                '<div class="table-responsive"><table class="table table-sm table-hover">' +
                '<thead><tr><th>Station</th><th>Product</th><th>Type</th><th>Change</th><th>Reason</th><th>Date</th>' +
                (canAdjust ? '<th>Actions</th>' : '') +
                '</tr></thead><tbody>';

            if (adj.length === 0) {
                html += '<tr><td colspan="' + (canAdjust ? '7' : '6') +
                    '" class="text-muted text-center">No adjustments</td></tr>';
            } else {
                adj.slice(0, 40).forEach(a => {
                    const type = a.adj_type || 'quantity';
                    let typeBadge = '';
                    let changeText = '';
                    if (type === 'quantity') {
                        typeBadge = '<span class="badge bg-primary">Qty</span>';
                        const delta = Number(a.quantity || 0);
                        const qtyClass = delta < 0 ? 'text-danger' : 'text-success';
                        const deltaStr = '<span class="' + qtyClass + '">(' + (delta >= 0 ? '+' : '') + delta
                            .toFixed(2) + ' L)</span>';
                        if (a.old_quantity != null && a.new_quantity != null) {
                            changeText = Number(a.old_quantity).toFixed(2) + ' → <strong>' +
                                Number(a.new_quantity).toFixed(2) + ' L</strong> ' + deltaStr;
                        } else {
                            changeText = deltaStr;
                        }
                    } else if (type === 'cost_price') {
                        typeBadge = '<span class="badge bg-info text-dark">Cost</span>';
                        changeText = formatMoney(a.old_cost || 0) + ' → <strong>' + formatMoney(a.new_cost ||
                            0) + '</strong>';
                    } else if (type === 'selling_price') {
                        typeBadge = '<span class="badge bg-success">Sell</span>';
                        changeText = formatMoney(a.old_sell || 0) + ' → <strong>' + formatMoney(a.new_sell ||
                            0) + '</strong>';
                    } else if (type === 'both_prices') {
                        typeBadge = '<span class="badge bg-warning text-dark">Prices</span>';
                        changeText = 'Cost: ' + formatMoney(a.old_cost || 0) + '→' + formatMoney(a.new_cost ||
                            0) +
                            '<br>Sell: ' + formatMoney(a.old_sell || 0) + '→' + formatMoney(a.new_sell || 0);
                    } else {
                        typeBadge = '<span class="badge bg-secondary">Qty</span>';
                        const delta = Number(a.quantity || 0);
                        changeText = '<span class="' + (delta < 0 ? 'text-danger' : 'text-success') + '">(' +
                            (delta >= 0 ? '+' : '') + delta.toFixed(2) + ' L)</span>';
                    }
                    html += '<tr>' +
                        '<td>' + stationName(a.station_id) + '</td>' +
                        '<td><span class="product-badge ' + (a.product_type || '').toLowerCase() + '">' + (a
                            .product_type || '—') + '</span></td>' +
                        '<td>' + typeBadge + '</td>' +
                        '<td class="fs-xs">' + changeText + '</td>' +
                        '<td class="fs-xs">' + (a.reason || '—') + '</td>' +
                        '<td class="fs-xs">' + formatDate(a.created_at) + '</td>';
                    if (canAdjust) {
                        html +=
                            '<td><button class="btn btn-sm btn-outline-danger delete-adj-btn" data-id="' + a
                            .id + '"><i class="bi bi-trash"></i></button></td>';
                    }
                    html += '</tr>';
                });
            }

            html += '</tbody></table></div></div></div></div>';
            $('#pageContent').innerHTML = html;

            if (canAdjust) {
                function updateQtyDelta() {
                    const currentQty = parseFloat($('#adjCurrentQty').value) || 0;
                    const newQty = parseFloat($('#adjNewQty').value);
                    const deltaEl = $('#adjQtyDelta');
                    const deltaVal = $('#adjDeltaValue');
                    if (isNaN(newQty)) {
                        deltaEl.style.display = 'none';
                        return;
                    }
                    const delta = newQty - currentQty;
                    deltaEl.style.display = 'block';
                    if (delta === 0) {
                        deltaVal.textContent = '0 L (no change)';
                        deltaVal.className = 'text-muted';
                    } else if (delta > 0) {
                        deltaVal.textContent = '+' + delta.toFixed(2) + ' L (will be ADDED)';
                        deltaVal.className = 'text-success';
                    } else {
                        deltaVal.textContent = delta.toFixed(2) + ' L (will be REMOVED)';
                        deltaVal.className = 'text-danger';
                    }
                }

                async function updateCurrentInfo() {
                    const stationId = Number($('#adjStation').value);
                    const product = $('#adjProduct').value;
                    const item = inv.find(i => Number(i.station_id) === stationId && i.product_type === product);
                    const info = $('#adjCurrentInfo');
                    if (item) {
                        info.innerHTML =
                            '<div><strong>Current:</strong> Qty <strong>' + (item.quantity || 0).toFixed(2) +
                            ' L</strong> &nbsp;|&nbsp; ' +
                            'Cost <strong>' + formatMoney(item.cost_price || 0) + '</strong> &nbsp;|&nbsp; ' +
                            'Sell <strong>' + formatMoney(item.selling_price || 0) + '</strong></div>';
                        if ($('#adjCurrentQty')) $('#adjCurrentQty').value = Number(item.quantity || 0).toFixed(
                            2);
                        if ($('#adjNewQty') && !$('#adjNewQty').value) $('#adjNewQty').value = Number(item
                            .quantity || 0).toFixed(2);
                        if ($('#adjCost')) $('#adjCost').value = item.cost_price || '';
                        if ($('#adjSell')) $('#adjSell').value = item.selling_price || '';
                        updateQtyDelta();
                    } else {
                        info.innerHTML =
                            '<span class="text-warning">No inventory record found for this station/product</span>';
                        if ($('#adjCurrentQty')) $('#adjCurrentQty').value = '0';
                        if ($('#adjNewQty')) $('#adjNewQty').value = '';
                        if ($('#adjCost')) $('#adjCost').value = '';
                        if ($('#adjSell')) $('#adjSell').value = '';
                        updateQtyDelta();
                    }
                }

                function toggleAdjFields() {
                    const type = $('#adjType').value;
                    $('#adjQtySection').style.display = (type === 'quantity') ? 'block' : 'none';
                    $('#adjCostSection').style.display = (type === 'cost_price' || type === 'both_prices') ?
                        'block' : 'none';
                    $('#adjSellSection').style.display = (type === 'selling_price' || type === 'both_prices') ?
                        'block' : 'none';
                    const newQtyInput = $('#adjNewQty');
                    const costInput = $('#adjCost');
                    const sellInput = $('#adjSell');
                    if (newQtyInput) newQtyInput.required = (type === 'quantity');
                    if (costInput) costInput.required = (type === 'cost_price' || type === 'both_prices');
                    if (sellInput) sellInput.required = (type === 'selling_price' || type === 'both_prices');
                }

                $('#adjType').onchange = function() { toggleAdjFields();
                    updateCurrentInfo(); };
                $('#adjStation').onchange = function() {
                    if ($('#adjNewQty')) $('#adjNewQty').value = '';
                    updateCurrentInfo();
                };
                $('#adjProduct').onchange = function() {
                    if ($('#adjNewQty')) $('#adjNewQty').value = '';
                    updateCurrentInfo();
                };
                if ($('#adjNewQty')) $('#adjNewQty').oninput = updateQtyDelta;
                toggleAdjFields();
                setTimeout(updateCurrentInfo, 50);

                $('#adjForm').onsubmit = async function(e) {
                    e.preventDefault();
                    const stationId = Number($('#adjStation').value);
                    const product = $('#adjProduct').value;
                    const type = $('#adjType').value;
                    const reason = $('#adjReason').value.trim();
                    if (!reason) {
                        toast('Reason is required', 'warning');
                        return;
                    }

                    try {
                        showLoading(true);
                        const invDocId = stationId + '_' + product;
                        const current = inv.find(i => Number(i.station_id) === stationId && i.product_type ===
                            product);

                        if (type === 'quantity') {
                            const currentQty = parseFloat($('#adjCurrentQty').value) || 0;
                            const newQty = parseFloat($('#adjNewQty').value);
                            if (isNaN(newQty) || newQty < 0) {
                                toast('Enter a valid new quantity (0 or more)', 'warning');
                                showLoading(false);
                                return;
                            }
                            const qty = newQty - currentQty;
                            if (qty === 0) {
                                toast('New quantity is the same as current – no change needed', 'info');
                                showLoading(false);
                                return;
                            }
                            await adjustInventory(stationId, product, qty);
                            await addDoc('adjustments', {
                                station_id: stationId,
                                product_type: product,
                                adj_type: 'quantity',
                                quantity: qty,
                                old_quantity: currentQty,
                                new_quantity: newQty,
                                reason: reason,
                                created_by: state.user.id
                            });
                            await logAudit('stock_adjustment', { station: stationId, product, qty, old: currentQty,
                                new: newQty, reason });
                            toast('Quantity updated: ' + currentQty.toFixed(2) + ' L → ' + newQty.toFixed(2) +
                                ' L');
                        } else if (type === 'cost_price') {
                            const newCost = parseFloat($('#adjCost').value);
                            if (isNaN(newCost) || newCost < 0) {
                                toast('Enter a valid cost price', 'warning');
                                showLoading(false);
                                return;
                            }
                            const oldCost = current ? (current.cost_price || 0) : 0;
                            const ref = db.collection('inventory').doc(invDocId);
                            const snap = await ref.get();
                            if (!snap.exists) {
                                await ref.set({
                                    station_id: stationId,
                                    product_type: product,
                                    quantity: 0,
                                    cost_price: newCost,
                                    selling_price: 0,
                                    companyId: state.user.companyId,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            } else {
                                await ref.update({ cost_price: newCost,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp() });
                            }
                            await addDoc('adjustments', {
                                station_id: stationId,
                                product_type: product,
                                adj_type: 'cost_price',
                                old_cost: oldCost,
                                new_cost: newCost,
                                reason: reason,
                                created_by: state.user.id
                            });
                            await logAudit('cost_adjustment', { station: stationId, product, oldCost, newCost,
                                reason });
                            toast('Cost price updated: ' + formatMoney(oldCost) + ' → ' + formatMoney(
                            newCost));
                        } else if (type === 'selling_price') {
                            const newSell = parseFloat($('#adjSell').value);
                            if (isNaN(newSell) || newSell < 0) {
                                toast('Enter a valid selling price', 'warning');
                                showLoading(false);
                                return;
                            }
                            const oldSell = current ? (current.selling_price || 0) : 0;
                            const ref = db.collection('inventory').doc(invDocId);
                            const snap = await ref.get();
                            if (!snap.exists) {
                                await ref.set({
                                    station_id: stationId,
                                    product_type: product,
                                    quantity: 0,
                                    cost_price: 0,
                                    selling_price: newSell,
                                    companyId: state.user.companyId,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            } else {
                                await ref.update({ selling_price: newSell,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp() });
                            }
                            await addDoc('adjustments', {
                                station_id: stationId,
                                product_type: product,
                                adj_type: 'selling_price',
                                old_sell: oldSell,
                                new_sell: newSell,
                                reason: reason,
                                created_by: state.user.id
                            });
                            await logAudit('sell_adjustment', { station: stationId, product, oldSell, newSell,
                                reason });
                            toast('Selling price updated: ' + formatMoney(oldSell) + ' → ' + formatMoney(
                                newSell));
                        } else if (type === 'both_prices') {
                            const newCost = parseFloat($('#adjCost').value);
                            const newSell = parseFloat($('#adjSell').value);
                            if (isNaN(newCost) || newCost < 0 || isNaN(newSell) || newSell < 0) {
                                toast('Enter valid cost and selling prices', 'warning');
                                showLoading(false);
                                return;
                            }
                            const oldCost = current ? (current.cost_price || 0) : 0;
                            const oldSell = current ? (current.selling_price || 0) : 0;
                            const ref = db.collection('inventory').doc(invDocId);
                            const snap = await ref.get();
                            if (!snap.exists) {
                                await ref.set({
                                    station_id: stationId,
                                    product_type: product,
                                    quantity: 0,
                                    cost_price: newCost,
                                    selling_price: newSell,
                                    companyId: state.user.companyId,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            } else {
                                await ref.update({
                                    cost_price: newCost,
                                    selling_price: newSell,
                                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                            await addDoc('adjustments', {
                                station_id: stationId,
                                product_type: product,
                                adj_type: 'both_prices',
                                old_cost: oldCost,
                                new_cost: newCost,
                                old_sell: oldSell,
                                new_sell: newSell,
                                reason: reason,
                                created_by: state.user.id
                            });
                            await logAudit('price_adjustment', { station: stationId, product, oldCost, newCost,
                                oldSell, newSell, reason });
                            toast('Prices updated');
                        }
                        renderAdjustments();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    } finally {
                        showLoading(false);
                    }
                };

                document.querySelectorAll('.delete-adj-btn').forEach(btn => {
                    btn.onclick = async function() {
                        if (!confirm('Delete this adjustment record? (Does not reverse inventory)'))
                            return;
                        try {
                            await deleteDoc('adjustments', this.dataset.id);
                            toast('Adjustment record deleted');
                            renderAdjustments();
                        } catch (err) {
                            toast('Error: ' + err.message, 'danger');
                        }
                    };
                });
            }
        }

        console.log('Part 6 loaded');
    </script>
    <script>
        // ============================================================
        // Part 7a: Users, Activity Log, Company Profile + Backup
        // ============================================================

        async function renderUsers() {
            if (!canManageUsers(state.user.role)) {
                $('#pageContent').innerHTML =
                    '<div class="alert alert-danger">Access denied. Only Top Admin can manage users.</div>';
                return;
            }
            const users = await getAll('users');
            let stationOptions = '<option value="">— None —</option>';
            state.stations.forEach(s => {
                stationOptions += '<option value="' + s.id + '">' + s.name + '</option>';
            });

            let html = '<div class="row g-4">' +
                '<div class="col-lg-4"><div class="card-box">' +
                '<h5 class="mb-3"><i class="bi bi-person-plus"></i> Add New User</h5>' +
                '<form id="userForm">' +
                '<div class="mb-2"><label class="form-label small">Username *</label>' +
                '<input type="text" id="uUsername" class="form-control form-control-sm" required placeholder="e.g. john"></div>' +
                '<div class="mb-2"><label class="form-label small">Full Name</label>' +
                '<input type="text" id="uName" class="form-control form-control-sm" placeholder="John Doe"></div>' +
                '<div class="mb-2"><label class="form-label small">Password *</label>' +
                '<input type="text" id="uPass" class="form-control form-control-sm" required placeholder="Min 4 characters"></div>' +
                '<div class="mb-2"><label class="form-label small">Role</label>' +
                '<select id="uRole" class="form-select form-select-sm">' +
                '<option value="cashier">Cashier</option>' +
                '<option value="manager">Manager</option>' +
                '<option value="top_admin">Top Admin</option></select></div>' +
                '<div class="mb-2"><label class="form-label small">Station (for Cashiers)</label>' +
                '<select id="uStation" class="form-select form-select-sm">' + stationOptions +
                '</select></div>' +
                '<button type="submit" class="btn btn-primary w-100" id="createUserBtn">Create User</button>' +
                '</form><div id="userResult" class="mt-2 small"></div></div></div>' +
                '<div class="col-lg-8"><div class="card-box">' +
                '<h5 class="mb-3"><i class="bi bi-people"></i> All Users</h5>' +
                '<div class="table-responsive"><table class="table table-sm table-hover">' +
                '<thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Station</th><th>Actions</th></tr></thead><tbody>';

            users.forEach(u => {
                html += '<tr>' +
                    '<td><strong>' + u.username + '</strong></td>' +
                    '<td>' + (u.name || '—') + '</td>' +
                    '<td><span class="badge bg-secondary">' + u.role + '</span></td>' +
                    '<td>' + (u.station_id ? stationName(u.station_id) : 'All') + '</td>' +
                    '<td>' +
                    (u.id !== state.user.id ?
                        `<button class="btn btn-sm btn-outline-primary edit-user-btn me-1" data-id="${u.id}" data-username="${u.username}" data-name="${u.name || ''}" data-role="${u.role}" data-station="${u.station_id || ''}" title="Edit"><i class="bi bi-pencil"></i></button>` +
                        `<button class="btn btn-sm btn-outline-warning reset-pass-btn me-1" data-id="${u.id}" data-username="${u.username}" title="Reset Password"><i class="bi bi-key"></i></button>` +
                        `<button class="btn btn-sm btn-outline-danger del-user" data-id="${u.id}" title="Delete"><i class="bi bi-trash"></i></button>` :
                        '<span class="text-muted small">you</span>'
                    ) +
                    '</td></tr>';
            });

            html += '</tbody></table></div></div></div></div>';
            $('#pageContent').innerHTML = html;

            $('#userForm').onsubmit = async function(e) {
                e.preventDefault();
                $('#userResult').innerHTML = '';
                const submitBtn = document.getElementById('createUserBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating...';
                try {
                    const username = $('#uUsername').value.trim().toLowerCase();
                    const name = $('#uName').value.trim();
                    const password = $('#uPass').value.trim();
                    const role = $('#uRole').value;
                    const stationId = $('#uStation').value ? Number($('#uStation').value) : null;
                    if (password.length < 4) {
                        toast('Password must be at least 4 characters', 'warning');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Create User';
                        return;
                    }
                    const existing = await getAll('users');
                    if (existing.some(u => u.username === username)) {
                        toast('Username already exists', 'warning');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Create User';
                        return;
                    }
                    const hashed = await hashPassword(password);
                    await addDoc('users', {
                        username: username,
                        name: name || username,
                        password: hashed,
                        role: role,
                        station_id: stationId,
                        active: true
                    });
                    await logAudit('create_user', { username: username, role: role });
                    $('#userResult').innerHTML =
                        '<span class="text-success">✅ User created! Password: <strong>' + password +
                        '</strong></span>';
                    toast('User created successfully');
                    renderUsers();
                } catch (err) {
                    $('#userResult').innerHTML = '<span class="text-danger">❌ Error: ' + err.message +
                    '</span>';
                    toast('Failed to create user: ' + err.message, 'danger');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create User';
                }
            };

            document.querySelectorAll('.edit-user-btn').forEach(btn => {
                btn.onclick = function() {
                    const id = this.dataset.id;
                    const username = this.dataset.username;
                    const name = this.dataset.name;
                    const role = this.dataset.role;
                    const station = this.dataset.station;
                    const newName = prompt('Edit Full Name:', name);
                    if (newName === null) return;
                    const newRole = prompt('Edit Role (cashier/manager/top_admin):', role);
                    if (newRole === null) return;
                    const newStation = prompt('Edit Station ID (leave blank for none):', station || '');
                    const stationId = newStation ? Number(newStation) : null;
                    if (!['cashier', 'manager', 'top_admin'].includes(newRole)) {
                        toast('Invalid role. Use: cashier, manager, or top_admin', 'danger');
                        return;
                    }
                    updateDoc('users', id, {
                        name: newName || username,
                        role: newRole,
                        station_id: stationId
                    }).then(() => {
                        toast('User updated!', 'success');
                        renderUsers();
                    }).catch(err => toast('Error: ' + err.message, 'danger'));
                };
            });

            document.querySelectorAll('.del-user').forEach(btn => {
                btn.onclick = async function() {
                    const id = btn.getAttribute('data-id');
                    if (id === state.user.id) {
                        toast('You cannot delete your own account!', 'danger');
                        return;
                    }
                    if (!confirm('Delete this user permanently?')) return;
                    try {
                        await deleteDoc('users', id);
                        await logAudit('delete_user', { userId: id });
                        toast('User deleted');
                        renderUsers();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            });

            document.querySelectorAll('.reset-pass-btn').forEach(btn => {
                btn.onclick = async function() {
                    const id = this.dataset.id;
                    const username = this.dataset.username;
                    const newPass = prompt('Enter new password for "' + username +
                    '" (min 4 characters):');
                    if (newPass === null) return;
                    if (!newPass || newPass.length < 4) {
                        toast('Password must be at least 4 characters', 'warning');
                        return;
                    }
                    if (!confirm('Reset password for "' + username + '"?')) return;
                    try {
                        const hashed = await hashPassword(newPass);
                        await updateDoc('users', id, {
                            password: hashed,
                            password_updated_at: firebase.firestore.FieldValue.serverTimestamp(),
                            password_reset_by: state.user.id
                        });
                        await logAudit('reset_password', { targetUserId: id, targetUsername: username });
                        toast('Password reset for ' + username + '. New password: ' + newPass, 'success');
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            });
        }

        async function renderActivityLog() {
            if (!canManageUsers(state.user.role)) {
                $('#pageContent').innerHTML =
                    '<div class="alert alert-danger">Access denied. Only Top Admin can view logs.</div>';
                return;
            }
            const logs = await getAll('audit_logs');
            const users = await getAll('users');
            logs.sort((a, b) => (b.timestamp && b.timestamp.seconds || 0) - (a.timestamp && a.timestamp.seconds || 0));

            let html = `
              <div class="card-box">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 class="mb-0"><i class="bi bi-activity"></i> Activity Log</h5>
                  <span class="badge bg-secondary">${logs.length} events</span>
                </div>
                <div class="mb-3">
                  <input type="text" id="logSearch" class="form-control form-control-sm" placeholder="Search logs...">
                </div>
                <div class="table-responsive" style="max-height:500px; overflow-y:auto;">
                  <table class="table table-sm table-hover">
                    <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
                    <tbody id="logBody">`;

            if (logs.length === 0) {
                html += '<tr><td colspan="4" class="text-muted text-center">No activity logs found</td></tr>';
            } else {
                logs.slice(0, 100).forEach(log => {
                    const user = users.find(u => u.id === log.user_id);
                    const username = user ? (user.name || user.username) : (log.username || 'System');
                    const details = typeof log.details === 'string' ? log.details : JSON.stringify(log
                        .details || {});
                    html += `<tr>
                    <td class="fs-xs">${formatDateTime(log.timestamp)}</td>
                    <td><strong>${username}</strong></td>
                    <td><span class="badge bg-secondary">${log.action}</span></td>
                    <td class="fs-xs">${details}</td>
                  </tr>`;
                });
            }

            html += `</tbody></table></div>
                <div class="text-end mt-2">
                  <button class="btn btn-sm btn-outline-secondary" id="refreshLogs"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                  <button class="btn btn-sm btn-outline-danger" id="clearLogs"><i class="bi bi-trash"></i> Clear All</button>
                </div>
              </div>`;

            $('#pageContent').innerHTML = html;
            $('#logSearch').oninput = function() {
                const query = this.value.toLowerCase();
                document.querySelectorAll('#logBody tr').forEach(row => {
                    row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
                });
            };
            $('#refreshLogs').onclick = function() { renderActivityLog();
                toast('Refreshed', 'info'); };
            $('#clearLogs').onclick = async function() {
                if (!confirm('Delete ALL activity logs?')) return;
                try {
                    const allLogs = await getAll('audit_logs');
                    for (let log of allLogs) await deleteDoc('audit_logs', log.id);
                    await logAudit('clear_logs', { clearedBy: state.user.username });
                    toast('All logs cleared', 'success');
                    renderActivityLog();
                } catch (err) {
                    toast('Error: ' + err.message, 'danger');
                }
            };
        }

        console.log('Part 7a loaded');
    </script>
    <script>
        // ============================================================
        // Part 7b: Financials, Receipts, Customers
        // ============================================================

        async function renderFinancials() {
            const accounts = await getAll('bank_accounts');
            const bankings = (await getAll('bankings'))
                .filter(b => !state.currentStationId || Number(b.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
            const expenses = (await getAll('expenses'))
                .filter(e => !state.currentStationId || Number(e.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));

            let accountOptions = '<option value="">Select Account</option>';
            accountOptions += '<option value="petty_cash">💰 Petty Cash</option>';
            accounts.forEach(a => {
                accountOptions += '<option value="' + a.id + '">🏦 ' + a.bank_name + ' – ' + a.account_number +
                    '</option>';
            });

            let depositSourceOptions =
                '<option value="cash_till">Cash Till</option><option value="petty_cash">Petty Cash</option>';
            accounts.forEach(a => {
                depositSourceOptions += '<option value="' + a.id + '">🏦 ' + a.bank_name + '</option>';
            });

            let html = '<div class="row g-4">' +
                '<div class="col-lg-5">' +
                '<div class="card-box mb-3"><h5 class="mb-3"><i class="bi bi-bank"></i> Add Bank Account</h5><form id="baForm">' +
                '<div class="mb-2"><input id="baName" class="form-control form-control-sm" placeholder="Bank Name *" required></div>' +
                '<div class="mb-2"><input id="baAccName" class="form-control form-control-sm" placeholder="Account Name *" required></div>' +
                '<div class="mb-2"><input id="baAccNum" class="form-control form-control-sm" placeholder="Account Number *" required></div>' +
                '<div class="mb-2"><input id="baBranch" class="form-control form-control-sm" placeholder="Branch"></div>' +
                '<button class="btn btn-primary w-100">Add Account</button></form></div>' +

                '<div class="card-box mb-3"><h5 class="mb-3"><i class="bi bi-arrow-up-circle"></i> Record Banking (Deposit)</h5><form id="bankForm">' +
                '<div class="mb-2"><label class="form-label small">Source Account</label>' +
                '<select id="bfSource" class="form-select form-select-sm" required>' + depositSourceOptions +
                '</select></div>' +
                '<div class="mb-2"><label class="form-label small">Destination Bank Account</label>' +
                '<select id="bfAccount" class="form-select form-select-sm" required>' +
                '<option value="">Select Bank Account</option>';

            accounts.forEach(a => {
                html += '<option value="' + a.id + '">' + a.bank_name + ' – ' + a.account_number + '</option>';
            });

            html += '</select></div>' +
                '<div class="mb-2"><input id="bfDepositor" class="form-control form-control-sm" placeholder="Deposited By *" required></div>' +
                '<div class="mb-2"><input type="number" id="bfAmount" class="form-control form-control-sm" placeholder="Amount *" step="100" required></div>' +
                '<div class="mb-2"><input id="bfDesc" class="form-control form-control-sm" placeholder="Description"></div>' +
                '<button class="btn btn-success w-100">Record Deposit</button></form></div>' +

                '<div class="card-box"><h5 class="mb-3"><i class="bi bi-arrow-down-circle"></i> Record Expense / Payment</h5><form id="expForm">' +
                '<div class="mb-2"><label class="form-label small">Source Account</label>' +
                '<select id="expSource" class="form-select form-select-sm" required>' + accountOptions +
                '</select></div>' +
                '<div class="mb-2"><input id="expDesc" class="form-control form-control-sm" placeholder="Description *" required></div>' +
                '<div class="mb-2"><input type="number" id="expAmount" class="form-control form-control-sm" placeholder="Amount *" step="100" required></div>' +
                '<div class="mb-2"><label class="form-label small">Category</label>' +
                '<select id="expCategory" class="form-select form-select-sm">' +
                '<option value="salary">💰 Salary</option>' +
                '<option value="operations">⚙️ Operations</option>' +
                '<option value="utilities">💡 Utilities</option>' +
                '<option value="maintenance">🔧 Maintenance</option>' +
                '<option value="petty_cash">🧾 Petty Cash</option>' +
                '<option value="vendor_payment">🏷️ Vendor Payment</option>' +
                '<option value="other">📁 Other</option></select></div>' +
                '<button class="btn btn-danger w-100">Record Expense</button></form></div></div>' +

                '<div class="col-lg-7">' +
                '<div class="card-box mb-3"><h5><i class="bi bi-bank"></i> Bank Accounts</h5>' +
                '<table class="table table-sm"><thead><tr><th>Bank</th><th>Account</th><th>Number</th><th>Balance</th><th>Actions</th></tr></thead><tbody>';

            if (accounts.length === 0) {
                html += '<tr><td colspan="5" class="text-muted text-center">No accounts</td></tr>';
            } else {
                accounts.forEach(a => {
                    const bal = Number(a.balance) || 0;
                    const canDelete = bal <= 0;
                    html += '<tr>' +
                        '<td>' + a.bank_name + '</td>' +
                        '<td>' + a.account_name + '</td>' +
                        '<td>' + a.account_number + '</td>' +
                        '<td>' + formatMoney(bal) + '</td>' +
                        '<td>' +
                        (canDelete ?
                            '<button class="btn btn-sm btn-outline-danger delete-account-btn" data-id="' +
                            a.id + '"><i class="bi bi-trash"></i></button>' :
                            '<button class="btn btn-sm btn-outline-secondary" disabled title="Account has balance"><i class="bi bi-lock"></i></button>'
                            ) +
                        '</td></tr>';
                });
            }

            html += '</tbody></table></div>' +
                '<div class="card-box mb-3"><h5><i class="bi bi-arrow-up-circle"></i> Banking History</h5>' +
                '<table class="table table-sm"><thead><tr><th>From</th><th>To</th><th>Depositor</th><th>Amount</th><th>Date</th></tr></thead><tbody>';

            if (bankings.length === 0) {
                html += '<tr><td colspan="5" class="text-muted text-center">No bankings</td></tr>';
            } else {
                bankings.slice(0, 15).forEach(b => {
                    const acc = accounts.find(a => a.id === b.bank_account_id);
                    let fromLabel = 'Unknown';
                    if (b.source_account === 'cash_till') fromLabel = 'Cash Till';
                    else if (b.source_account === 'petty_cash') fromLabel = 'Petty Cash';
                    else {
                        const src = accounts.find(a => a.id === b.source_account);
                        if (src) fromLabel = src.bank_name;
                    }
                    html += '<tr><td>' + fromLabel + '</td><td>' + (acc ? acc.bank_name : '—') + '</td><td>' + (b
                        .depositor || '—') +
                        '</td><td>' + formatMoney(b.amount) + '</td><td class="fs-xs">' + formatDate(b
                        .created_at) + '</td></tr>';
                });
            }

            html += '</tbody></table></div>' +
                '<div class="card-box"><h5><i class="bi bi-arrow-down-circle"></i> Recent Expenses / Payments</h5>' +
                '<table class="table table-sm"><thead><tr><th>Source</th><th>Description</th><th>Category</th><th>Amount</th><th>Date</th></tr></thead><tbody>';

            if (expenses.length === 0) {
                html += '<tr><td colspan="5" class="text-muted text-center">No expenses</td></tr>';
            } else {
                expenses.slice(0, 15).forEach(e => {
                    let sourceLabel = 'Unknown';
                    if (e.source_account === 'petty_cash') sourceLabel = 'Petty Cash';
                    else {
                        const acc = accounts.find(a => a.id === e.source_account);
                        if (acc) sourceLabel = acc.bank_name;
                    }
                    html += '<tr><td>' + sourceLabel + '</td><td>' + (e.description || '—') +
                        '</td><td><span class="badge bg-secondary">' +
                        (e.category || 'other') + '</span></td><td class="text-danger">' + formatMoney(e
                            .amount) +
                        '</td><td class="fs-xs">' + formatDate(e.created_at) + '</td></tr>';
                });
            }

            html += '</tbody></table></div></div></div>';
            $('#pageContent').innerHTML = html;

            $('#baForm').onsubmit = async function(e) {
                e.preventDefault();
                const bankName = $('#baName').value.trim();
                const accName = $('#baAccName').value.trim();
                const accNum = $('#baAccNum').value.trim();
                const branch = $('#baBranch').value.trim();
                if (!bankName || !accName || !accNum) {
                    toast('Fill all required fields', 'warning');
                    return;
                }
                try {
                    await addDoc('bank_accounts', {
                        bank_name: bankName,
                        account_name: accName,
                        account_number: accNum,
                        branch: branch || '',
                        currency: 'UGX',
                        balance: 0
                    });
                    await logAudit('add_bank_account', { bank: bankName });
                    toast('Bank account added');
                    renderFinancials();
                } catch (err) {
                    toast('Error: ' + err.message, 'danger');
                }
            };

            document.querySelectorAll('.delete-account-btn').forEach(btn => {
                btn.onclick = async function() {
                    const id = this.dataset.id;
                    const acc = accounts.find(a => a.id === id);
                    if (acc && (Number(acc.balance) || 0) > 0) {
                        toast('Cannot delete account that still has a balance.', 'warning');
                        return;
                    }
                    if (!confirm('Delete this bank account permanently?')) return;
                    try {
                        await deleteDoc('bank_accounts', id);
                        toast('Account deleted');
                        renderFinancials();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            });

            $('#bankForm').onsubmit = async function(e) {
                e.preventDefault();
                const source = $('#bfSource').value;
                const accId = $('#bfAccount').value;
                const amount = parseFloat($('#bfAmount').value);
                const depositor = $('#bfDepositor').value.trim();
                if (!accId || !amount || amount <= 0) {
                    toast('Fill required fields', 'warning');
                    return;
                }
                try {
                    await addDoc('bankings', {
                        station_id: state.currentStationId || 1,
                        source_account: source,
                        bank_account_id: accId,
                        depositor: depositor,
                        amount: amount,
                        description: $('#bfDesc').value.trim() || null,
                        created_by: state.user.id
                    });
                    const acc = await getDoc('bank_accounts', accId);
                    if (acc) {
                        await updateDoc('bank_accounts', accId, { balance: (acc.balance || 0) + amount });
                    }
                    if (source !== 'cash_till' && source !== 'petty_cash') {
                        const srcAcc = await getDoc('bank_accounts', source);
                        if (srcAcc) {
                            await updateDoc('bank_accounts', source, { balance: (srcAcc.balance || 0) -
                                amount });
                        }
                    }
                    await logAudit('record_banking', { source: source, account: accId, amount: amount });
                    toast('Banking recorded');
                    renderFinancials();
                } catch (err) {
                    toast('Error: ' + err.message, 'danger');
                }
            };

            $('#expForm').onsubmit = async function(e) {
                e.preventDefault();
                const source = $('#expSource').value;
                const desc = $('#expDesc').value.trim();
                const amount = parseFloat($('#expAmount').value);
                const category = $('#expCategory').value;
                if (!source || !desc || !amount || amount <= 0) {
                    toast('Fill all required fields', 'warning');
                    return;
                }
                try {
                    await addDoc('expenses', {
                        station_id: state.currentStationId || 1,
                        source_account: source,
                        description: desc,
                        amount: amount,
                        category: category,
                        created_by: state.user.id
                    });

                                amount });

        async function renderReceiptHistory() {
            const sales = (await getAll('sales'))
                .filter(s => !state.currentStationId || Number(s.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));

            let html = `
              <div class="card-box">
                <h5 class="mb-3"><i class="bi bi-receipt"></i> Receipt History</h5>
                <div class="mb-3">
                  <input type="text" id="receiptSearch" class="form-control form-control-sm" placeholder="Search by transaction ID, customer, or product...">
                </div>
                <div class="table-responsive" style="max-height:500px; overflow-y:auto;">
                  <table class="table table-sm table-hover">
                    <thead><tr><th>Receipt #</th><th>Station</th><th>Items</th><th>Total</th><th>Payment</th><th>Customer</th><th>Date</th><th>Actions</th></tr></thead>
                    <tbody>`;

            const grouped = {};
            sales.forEach(s => {
                const tid = s.transaction_id || s.id;
                if (!grouped[tid]) {
                    grouped[tid] = {
                        transactionId: tid,
                        station: s.station_id,
                        items: [],
                        total: 0,
                        payment: s.payment_method || 'cash',
                        customer: s.customer_name || 'Walk-in',
                        date: s.sale_date || s.created_at
                    };
                }
                grouped[tid].items.push({
                    product: s.product_type,
                    qty: s.quantity,
                    price: s.selling_price,
                    amount: s.amount
                });
                grouped[tid].total += Number(s.amount) || 0;
            });

            const groupedArray = Object.values(grouped);
            if (groupedArray.length === 0) {
                html += '<tr><td colspan="8" class="text-center text-muted">No receipts found</td></tr>';
            } else {
                groupedArray.slice(0, 50).forEach(g => {
                    const itemsList = g.items.map(i => i.product + ' ' + i.qty + 'L').join(', ');
                    html += `<tr>
                    <td><strong>#${String(g.transactionId).slice(0, 8)}</strong></td>
                    <td>${stationName(g.station)}</td>
                    <td class="fs-xs">${itemsList}</td>
                    <td><strong>${formatMoney(g.total)}</strong></td>
                    <td><span class="badge bg-secondary">${g.payment}</span></td>
                    <td>${g.customer}</td>
                    <td class="fs-xs">${formatDate(g.date)}</td>
                    <td>
                      <button class="btn btn-sm btn-outline-primary reprint-btn" data-data='${JSON.stringify(g).replace(/'/g, "&#39;")}'>
                        <i class="bi bi-printer"></i>
                      </button>
                    </td>
                  </tr>`;
                });
            }

            html += `</tbody></table></div></div>`;
            $('#pageContent').innerHTML = html;

            $('#receiptSearch').oninput = function() {
                const query = this.value.toLowerCase();
                document.querySelectorAll('#pageContent tbody tr').forEach(row => {
                    row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
                });
            };

            document.querySelectorAll('.reprint-btn').forEach(btn => {
                btn.onclick = function() {
                    const data = JSON.parse(this.dataset.data);
                    printReceipt({
                        transactionId: data.transactionId,
                        items: data.items,
                        total: data.total,
                        payment: data.payment,
                        customer: data.customer,
                        station: stationName(data.station),
                        date: formatDate(data.date)
                    });
                };
            });
        }

        // Alias used by navigation
        async function renderReceipts() { return renderReceiptHistory(); }
        async function renderActivity() { return renderActivityLog(); }
