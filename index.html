<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetroManager Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>
    <style>
        :root {
            --sidebar-w: 260px;
            --header-h: 60px;
            --bg: #f0f2f6;
            --sidebar-bg: #0b1a33;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            height: 100dvh;
            background: var(--sidebar-bg);
            color: #b0c4de;
            z-index: 1050;
            display: flex;
            flex-direction: column;
            transition: transform .3s;
            overflow: hidden;
        }
        .sidebar-brand {
            padding: 18px 20px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            background: rgba(255, 255, 255, .05);
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }
        .sidebar-brand i {
            font-size: 1.7rem;
            color: #ffc107;
        }
        #sidebarNav {
            flex: 1 1 0;
            overflow-y: auto !important;
            overflow-x: hidden;
            min-height: 0;
            max-height: 100%;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding-top: 8px;
            padding-bottom: 12px;
        }
        #sidebarNav::-webkit-scrollbar {
            width: 6px;
        }
        #sidebarNav::-webkit-scrollbar-track {
            background: transparent;
        }
        #sidebarNav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
        }
        #sidebarNav::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        .sidebar .nav-link {
            color: #b0c4de;
            padding: 11px 20px;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            cursor: pointer;
            flex-shrink: 0;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, .07);
            color: #fff;
            border-left-color: #ffc107;
        }
        .sidebar .nav-link i {
            width: 22px;
            font-size: 1.15rem;
        }
        .sidebar-footer {
            margin-top: 0;
            padding: 14px 18px;
            border-top: 1px solid rgba(255, 255, 255, .07);
            font-size: .85rem;
            flex: 0 0 auto;
            background: var(--sidebar-bg);
        }
        .main-content {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
        }
        .top-header {
            height: var(--header-h);
            background: #fff;
            border-bottom: 1px solid #e9ecef;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1040;
        }
        .page-title {
            font-weight: 600;
            font-size: 1.15rem;
            color: #1a2a4a;
        }
        .page-content {
            padding: 22px 24px;
        }
        .card-box {
            background: #fff;
            border-radius: 12px;
            padding: 18px 20px;
            border: 1px solid #eef0f3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #eef0f3;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .stat-item .icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.25rem;
        }
        .stat-item .num {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a2a4a;
        }
        .stat-item .lbl {
            font-size: .8rem;
            color: #6c7a8e;
        }
        .hero {
            background: linear-gradient(135deg, #0b1a33, #1a3a6a);
            border-radius: 14px;
            padding: 24px 28px;
            color: #fff;
            margin-bottom: 20px;
        }
        .hero .company {
            font-size: 1.55rem;
            font-weight: 700;
            color: #ffc107;
        }
        .hero .tag {
            opacity: .85;
            font-size: .9rem;
        }
        .hero .details {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 26px;
            margin-top: 10px;
            font-size: .87rem;
        }
        .hero .details i {
            color: #ffc107;
        }
        .badge-day {
            background: #fff3cd;
            color: #856404;
            padding: 3px 11px;
            border-radius: 20px;
            font-size: .71rem;
            font-weight: 600;
        }
        .badge-night {
            background: #d1ecf1;
            color: #0c5460;
            padding: 3px 11px;
            border-radius: 20px;
            font-size: .71rem;
            font-weight: 600;
        }
        .badge-active {
            background: #d4edda;
            color: #155724;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: .7rem;
            font-weight: 600;
        }
        .badge-closed {
            background: #f8d7da;
            color: #721c24;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: .7rem;
            font-weight: 600;
        }
        .product-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: .72rem;
            font-weight: 600;
        }
        .product-badge.petrol {
            background: #cfe2ff;
            color: #084298;
        }
        .product-badge.diesel {
            background: #f8d7da;
            color: #58151c;
        }
        .product-badge.gas {
            background: #d1ecf1;
            color: #0c5460;
        }
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0b1a33, #1a3a6a);
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 18px;
            padding: 36px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-card .logo i {
            font-size: 2.8rem;
            color: #ffc107;
            background: #0b1a33;
            padding: 12px;
            border-radius: 14px;
        }
        .fs-xs {
            font-size: .78rem;
        }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, .75);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 2.2rem;
            height: 2.2rem;
            border: .25em solid #0d6efd;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
            .sidebar-toggle {
                display: inline-block !important;
            }
        }
        @media (min-width: 769px) {
            .sidebar-toggle {
                display: none !important;
            }
        }
        .report-filter .form-label {
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 2px;
        }
        .report-filter .form-control,
        .report-filter .form-select {
            font-size: 0.85rem;
        }
        .table-report thead th {
            background: #f8f9fa;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-report td {
            font-size: 0.85rem;
        }
        .profit-positive {
            color: #198754;
            font-weight: 700;
        }
        .profit-negative {
            color: #dc3545;
            font-weight: 700;
        }
        #offlineBanner {
            display: none;
            background: #dc3545;
            color: #fff;
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 99999;
        }
        body.offline #offlineBanner {
            display: block;
        }
        body.offline .main-content {
            padding-top: 40px;
        }
        .edit-inline {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .edit-inline input {
            width: 70px;
            padding: 2px 4px;
            font-size: 0.8rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        .edit-inline .btn-sm {
            font-size: 0.7rem;
            padding: 2px 8px;
        }
        .cart-edit-mode td {
            background: #fff9e6;
        }
        .item-edit-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .item-edit-actions .btn {
            font-size: 0.7rem;
            padding: 2px 8px;
        }
        .modal-content {
            border-radius: 14px;
        }
        .modal-header {
            background: #0b1a33;
            color: #fff;
            border-radius: 14px 14px 0 0;
        }
        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }
        .quick-action-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .quick-action-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        .discount-row {
            background: #fff8e1;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div id="offlineBanner"><i class="bi bi-wifi-off"></i> You are offline – showing cached data only</div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-wrap">
        <div class="login-card">
            <div class="logo">
                <i class="bi bi-fuel-pump"></i>
                <h4 class="mt-2 mb-0 fw-bold">PetroManager Pro</h4>
                <p class="text-muted small mb-0">Multi-Company Fuel Management</p>
            </div>

            <div id="normalLogin">
                <form id="loginForm" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Company</label>
                        <select id="loginCompany" class="form-select form-select-lg" required>
                            <option value="">— Select Company —</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <select id="loginUsername" class="form-select form-select-lg" required>
                            <option value="">— Select User —</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" id="loginPassword" class="form-control form-control-lg" required placeholder="Enter password" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn">Sign In</button>
                    <div id="loginError" class="text-danger text-center mt-3 small" style="display:none;"></div>
                </form>
                <div class="mt-4 text-center">
                    <button type="button" id="showCreateCompanyBtn" class="btn btn-outline-warning btn-sm">Create First Company</button>
                </div>
            </div>

            <div id="createCompanyForm" style="display:none;">
                <h5 class="mb-3 text-center">Create First Company</h5>
                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" id="newCompName" class="form-control" placeholder="e.g. GIMIX Fuel">
                </div>
                <div class="mb-3">
                    <label class="form-label">Tagline</label>
                    <input type="text" id="newCompTagline" class="form-control" placeholder="Fueling Uganda">
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" id="newCompAddress" class="form-control" placeholder="Kampala, Uganda">
                </div>
                <div class="mb-3">
                    <label class="form-label">Admin Username</label>
                    <input type="text" id="newCompAdminUser" class="form-control" placeholder="admin">
                </div>
                <div class="mb-3">
                    <label class="form-label">Admin Password</label>
                    <input type="password" id="newCompAdminPass" class="form-control" placeholder="Min 4 characters">
                </div>
                <button type="button" id="createCompanyBtn" class="btn btn-warning w-100">Create Company & Admin</button>
                <button type="button" id="cancelCreateCompanyBtn" class="btn btn-outline-secondary w-100 mt-2">Cancel</button>
                <div id="createCompanyResult" class="text-center mt-3 small"></div>
            </div>

            <div class="mt-3 d-flex gap-2 justify-content-center">
                <button type="button" id="diagnoseBtn" class="btn btn-sm btn-outline-info">Diagnose</button>
            </div>
            <div id="diagnoseBox" class="mt-3 p-2 bg-light rounded small" style="display:none;"></div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="appMain" style="display:none;">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="bi bi-fuel-pump"></i> PetroManager</div>
            <div id="sidebarNav"></div>
            <div class="sidebar-footer">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle"></i>
                    <span id="sidebarUser">—</span>
                    <span class="ms-auto badge bg-secondary" id="sidebarRole">—</span>
                </div>
            </div>
        </nav>

        <div class="main-content">
            <header class="top-header">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light sidebar-toggle p-1" id="sidebarToggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <span class="page-title" id="pageTitle">Dashboard</span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <select id="stationSelector" class="form-select form-select-sm" style="max-width:180px;">
                        <option value="">All Stations</option>
                    </select>
                    <div class="dropdown">
                        <div class="d-flex align-items-center gap-2" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="cursor:pointer;">
                            <span class="fw-semibold d-none d-md-inline" id="headerUser">—</span>
                            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:36px;height:36px;" id="headerAvatar">U</div>
                            <i class="bi bi-chevron-down text-muted small"></i>
                        </div>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><span class="dropdown-item-text text-muted small" id="headerRole">—</span></li>
                            <li><span class="dropdown-item-text text-muted small" id="headerCompany">—</span></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" id="headerSwitchUser"><i class="bi bi-arrow-repeat"></i> Switch User</a></li>
                            <li><a class="dropdown-item text-danger" id="headerLogout"><i class="bi bi-box-arrow-right"></i> Sign Out</a></li>
                        </ul>
                    </div>
                </div>
            </header>
            <div class="page-content" id="pageContent">
                <div class="text-center py-5">
                    <div class="spinner text-primary"></div>
                    <p class="mt-3 text-muted">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="editModalBody">
                    <div class="text-center py-3"><div class="spinner"></div></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="editModalSave">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        // ============================================================
        // Part 2: Firebase Config & Core Utilities
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyCWyrW4xa4i1X3D6uzEPbKfFbwEBU0UVbk",
            authDomain: "petrol-59a19.firebaseapp.com",
            projectId: "petrol-59a19",
            storageBucket: "petrol-59a19.firebasestorage.app",
            messagingSenderId: "195467455062",
            appId: "1:195467455062:web:288de1c059ca60a2e769f7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.enablePersistence({ synchronizeTabs: true }).catch(err => console.warn('Persistence not enabled', err));

        const state = {
            user: null,
            stations: [],
            currentStationId: null,
            currentPage: 'dashboard',
            isOnline: navigator.onLine,
            companies: [],
            cashiers: []
        };

        function $(sel) { return document.querySelector(sel); }

        function $$(sel) { return document.querySelectorAll(sel); }

        function toast(msg, type = 'success') {
            const colors = {
                success: 'bg-success',
                danger: 'bg-danger',
                warning: 'bg-warning text-dark',
                info: 'bg-info text-dark'
            };
            const el = document.createElement('div');
            el.className = `toast align-items-center text-white ${colors[type] || colors.info} border-0 show`;
            el.innerHTML =
                `<div class="d-flex"><div class="toast-body">${msg}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
            $('.toast-container').appendChild(el);
            setTimeout(() => el.remove(), 4500);
        }

        function formatMoney(n) {
            return 'UGX ' + (Number(n) || 0).toLocaleString();
        }

        function formatDate(d) {
            if (!d) return '—';
            const dt = d.toDate ? d.toDate() : new Date(d);
            return dt.toLocaleDateString('en-GB');
        }

        function formatDateTime(d) {
            if (!d) return '—';
            const dt = d.toDate ? d.toDate() : new Date(d);
            return dt.toLocaleString('en-GB');
        }

        function roleNorm(r) {
            if (!r) return 'cashier';
            const x = String(r).toLowerCase().trim();
            if (x === 'super_admin' || x === 'super admin') return 'super_admin';
            if (x === 'top_admin' || x === 'top admin') return 'top_admin';
            if (x === 'admin') return 'admin';
            if (x === 'manager') return 'manager';
            return 'cashier';
        }

        function isAdmin(r) {
            return ['super_admin', 'top_admin', 'admin', 'manager'].includes(roleNorm(r));
        }

        function canManageUsers(r) {
            return ['super_admin', 'top_admin'].includes(roleNorm(r));
        }

        function canManageCompany(r) {
            return ['super_admin', 'top_admin'].includes(roleNorm(r));
        }

        function stationName(id) {
            const s = state.stations.find(st => Number(st.id) === Number(id));
            return s ? s.name : 'Unknown';
        }

        function showLoading(show) {
            let ov = $('#loadingOverlay');
            if (show) {
                if (!ov) {
                    ov = document.createElement('div');
                    ov.id = 'loadingOverlay';
                    ov.className = 'loading-overlay';
                    ov.innerHTML = '<div class="spinner"></div>';
                    document.body.appendChild(ov);
                }
            } else if (ov) {
                ov.remove();
            }
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode('PetroManagerSalt_' + password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return 'pm_' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function createCompany(companyData) {
            const ref = await db.collection('companies').add({
                name: companyData.name,
                tagline: companyData.tagline || '',
                address: companyData.address || '',
                phone: companyData.phone || '',
                email: companyData.email || '',
                tax_id: companyData.tax_id || '',
                website: companyData.website || '',
                logo_url: companyData.logo_url || '',
                created_at: firebase.firestore.FieldValue.serverTimestamp(),
                created_by: state.user ? state.user.id : null,
                active: true
            });
            return ref.id;
        }

        async function getCompany(companyId) {
            const doc = await db.collection('companies').doc(companyId).get();
            return doc.exists ? { id: doc.id, ...doc.data() } : null;
        }

        async function updateCompany(companyId, data) {
            await db.collection('companies').doc(companyId).set({
                ...data,
                updated_at: firebase.firestore.FieldValue.serverTimestamp(),
                updated_by: state.user ? state.user.id : null
            }, { merge: true });
        }

        async function getAllCompanies() {
            const snap = await db.collection('companies').get();
            return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        function getCompanyFilter() {
            if (state.user && state.user.role === 'super_admin') return null;
            return state.user ? state.user.companyId : null;
        }

        async function getAll(col, queryFn = null) {
            let ref = db.collection(col);
            const companyId = getCompanyFilter();
            if (companyId) ref = ref.where('companyId', '==', companyId);
            if (queryFn) ref = queryFn(ref);
            const snap = await ref.get();
            return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        async function getDoc(col, id) {
            const d = await db.collection(col).doc(String(id)).get();
            return d.exists ? Object.assign({ id: d.id }, d.data()) : null;

        async function addDoc(col, data) {
            const companyId = state.user ? state.user.companyId : null;
            const ref = await db.collection(col).add({
                ...data,
                companyId: companyId,
                created_at: firebase.firestore.FieldValue.serverTimestamp(),
                created_by: state.user ? state.user.id : null
            });
            return ref.id;

        async function updateDoc(col, id, data) {
            const ref = db.collection(col).doc(String(id));
            const doc = await ref.get();
            if (!doc.exists) throw new Error(`Document ${id} not found in ${col}`);
            await ref.update(data);
        }

        async function deleteDoc(col, id) {
            const ref = db.collection(col).doc(String(id));
            const doc = await ref.get();
            if (!doc.exists) throw new Error(`Document ${id} not found in ${col}`);
            await ref.delete();
        }

        async function adjustInventory(stationId, product, delta, costPrice = null) {
            const ref = db.collection('inventory').doc(`${stationId}_${product}`);
            return db.runTransaction(async (tx) => {
                const doc = await tx.get(ref);
                let currentQty = 0;
                let currentCost = 0;
                if (doc.exists) {
                    currentQty = doc.data().quantity || 0;
                    currentCost = doc.data().cost_price || 0;
                }
                const newQty = currentQty + delta;
                if (newQty < 0) throw new Error(`Insufficient stock for ${product}. Available: ${currentQty.toFixed(2)} L`);
                const newCost = (costPrice !== null && costPrice !== undefined) ? costPrice : currentCost;
                tx.set(ref, {
                    station_id: Number(stationId),
                    product_type: product,
                    quantity: newQty,
                    cost_price: newCost,
                    selling_price: doc.exists ? (doc.data().selling_price || 0) : 0,
                    companyId: state.user ? state.user.companyId : null,
                    last_updated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                return newQty;
            });
        }

        async function downloadCompanyBackup() {
            if (!state.user || !state.user.companyId) {
                throw new Error('No company selected');
            }
            const companyId = state.user.companyId;
            const company = await getCompany(companyId);
            const payload = {
                version: 1,
                exported_at: new Date().toISOString(),
                companyId: companyId,
                company: company,
                collections: {}
            };
            for (const col of BACKUP_COLLECTIONS) {
                payload.collections[col] = await getAll(col);
            }
            const json = JSON.stringify(payload, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const safeName = (company && company.name) ? company.name.replace(/[^a-z0-9]/gi, '_') : companyId;
            const name = 'petromanager_backup_' + safeName + '_' + new Date().toISOString().slice(0, 10) + '.json';
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = name;
            link.click();
            URL.revokeObjectURL(link.href);
            await logAudit('backup_download', { collections: BACKUP_COLLECTIONS.length });
            toast('Backup downloaded', 'success');
        }

        async function importCompanyBackup(jsonText) {
            if (!state.user || !state.user.companyId) {
                throw new Error('No company selected');
            }
            let data;
            try {
                data = JSON.parse(jsonText);
            } catch (e) {
                throw new Error('Invalid JSON file');
            }
            if (!data || data.version !== 1 || !data.collections) {
                throw new Error('Not a valid PetroManager backup (expected version 1)');
            }
            const targetCompanyId = state.user.companyId;
            if (data.companyId && data.companyId !== targetCompanyId) {
                throw new Error('This backup belongs to a different company. Import cancelled for safety.');
            }

            let written = 0;
            showLoading(true);
            try {
                if (data.company) {
                    const { id, ...rest } = data.company;
                    await updateCompany(targetCompanyId, {
                        name: rest.name,
                        tagline: rest.tagline,
                        address: rest.address,
                        phone: rest.phone,
                        email: rest.email,
                        tax_id: rest.tax_id,
                        website: rest.website,
                        logo_url: rest.logo_url
                    });
                }
                for (const col of BACKUP_COLLECTIONS) {
                    const items = data.collections[col] || [];
                    for (const item of items) {
                        if (!item.id) continue;
                        const { id, ...rest } = item;
                        rest.companyId = targetCompanyId;
                        await db.collection(col).doc(String(id)).set(rest, { merge: true });
                        written++;
                    }
                }
                await logAudit('backup_import', { docs: written });
                return written + ' document(s) written.';
            } finally {
                showLoading(false);
            }
        }

        let _backupReminderTimer = null;

        function setupBackupReminder() {
            if (_backupReminderTimer) {
                clearInterval(_backupReminderTimer);
                _backupReminderTimer = null;
            }
            let pref = null;
            try {
                pref = JSON.parse(localStorage.getItem('petro_backup_reminder') || 'null');
            } catch (e) {}
            if (!pref || !pref.enabled || !pref.time) return;

            _backupReminderTimer = setInterval(() => {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                if ((hh + ':' + mm) !== pref.time) return;
                const todayKey = 'petro_backup_reminded_' + now.toISOString().slice(0, 10);
                if (localStorage.getItem(todayKey)) return;
                localStorage.setItem(todayKey, '1');
                toast('⏰ Daily backup reminder – open Company → Download Backup', 'warning');
            }, 30000);
        }

        async function doLogin(companyId, userId, password) {
            const errEl = $('#loginError');
            errEl.style.display = 'none';
            errEl.textContent = '';
            if (!companyId || !userId || !password) {
                errEl.textContent = 'Please fill all fields';
                errEl.style.display = 'block';
                return false;
            }
            try {
                showLoading(true);
                const doc = await db.collection('users').doc(userId).get();
                if (!doc.exists) {
                    errEl.textContent = 'User not found';
                    errEl.style.display = 'block';
                    return false;
                }
                const user = { id: doc.id, ...doc.data() };
                if (user.companyId !== companyId) {
                    errEl.textContent = 'User does not belong to this company';
                    errEl.style.display = 'block';
                    return false;
                }
                if (user.active === false) {
                    errEl.textContent = 'This account is disabled';
                    errEl.style.display = 'block';
                    return false;
                }
                const hashed = await hashPassword(password);
                if (user.password !== hashed && user.password !== password) {
                    errEl.textContent = 'Incorrect password';
                    errEl.style.display = 'block';
                    return false;
                }
                if (user.password === password) {
                    await db.collection('users').doc(userId).update({ password: hashed });
                    user.password = hashed;
                }
                state.user = user;
                localStorage.setItem('petro_session', JSON.stringify({
                    userId: user.id,
                    companyId: user.companyId,
                    ts: Date.now()
                }));
                await loadStations();
                await loadCashiers();
                initApp();
                await logAudit('login', { username: user.username });

                errEl.style.display = 'block';
                return false;

                showLoading(false);

                const raw = localStorage.getItem('petro_session');
                if (!raw) return false;
                const sess = JSON.parse(raw);
                if (!sess.userId || !sess.companyId) return false;
                if (sess.ts && (Date.now() - sess.ts > 7 * 24 * 60 * 60 * 1000)) {
                    localStorage.removeItem('petro_session');
                    return false;
                }
                const doc = await db.collection('users').doc(sess.userId).get();
                if (!doc.exists) {
                    localStorage.removeItem('petro_session');
                    return false;
                }
                const user = { id: doc.id, ...doc.data() };
                if (user.active === false || user.companyId !== sess.companyId) {
                    localStorage.removeItem('petro_session');
                    return false;
                }
                state.user = user;
                await loadStations();
                await loadCashiers();
                initApp();
                return true;

                    '<div><strong>Users sample:</strong> ' + usersSnap.size + '</div>' +
                    '<div><strong>Online:</strong> ' + (navigator.onLine ? 'Yes' : 'No') + '</div>';

        // Wire login UI
        document.addEventListener('DOMContentLoaded', async function() {
            await loadCompaniesForLogin();
            const restored = await tryRestoreSession();
            if (!restored) {
                $('#loginScreen').style.display = 'flex';
            }

            $('#loginCompany').onchange = function() {
                loadUsersForCompany(this.value);
            };

            $('#loginForm').onsubmit = async function(e) {
                e.preventDefault();

                const userId = $('#loginUsername').value;
                const password = $('#loginPassword').value;

                $('#normalLogin').style.display = 'none';
                $('#createCompanyForm').style.display = 'block';

            $('#cancelCreateCompanyBtn').onclick = function() {
                $('#createCompanyForm').style.display = 'none';
                $('#normalLogin').style.display = 'block';

                if (e.target.closest('#headerLogout')) {
                    e.preventDefault();
                    logout();
                }
                if (e.target.closest('#headerSwitchUser')) {
                    e.preventDefault();
                    logout();
                }

                toggle.onclick = function() {
                    $('#sidebar').classList.toggle('open');

        });

        console.log('Part 3 loaded');
    </script>
    <script>
        // ============================================================
        // Part 4: App Init, Sidebar & Navigation
        // ============================================================

        function initApp() {
            const role = roleNorm(state.user.role);
            const name = state.user.name || state.user.username || 'User';
            $('#sidebarUser').textContent = name;
            $('#sidebarRole').textContent = state.user.role;
            $('#headerUser').textContent = name;
            $('#headerRole').textContent = state.user.role;
            $('#headerAvatar').textContent = name.charAt(0).toUpperCase();
            if (state.user.companyId) {
                getCompany(state.user.companyId).then(c => {
                    if (c) $('#headerCompany').textContent = '🏢 ' + c.name;
                }).catch(() => {});
            }
            if (role === 'cashier') {
                if (!state.user.station_id) {
                    toast('No station assigned to this cashier', 'warning');
                    logout();
                    return;
                }
                state.currentStationId = Number(state.user.station_id);
                $('#stationSelector').style.display = 'none';
            } else {
                state.currentStationId = null;
                $('#stationSelector').style.display = 'block';
                updateStationDropdown();
            }
            buildSidebar();
            $('#loginScreen').style.display = 'none';
            $('#appMain').style.display = 'block';
            navigate('dashboard');
            $('#stationSelector').onchange = function() {
                const v = $('#stationSelector').value;
                state.currentStationId = v ? Number(v) : null;
                renderPage(state.currentPage);
            };
            setupBackupReminder();
        }

        function buildSidebar() {
            const role = roleNorm(state.user.role);
            let links = [];
            if (role === 'cashier') {
                links = [
                    { page: 'dashboard', icon: 'bi-grid-1x2-fill', label: 'Dashboard' },
                    { page: 'shifts', icon: 'bi-clock-history', label: 'My Shifts' },
                    { page: 'meters', icon: 'bi-speedometer2', label: 'Meter Readings' },
                    { page: 'sales', icon: 'bi-cart-check', label: 'Sales' },
                    { page: 'summary', icon: 'bi-clipboard-data', label: 'Shift Summary' }
                ];
            } else {
                links = [
                    { page: 'dashboard', icon: 'bi-grid-1x2-fill', label: 'Dashboard' },
                    { page: 'sales', icon: 'bi-cart-check', label: 'Sales' },
                    { page: 'shifts', icon: 'bi-clock-history', label: 'Shifts' },
                    { page: 'meters', icon: 'bi-speedometer2', label: 'Meters' },
                    { page: 'summary', icon: 'bi-clipboard-data', label: 'Summary' },
                    { page: 'balancing', icon: 'bi-scales', label: 'Balancing' },
                    { page: 'inventory', icon: 'bi-box-seam', label: 'Inventory' },
                    { page: 'stock', icon: 'bi-truck', label: 'Offloading' },
                    { page: 'adjustments', icon: 'bi-sliders', label: 'Adjustments' },
                    { page: 'financials', icon: 'bi-bank', label: 'Financials' },
                    { page: 'customers', icon: 'bi-people', label: 'Customers' },
                    { page: 'receipts', icon: 'bi-receipt', label: 'Receipts' },
                    { page: 'reports', icon: 'bi-bar-chart-line', label: 'Reports' },
                    { page: 'users', icon: 'bi-person-gear', label: 'Users' },
                    { page: 'activity', icon: 'bi-journal-text', label: 'Activity Log' },
                    { page: 'company', icon: 'bi-building', label: 'Company' }
                ];
                if (role === 'super_admin') {
                    links.push({ page: 'companies', icon: 'bi-buildings', label: 'All Companies' });
                }
            }
            const nav = $('#sidebarNav');
            nav.innerHTML = links.map(l =>
                `<a class="nav-link" data-page="${l.page}" href="#"><i class="bi ${l.icon}"></i> ${l.label}</a>`
            ).join('');
            nav.querySelectorAll('.nav-link').forEach(a => {
                a.onclick = function(e) {
                    e.preventDefault();
                    navigate(this.dataset.page);
                    if (window.innerWidth < 769) {
                        $('#sidebar').classList.remove('open');
                    }
                };
            });
        }

        function navigate(page) {
            state.currentPage = page;
            $$('#sidebarNav .nav-link').forEach(a => {
                a.classList.toggle('active', a.dataset.page === page);
            });
            const titles = {
                dashboard: 'Dashboard',
                sales: 'Sales',
                shifts: 'Shifts',
                meters: 'Meter Readings',
                summary: 'Shift Summary',
                balancing: 'Tank Balancing',
                inventory: 'Inventory',
                stock: 'Offloading',
                adjustments: 'Stock Adjustments',
                financials: 'Financials',
                customers: 'Customers',
                receipts: 'Receipts',
                reports: 'Reports',
                users: 'Users',
                activity: 'Activity Log',
                company: 'Company Profile',
                companies: 'All Companies'
            };
            $('#pageTitle').textContent = titles[page] || page;
            renderPage(page);
        }

        async function renderPage(page) {
            const content = $('#pageContent');
            content.innerHTML =
                '<div class="text-center py-5"><div class="spinner text-primary"></div><p class="mt-3 text-muted">Loading...</p></div>';
            try {
                switch (page) {
                    case 'dashboard':
                        await renderDashboard();
                        break;
                    case 'sales':
                        await renderSales();
                        break;
                    case 'shifts':
                        await renderShifts();
                        break;
                    case 'meters':
                        await renderMeters();
                        break;
                    case 'summary':
                        await renderShiftSummary();
                        break;
                    case 'balancing':
                        await renderBalancing();
                        break;
                    case 'inventory':
                        await renderInventory();
                        break;
                    case 'stock':
                        await renderStock();
                        break;
                    case 'adjustments':
                        await renderAdjustments();
                        break;
                    case 'financials':
                        await renderFinancials();
                        break;
                    case 'customers':
                        await renderCustomers();
                        break;
                    case 'receipts':
                        await renderReceipts();
                        break;
                    case 'reports':
                        await renderReports();
                        break;
                    case 'users':
                        await renderUsers();
                        break;
                    case 'activity':
                        await renderActivity();
                        break;
                    case 'company':
                        await renderCompanyProfile();
                        break;
                    case 'companies':
                        await renderAllCompanies();
                        break;
                    default:
                        content.innerHTML = '<div class="alert alert-warning">Page not found</div>';
                }
            } catch (err) {
                console.error('renderPage', page, err);
                content.innerHTML = '<div class="alert alert-danger">Error loading page: ' + err.message + '</div>';
            }
        }

        console.log('Part 4 loaded');
    </script>
    <script>
        // ============================================================
        // Part 5a: Dashboard, Charts, Sales (form + cart)
        // ============================================================

        async function renderDashboard() {
            const company = await getCompany(state.user.companyId);
            const companyData = company || {
                name: 'PetroManager',
                tagline: 'Fuel Management System',
                address: 'Kampala, Uganda',
                phone: '+256 700 000 000',
                email: 'info@petromanager.ug',
                tax_id: 'UG-1234567',
                website: 'www.petromanager.ug',
                logo_url: ''
            };
            const inv = await getAll('inventory');
            const sales = await getAll('sales');
            const shifts = await getAll('shifts');
            const fInv = inv.filter(i => !state.currentStationId || Number(i.station_id) === state.currentStationId);
            const fSales = sales.filter(s => s.status !== 'reversed' && (!state.currentStationId || Number(s
            .station_id) === state.currentStationId));
            const fShifts = shifts.filter(s => !state.currentStationId || Number(s.station_id) === state.currentStationId);
            const totalLitres = fInv.reduce((sum, i) => sum + (i.quantity || 0), 0);
            const totalSales = fSales.reduce((sum, x) => sum + (x.amount || 0), 0);
            const today = new Date().toDateString();
            const todaySales = fSales.filter(s => {
                const d = s.created_at && s.created_at.toDate ? s.created_at.toDate() : new Date(s.created_at);
                return d.toDateString() === today;
            }).reduce((sum, x) => sum + (x.amount || 0), 0);
            const activeShifts = fShifts.filter(s => s.status === 'active').length;
            const stationLabel = state.currentStationId ? stationName(state.currentStationId) : 'All Stations';
            const lowStockItems = await checkLowStock();
            const lowCount = lowStockItems ? lowStockItems.length : 0;

            let html = `
            <div class="hero">
              <div class="d-flex justify-content-between align-items-start flex-wrap">
                <div style="flex:1; min-width:250px;">
                  <div class="company">
                    ${companyData.logo_url ? `<img src="${companyData.logo_url}" style="height:50px;margin-right:10px;border-radius:8px;">` : ''}
                    ${companyData.name || 'PetroManager'}
                  </div>
                  <div class="tag">${companyData.tagline || ''}</div>
                  <div class="details" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 20px; margin-top: 12px; background: rgba(255,255,255,0.08); padding: 12px 16px; border-radius: 8px;">
                    ${companyData.address ? `<span><i class="bi bi-geo-alt"></i> ${companyData.address}</span>` : ''}
                    ${companyData.phone ? `<span><i class="bi bi-telephone"></i> ${companyData.phone}</span>` : ''}
                    ${companyData.email ? `<span><i class="bi bi-envelope"></i> ${companyData.email}</span>` : ''}
                    ${companyData.tax_id ? `<span><i class="bi bi-receipt"></i> Tax: ${companyData.tax_id}</span>` : ''}
                    ${companyData.website ? `<span><i class="bi bi-globe"></i> ${companyData.website}</span>` : ''}
                    <span><i class="bi bi-pin-map"></i> ${stationLabel}</span>
                    <span><i class="bi bi-person-badge"></i> ${state.user.role}</span>
                  </div>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
                  ${canManageCompany(state.user.role) ? `<button class="btn btn-sm btn-outline-light" id="editCompanyBtn"><i class="bi bi-pencil"></i> Edit Company</button>` : ''}
                  <button class="btn btn-sm btn-outline-light" id="dailyReportBtn"><i class="bi bi-envelope"></i> Copy Report</button>
                </div>
              </div>
            </div>

            <div class="stat-grid">
              <div class="stat-item"><div class="icon" style="background:#0d6efd;"><i class="bi bi-box-seam"></i></div>
                <div><div class="num">${totalLitres.toFixed(0)} L</div><div class="lbl">Total Stock</div></div></div>
              <div class="stat-item"><div class="icon" style="background:#198754;"><i class="bi bi-cash-stack"></i></div>
                <div><div class="num">${formatMoney(totalSales)}</div><div class="lbl">Total Sales</div></div></div>
              <div class="stat-item"><div class="icon" style="background:#ffc107;"><i class="bi bi-calendar-day"></i></div>
                <div><div class="num">${formatMoney(todaySales)}</div><div class="lbl">Today's Sales</div></div></div>
              <div class="stat-item"><div class="icon" style="background:#dc3545;"><i class="bi bi-clock-history"></i></div>
                <div><div class="num">${activeShifts}</div><div class="lbl">Active Shifts</div></div></div>
              <div class="stat-item"><div class="icon" style="background:#dc3545;"><i class="bi bi-exclamation-triangle"></i></div>
                <div><div class="num">${lowCount}</div><div class="lbl">Low Stock Items</div></div></div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-6 col-md-4 col-lg-2"><div class="card-box text-center quick-action-card" onclick="navigate('sales')">
                <i class="bi bi-cart-plus fs-3 text-primary"></i><div class="fw-semibold mt-1">Sales</div></div></div>
              <div class="col-6 col-md-4 col-lg-2"><div class="card-box text-center quick-action-card" onclick="navigate('balancing')">
                <i class="bi bi-balance-scale fs-3 text-warning"></i><div class="fw-semibold mt-1">Balance</div></div></div>
              <div class="col-6 col-md-4 col-lg-2"><div class="card-box text-center quick-action-card" onclick="navigate('inventory')">
                <i class="bi bi-box-seam fs-3 text-success"></i><div class="fw-semibold mt-1">Inventory</div></div></div>
              <div class="col-6 col-md-4 col-lg-2"><div class="card-box text-center quick-action-card" onclick="navigate('stock')">

              <div class="col-6 col-md-4 col-lg-2"><div class="card-box text-center quick-action-card" onclick="navigate('financials')">

        async function renderCharts() {
            const sales = await getAll('sales');
            const filtered = sales.filter(s => s.status !== 'reversed' && (!state.currentStationId || Number(s
            .station_id) === state.currentStationId));
            const byProduct = {};
            filtered.forEach(s => {
                const p = s.product_type || 'Unknown';
                if (!byProduct[p]) byProduct[p] = 0;
                byProduct[p] += Number(s.amount) || 0;
            });
            const byDate = {};
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const key = d.toLocaleDateString('en-GB');
                byDate[key] = 0;
            }
            filtered.forEach(s => {
                const d = s.created_at ? (s.created_at.toDate ? s.created_at.toDate() : new Date(s.created_at)) :
                    new Date();
                const key = d.toLocaleDateString('en-GB');
                if (byDate[key] !== undefined) byDate[key] += Number(s.amount) || 0;
            });
            $('#pageContent').innerHTML += `
            <div class="row g-3 mt-3">
              <div class="col-md-6"><div class="card-box"><h6>Sales by Product</h6><canvas id="productChart" height="200"></canvas></div></div>
              <div class="col-md-6"><div class="card-box"><h6>Last 7 Days Sales</h6><canvas id="trendChart" height="200"></canvas></div></div>
            </div>`;
            const ctx1 = document.getElementById('productChart');
            if (ctx1) {
                new Chart(ctx1.getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(byProduct),
                        datasets: [{ data: Object.values(byProduct), backgroundColor: ['#0d6efd', '#ffc107',
                                '#dc3545', '#198754', '#6f42c1'
                            ] }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                });
            }
            const ctx2 = document.getElementById('trendChart');
            if (ctx2) {
                new Chart(ctx2.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: Object.keys(byDate),
                        datasets: [{ label: 'Daily Sales', data: Object.values(byDate), borderColor: '#0d6efd',
                            backgroundColor: 'rgba(13,110,253,0.1)', fill: true, tension: 0.4 }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, ticks: { callback: v => formatMoney(v) } } }
                    }
                });
            }
        }

            const inv = await getAll('inventory');
            const sales = (await getAll('sales'))
                .filter(s => !state.currentStationId || Number(s.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));

            let html = `

                      ? `<td><span class="badge bg-secondary">Reversed</span></td>`
                      : `<td><button class="btn btn-sm btn-outline-warning reverse-sale-btn" data-id="${s.id}" data-qty="${s.quantity}" data-product="${s.product_type}" data-station="${s.station_id}" title="Reverse this sale"><i class="bi bi-arrow-counterclockwise"></i> Reverse</button></td>`
                    ) : ''}
                  </tr>`;
                });
            }

            html += `</tbody></table></div></div></div></div>`;
            $('#pageContent').innerHTML = html;

            // --- Auto price from inventory ---
            async function updatePrice() {
                const stationId = Number($('#saleStation').value);
                const product = $('#saleProduct').value;
                if (!stationId) { $('#salePrice').value = ''; return; }
                const item = inv.find(i => Number(i.station_id) === stationId && i.product_type === product);
                $('#salePrice').value = (item && item.selling_price) ? Number(item.selling_price) : '';
            }
            $('#saleStation').onchange = updatePrice;
            $('#saleProduct').onchange = updatePrice;
            if (roleNorm(state.user.role) === 'cashier' && state.user.station_id) {
                $('#saleStation').value = state.user.station_id;
            }
            setTimeout(updatePrice, 50);

            $('#saleDiscType').onchange = function() {
                $('#saleDiscValue').disabled = this.value === 'none';
                if (this.value === 'none') $('#saleDiscValue').value = '';
                renderCartBox();
            };
            $('#saleDiscValue').oninput = function() { renderCartBox(); };

            function calcDiscount(subtotal) {
                const type = $('#saleDiscType').value;
                const val = parseFloat($('#saleDiscValue').value) || 0;
                if (type === 'none' || val <= 0) return 0;
                if (type === 'fixed') return Math.min(val, subtotal);
                if (type === 'percent') return Math.min((val / 100) * subtotal, subtotal);
                return 0;
            }

            function renderCartBox() {
                const box = $('#cartBox');
                const btn = $('#completeSaleBtn');
                if (!cart.length) {
                    box.innerHTML = '<p class="text-muted small mb-0">Cart is empty</p>';
                    btn.disabled = true;
                    return;
                }
                let subtotal = 0;
                let rows = cart.map((item, idx) => {
                    const line = item.qty * item.price;
                    subtotal += line;
                    return `<div class="d-flex justify-content-between align-items-center border-bottom py-1 small">
                          <span>${item.product} · ${item.qty.toFixed(2)}L × ${formatMoney(item.price)}</span>
                          <span>
                            <strong>${formatMoney(line)}</strong>
                            <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-2 remove-cart" data-i="${idx}">&times;</button>
                          </span>
                        </div>`;
                }).join('');
                const disc = calcDiscount(subtotal);
                const total = Math.max(0, subtotal - disc);
                box.innerHTML = rows +
                    `<div class="mt-2 small">Subtotal: <strong>${formatMoney(subtotal)}</strong></div>` +
                    (disc > 0 ? `<div class="small text-danger">Discount: −${formatMoney(disc)}</div>` : '') +
                    `<div class="fw-bold">Total: ${formatMoney(total)}</div>`;
                btn.disabled = false;
                box.querySelectorAll('.remove-cart').forEach(b => {
                    b.onclick = function() {
                        cart.splice(Number(this.dataset.i), 1);
                        renderCartBox();
                    };
                });
            }

            $('#addToCartBtn').onclick = function() {
                const stationId = Number($('#saleStation').value);
                const product = $('#saleProduct').value;
                const qty = parseFloat($('#saleQty').value);
                const price = parseFloat($('#salePrice').value);
                if (!stationId) { toast('Select a station', 'warning'); return; }
                if (!qty || qty <= 0) { toast('Enter a valid quantity', 'warning'); return; }
                if (!price || price <= 0) { toast('Price not set in inventory for this product', 'warning'); return; }
                const existing = cart.find(i => i.stationId === stationId && i.product === product);
                if (existing) existing.qty += qty;
                else cart.push({ stationId, product, qty, price });
                $('#saleQty').value = '';
                renderCartBox();
                toast(product + ' added to cart');
            };

            $('#completeSaleBtn').onclick = async function() {
                if (!cart.length) return;
                const stationId = cart[0].stationId;
                const cashierId = $('#saleCashier').value;
                const saleDate = $('#saleDate').value;
                const payment = $('#salePayment').value;
                const customer = ($('#saleCustomer').value || '').trim() || 'Walk-in';
                const subtotal = cart.reduce((s, i) => s + i.qty * i.price, 0);
                const disc = calcDiscount(subtotal);
                const grandTotal = Math.max(0, subtotal - disc);
                const btn = this;
                btn.disabled = true;
                btn.innerHTML = '<i class="bi bi-hourglass"></i> Processing...';
                try {
                    const transactionId = 'TXN_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                    await db.runTransaction(async (transaction) => {
                        const refs = cart.map(item => db.collection('inventory').doc(item.stationId + '_' + item
                            .product));
                        const docs = await Promise.all(refs.map(r => transaction.get(r)));
                        const updates = [];
                        cart.forEach((item, idx) => {
                            const doc = docs[idx];
                            if (!doc.exists) throw new Error('No inventory for ' + item.product);
                            const currentQty = doc.data().quantity || 0;
                            if (currentQty < item.qty) throw new Error('Insufficient ' + item.product +
                                '. Available: ' + currentQty.toFixed(2) + 'L');
                            updates.push({ ref: doc.ref, newQty: currentQty - item.qty, cost: doc.data()
                                    .cost_price || 0 });
                        });
                        updates.forEach(u => transaction.update(u.ref, {
                            quantity: u.newQty,
                            last_updated: firebase.firestore.FieldValue.serverTimestamp()
                        }));
                        cart.forEach((item, idx) => {
                            const saleRef = db.collection('sales').doc();
                            const lineAmount = item.qty * item.price;
                            const lineDiscount = subtotal > 0 ? (lineAmount / subtotal) * disc : 0;
                            transaction.set(saleRef, {
                                station_id: item.stationId,
                                product_type: item.product,
                                quantity: item.qty,
                                selling_price: item.price,
                                cost_price: updates[idx].cost,
                                amount: lineAmount - lineDiscount,
                                discount: lineDiscount,
                                gross_amount: lineAmount,
                                payment_method: payment,
                                customer_name: customer,
                                transaction_id: transactionId,
                                recorded_by: cashierId,
                                sale_date: saleDate,
                                companyId: state.user.companyId,
                                created_at: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        });
                    });
                    await logAudit('cart_sale', { station: stationId, items: cart.length, total: grandTotal });
                    toast('Sale complete!', 'success');
                    const cashierName = (state.cashiers.find(c => c.id === cashierId) || {}).name || '—';
                    printReceipt({
                        transactionId,
                        items: cart.map(i => ({ product: i.product, qty: i.qty, price: i.price })),
                        total: grandTotal,
                        discount: disc,
                        payment,
                        customer,
                        cashier: cashierName,
                        station: stationName(stationId)
                    });
                    cart = [];
                    renderSales();
                } catch (err) {
                    toast('Sale failed: ' + err.message, 'danger');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-check-circle"></i> Complete Sale';
                }
            };

            document.querySelectorAll('.reverse-sale-btn').forEach(btn => {
                btn.onclick = async function() {
                    const id = this.dataset.id;
                    const qty = parseFloat(this.dataset.qty);
                    const product = this.dataset.product;
                    const stationId = Number(this.dataset.station);
                    if (!confirm('Reverse sale of ' + qty + 'L ' + product +
                        '?\n\nHistory is kept. Stock is restored.')) return;
                    try {
                        await adjustInventory(stationId, product, qty);
                        await updateDoc('sales', id, {
                            status: 'reversed',
                            reversed_at: firebase.firestore.FieldValue.serverTimestamp(),
                            reversed_by: state.user.id
                        });
                        await logAudit('reverse_sale', { saleId: id, product, qty });
                        toast('Sale reversed. Stock restored.', 'success');
                        renderSales();
                    } catch (err) {
                        toast('Error: ' + err.message, 'danger');
                    }
                };
            });
        }

        // ---- Shifts ----
        async function renderShifts() {
            const shifts = (await getAll('shifts'))
                .filter(s => !state.currentStationId || Number(s.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
            const isCashier = roleNorm(state.user.role) === 'cashier';
            const myActive = shifts.find(s => s.cashier_id === state.user.id && s.status === 'active');

            let formHtml = '';
            if (isCashier) {
                if (!myActive) {
                    formHtml = `<form id="startShiftForm">
                    <div class="mb-2"><label class="form-label small">Station</label>
                      <select id="shiftStation" class="form-select form-select-sm" disabled>
                        <option>${stationName(state.user.station_id)}</option>
                      </select></div>
                    <div class="mb-2"><label class="form-label small">Shift Type</label>
                      <select id="shiftType" class="form-select form-select-sm"><option value="day">Day</option><option value="night">Night</option></select></div>
                    <div class="mb-2"><label class="form-label small">Opening Meters (L)</label>
                      <div class="row g-1">
                        <div class="col-4"><input type="number" id="startPetrol" class="form-control form-control-sm" placeholder="Petrol" step="0.01" required></div>
                        <div class="col-4"><input type="number" id="startDiesel" class="form-control form-control-sm" placeholder="Diesel" step="0.01"></div>
                        <div class="col-4"><input type="number" id="startGas" class="form-control form-control-sm" placeholder="Gas" step="0.01"></div>
                      </div></div>
                    <button type="submit" class="btn btn-success w-100">Start Shift</button></form>`;
                } else {
                    formHtml = `<form id="endShiftForm">
                    <p class="small text-muted">Active ${myActive.shift_type} shift since ${formatDateTime(myActive.created_at)}</p>
                    <div class="mb-2"><label class="form-label small">Closing Meters (L)</label>
                      <div class="row g-1">
                        <div class="col-4"><input type="number" id="endPetrol" class="form-control form-control-sm" placeholder="Petrol" step="0.01" required></div>
                        <div class="col-4"><input type="number" id="endDiesel" class="form-control form-control-sm" placeholder="Diesel" step="0.01"></div>
                        <div class="col-4"><input type="number" id="endGas" class="form-control form-control-sm" placeholder="Gas" step="0.01"></div>
                      </div></div>
                    <button type="submit" class="btn btn-danger w-100">End Shift</button></form>`;
                }
            } else {
                formHtml = '<p class="text-muted small">Cashiers manage their own shifts. View history below.</p>';
            }

            let html =
                `<div class="row g-4">
                <div class="col-lg-4"><div class="card-box"><h5 class="mb-3"><i class="bi bi-clock"></i> ${isCashier ? 'My Shift' : 'Shifts'}</h5> ${formHtml}</div></div>
                <div class="col-lg-8"><div class="card-box"><h5 class="mb-3">Shift History</h5>
                  <div class="table-responsive"><table class="table table-sm table-hover">
                    <thead><tr><th>Station</th><th>Type</th><th>Start P/D/G</th><th>End P/D/G</th><th>Status</th></tr></thead><tbody>`;

            if (!shifts.length) {
                html += '<tr><td colspan="5" class="text-muted text-center">No shifts</td></tr>';
            } else {
                shifts.slice(0, 30).forEach(s => {
                    const start = (s.start_petrol || 0) + ' / ' + (s.start_diesel || 0) + ' / ' + (s.start_gas ||
                    0);
                    const end = s.status === 'closed' ? ((s.end_petrol || 0) + ' / ' + (s.end_diesel || 0) +
                        ' / ' + (s.end_gas || 0)) : '—';
                    html += `<tr>
                    <td>${stationName(s.station_id)}</td>
                    <td><span class="${s.shift_type === 'day' ? 'badge-day' : 'badge-night'}">${s.shift_type}</span></td>
                    <td class="fs-xs">${start}</td>
                    <td class="fs-xs">${end}</td>
                    <td><span class="${s.status === 'active' ? 'badge-active' : 'badge-closed'}">${s.status}</span></td>
                  </tr>`;
                });
            }
            html += `</tbody></table></div></div></div></div>`;
            $('#pageContent').innerHTML = html;

            const startForm = $('#startShiftForm');
            if (startForm) {
                startForm.onsubmit = async function(e) {
                    e.preventDefault();
                    await addDoc('shifts', {
                        station_id: Number(state.user.station_id),
                        cashier_id: state.user.id,
                        shift_type: $('#shiftType').value,
                        start_petrol: parseFloat($('#startPetrol').value) || 0,
                        start_diesel: parseFloat($('#startDiesel').value) || 0,
                        start_gas: parseFloat($('#startGas').value) || 0,
                        end_petrol: null,
                        end_diesel: null,
                        end_gas: null,
                        status: 'active'
                    });
                    await logAudit('start_shift', {});
                    toast('Shift started');
                    renderShifts();
                };
            }
            const endForm = $('#endShiftForm');
            if (endForm) {
                endForm.onsubmit = async function(e) {
                    e.preventDefault();
                    await updateDoc('shifts', myActive.id, {
                        end_petrol: parseFloat($('#endPetrol').value) || 0,
                        end_diesel: parseFloat($('#endDiesel').value) || 0,
                        end_gas: parseFloat($('#endGas').value) || 0,
                        status: 'closed',
                        ended_at: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    await logAudit('end_shift', { shiftId: myActive.id });
                    toast('Shift ended');
                    renderShifts();
                };
            }
        }

        // ---- Meters (simple view of latest shift meters) ----
        async function renderMeters() {
            const shifts = (await getAll('shifts'))
                .filter(s => !state.currentStationId || Number(s.station_id) === state.currentStationId)
                .sort((a, b) => (b.created_at && b.created_at.seconds || 0) - (a.created_at && a.created_at.seconds || 0));
            let html = `<div class="card-box"><h5 class="mb-3">Meter Readings (from shifts)</h5>
                  <div class="table-responsive"><table class="table table-sm table-hover">
                    <thead><tr><th>Station</th><th>Shift</th><th>Status</th><th>Start P/D/G</th><th>End P/D/G</th><th>Date</th></tr></thead><tbody>`;
            if (!shifts.length) {
                html += '<tr><td colspan="6" class="text-muted text-center">No meter data</td></tr>';
            } else {
                shifts.slice(0, 40).forEach(s => {
                    html += `<tr>
                    <td>${stationName(s.station_id)}</td>
                    <td><span class="${s.shift_type === 'day' ? 'badge-day' : 'badge-night'}">${s.shift_type}</span></td>
                    <td><span class="${s.status === 'active' ? 'badge-active' : 'badge-closed'}">${s.status}</span></td>
                    <td class="fs-xs">${s.start_petrol || 0} / ${s.start_diesel || 0} / ${s.start_gas || 0}</td>
                    <td class="fs-xs">${s.status === 'closed' ? ((s.end_petrol || 0) + ' / ' + (s.end_diesel || 0) + ' / ' + (s.end_gas || 0)) : '—'}</td>
                    <td class="fs-xs">${formatDateTime(s.created_at)}</td>
                  </tr>`;
                });
            }
            html += `</tbody></table></div></div>`;
            $('#pageContent').innerHTML = html;
        }

        // ---- Shift Summary ----
        async function renderShiftSummary() {
            const role = roleNorm(state.user.role);
            const isCashier = role === 'cashier';
            let sales = (await getAll('sales')).filter(s => s.status !== 'reversed');
            if (state.currentStationId) sales = sales.filter(s => Number(s.station_id) === state.currentStationId);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const todaySales = sales.filter(s => {
                const d = s.created_at ? (s.created_at.toDate ? s.created_at.toDate() : new Date(s.created_at)) :
                    new Date();
                return d >= today && d < tomorrow;
            });
            const mySales = isCashier ? todaySales.filter(s => s.recorded_by === state.user.id) : todaySales;
            let totalQty = 0,
                totalRevenue = 0;
            const byProduct = {};
            mySales.forEach(s => {
                const qty = Number(s.quantity) || 0;
                const amt = Number(s.amount) || 0;
                totalQty += qty;
                totalRevenue += amt;
                const p = s.product_type || 'Unknown';
                if (!byProduct[p]) byProduct[p] = { qty: 0, revenue: 0 };
                byProduct[p].qty += qty;
                byProduct[p].revenue += amt;
            });
            let productRows = Object.keys(byProduct).map(p =>
                `<tr><td>${p}</td><td>${byProduct[p].qty.toFixed(2)} L</td><td>${formatMoney(byProduct[p].revenue)}</td></tr>`
            ).join('') || '<tr><td colspan="3" class="text-muted">No sales today</td></tr>';

            $('#pageContent').innerHTML = `
              <div class="card-box">
                <h5 class="mb-3">${isCashier ? 'My' : 'Station'} Shift Summary — Today</h5>
                <div class="stat-grid mb-3">
                  <div class="stat-item"><div class="icon" style="background:#198754;"><i class="bi bi-cash"></i></div>
                    <div><div class="num">${formatMoney(totalRevenue)}</div><div class="lbl">Revenue</div></div></div>
                  <div class="stat-item"><div class="icon" style="background:#0d6efd;"><i class="bi bi-droplet"></i></div>
                    <div><div class="num">${totalQty.toFixed(2)} L</div><div class="lbl">Quantity</div></div></div>
                  <div class="stat-item"><div class="icon" style="background:#ffc107;"><i class="bi bi-receipt"></i></div>
                    <div><div class="num">${mySales.length}</div><div class="lbl">Transactions</div></div></div>
                </div>
                <table class="table table-sm"><thead><tr><th>Product</th><th>Qty</th><th>Revenue</th></tr></thead>
                  <tbody>${productRows}</tbody></table>
              </div>`;
        }

        console.log('Part 5b loaded – Sales, Shifts, Meters, Summary complete');
    </script>
    <script>
        // ============================================================
        // Part 6: Balancing, Inventory, Stock (Offloading), Adjustments
        // ============================================================

        async function renderBalancing() {
            const shifts = (await getAll('shifts'))
                .filter(s => s.status === 'closed' && (!state.currentStationId || Number(s.station_id) === state
                    .currentStationId));
            const recons = await getAll('reconciliations');
            const inv = await getAll('inventory');

            let html = `<div class="card-box">
                <h5 class="mb-3"><i class="bi bi-balance-scale"></i> Cashier Reconciliation</h5>
                <p class="text-muted small">Expected revenue = meter difference × current selling prices from inventory.</p>
                <div class="table-responsive"><table class="table table-sm table-bordered">
                  <thead><tr>
                    <th>Station</th><th>Shift</th><th>Petrol</th><th>Diesel</th><th>Gas</th>
